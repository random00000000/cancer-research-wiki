<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">癌症说法过滤器</title>
  <desc id="desc">公共安全信息图：在相信癌症预防或治疗说法前，先做五项检查。</desc>
  <rect width="1200" height="760" fill="#f7f4ee"/>
  <rect x="48" y="42" width="1104" height="676" rx="22" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="88" y="112" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="50" font-weight="700" fill="#18212f">相信癌症说法之前</text>
  <text x="90" y="155" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#46515f">给预防建议、神奇疗法和社媒方案的五道过滤。</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <rect x="90" y="205" width="196" height="245" rx="14" fill="#e8f1f2" stroke="#1b5d66" stroke-width="2"/>
    <circle cx="188" cy="272" r="46" fill="#1b5d66"/>
    <text x="188" y="288" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="116" y="348" font-size="23" font-weight="700" fill="#18212f">有人体</text>
    <text x="116" y="379" font-size="23" font-weight="700" fill="#18212f">结果吗?</text>
    <text x="116" y="417" font-size="18" fill="#46515f">不只是细胞、</text>
    <text x="116" y="440" font-size="18" fill="#46515f">老鼠或炒作。</text>
    <rect x="303" y="205" width="196" height="245" rx="14" fill="#fff1d9" stroke="#a26119" stroke-width="2"/>
    <circle cx="401" cy="272" r="46" fill="#a26119"/>
    <text x="401" y="288" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="329" y="348" font-size="23" font-weight="700" fill="#18212f">绝对</text>
    <text x="329" y="379" font-size="23" font-weight="700" fill="#18212f">影响?</text>
    <text x="329" y="417" font-size="18" fill="#46515f">多少人受益</text>
    <text x="329" y="440" font-size="18" fill="#46515f">或受害?</text>
    <rect x="516" y="205" width="196" height="245" rx="14" fill="#e9ecff" stroke="#3e4d9a" stroke-width="2"/>
    <circle cx="614" cy="272" r="46" fill="#3e4d9a"/>
    <text x="614" y="288" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="542" y="348" font-size="23" font-weight="700" fill="#18212f">可重复吗?</text>
    <text x="542" y="390" font-size="18" fill="#46515f">不止一个团队、</text>
    <text x="542" y="413" font-size="18" fill="#46515f">试验或人群?</text>
    <rect x="729" y="205" width="196" height="245" rx="14" fill="#fde8e6" stroke="#ad3434" stroke-width="2"/>
    <circle cx="827" cy="272" r="46" fill="#ad3434"/>
    <text x="827" y="288" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="755" y="348" font-size="23" font-weight="700" fill="#18212f">有伤害吗?</text>
    <text x="755" y="390" font-size="18" fill="#46515f">毒性、相互作用、</text>
    <text x="755" y="413" font-size="18" fill="#46515f">营养不良?</text>
    <rect x="942" y="205" width="168" height="245" rx="14" fill="#e8f4df" stroke="#50742d" stroke-width="2"/>
    <circle cx="1026" cy="272" r="46" fill="#50742d"/>
    <text x="1026" y="288" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="966" y="348" font-size="23" font-weight="700" fill="#18212f">延误</text>
    <text x="966" y="379" font-size="23" font-weight="700" fill="#18212f">照护?</text>
    <text x="966" y="417" font-size="18" fill="#46515f">会替代已证实</text>
    <text x="966" y="440" font-size="18" fill="#46515f">照护吗?</text>
  </g>
  <rect x="90" y="500" width="485" height="112" rx="16" fill="#18212f"/>
  <text x="124" y="545" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">若未通过过滤</text>
  <text x="124" y="584" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#d9e4ef">称为初步、误导或危险。</text>
  <rect x="625" y="500" width="485" height="112" rx="16" fill="#f4d35e" stroke="#8a6a00" stroke-width="2"/>
  <text x="659" y="545" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#18212f">若涉及治疗</text>
  <text x="659" y="584" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#18212f">请让肿瘤团队参与决定。</text>
  <text x="90" y="665" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" fill="#46515f">好的癌症研究会提出难题。好的公共指导等待人体证据，并保护人们免受延误、毒性和虚假确定性。</text>
</svg>
