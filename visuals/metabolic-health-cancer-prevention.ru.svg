<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Движение, питание и метаболизм влияют на риск рака</title>
  <desc id="desc">Публичная инфографика о движении, пищевом паттерне, жировой ткани, метаболических сигналах, доступе и снижении риска без стыда за тело.</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#26312b" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial" font-size="42" font-weight="800" fill="#102033">Движение, питание и метаболизм важны</text>
  <text x="94" y="154" font-family="Arial" font-size="24" fill="#334155">Снижение риска - это биология плюс системы, не стыд за тело и не чудо-диеты.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Двигаться, где можно</text><text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Активность может улучшать</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">инсулин, воспаление, иммунный</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">тонус и энергобаланс.</text><text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Публичный путь</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Больше движения, меньше сидения,</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">с учетом безопасности.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Паттерн лучше моды</text><text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Цельные злаки, клетчатка,</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">овощи, фрукты и бобовые</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">сильнее чудо-обещаний.</text><text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Публичный путь</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Больше продуктов с клетчаткой;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">меньше переработанного мяса.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Сигналы метаболизма</text><text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Жировая ткань может менять</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">гормоны, инсулин/IGF,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">воспаление и адипокины.</text><text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Публичный путь</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Поддерживать метаболизм</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">без обвинения и гарантий.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Системы важны</text><text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Доступ к еде, безопасные улицы, время,</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">инвалидность, стресс, сон, работа и доход.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text><text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Диета, упражнения или размер тела не дают гарантии.</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Симптомы, диабет, беременность, инвалидность,</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">РПП или лечение рака требуют поддержки врача.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Источники: WCRF/AICR; Moore 2016; Matthews 2020; клетчатка/цельные злаки; механизмы ожирение-рак.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Лучшая формулировка: облегчить здоровый путь; снижение риска не является обвинением.</text>
</svg>
