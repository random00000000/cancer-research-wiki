<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">How mRNA cancer vaccines narrow targets</title>
  <desc id="desc">Public explainer showing how many tumor mutations are filtered into a smaller set of candidate neoantigens, with safety boundaries around clinical infrastructure.</desc>
  <rect width="1500" height="980" fill="#f6f8f7"/>
  <rect x="48" y="44" width="1404" height="892" rx="24" fill="#ffffff" stroke="#263541" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102033">A mutation is not automatically a vaccine target</text>
  <text x="94" y="154" font-family="Arial" font-size="24" fill="#25364a">Personalized mRNA cancer vaccines use a clinical filter to narrow many mutations into a few candidate immune targets.</text>

  <rect x="90" y="220" width="1320" height="125" rx="16" fill="#e6f2ee" stroke="#147d64" stroke-width="3"/>
  <text x="130" y="270" font-family="Arial" font-size="30" font-weight="800" fill="#0f513f">1. Start with tumor and normal samples</text>
  <text x="130" y="310" font-family="Arial" font-size="22" fill="#17324d">Sequencing compares cancer DNA/RNA with normal tissue to find tumor changes.</text>
  <text x="1030" y="303" font-family="Arial" font-size="42" font-weight="800" fill="#147d64">many changes</text>

  <polygon points="270,385 1230,385 1130,500 370,500" fill="#eef4ff" stroke="#4961c8" stroke-width="3"/>
  <text x="420" y="433" font-family="Arial" font-size="30" font-weight="800" fill="#18244d">2. Filter for visible targets</text>
  <text x="420" y="470" font-family="Arial" font-size="21" fill="#25364a">Is the mutation expressed, processed, and likely shown by this person's HLA molecules?</text>

  <polygon points="390,535 1110,535 1018,650 482,650" fill="#fff0d7" stroke="#c26a0a" stroke-width="3"/>
  <text x="510" y="583" font-family="Arial" font-size="30" font-weight="800" fill="#4a2a03">3. Rank for immune usefulness</text>
  <text x="510" y="620" font-family="Arial" font-size="21" fill="#25364a">Good targets should be tumor-relevant, presentable, and hard for the tumor to escape.</text>

  <polygon points="520,685 980,685 900,790 600,790" fill="#f4e9ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="610" y="730" font-family="Arial" font-size="28" font-weight="800" fill="#3b1a78">4. Encode selected candidates</text>
  <text x="610" y="762" font-family="Arial" font-size="20" fill="#25364a">mRNA carries the chosen target instructions.</text>

  <rect x="612" y="812" width="276" height="66" rx="33" fill="#102033"/>
  <text x="652" y="854" font-family="Arial" font-size="29" font-weight="800" fill="#ffffff">few candidates</text>

  <rect x="90" y="690" width="330" height="172" rx="16" fill="#f9fafb" stroke="#9aa8b2" stroke-width="2"/>
  <text x="120" y="732" font-family="Arial" font-size="26" font-weight="800" fill="#102033">Why so strict?</text>
  <text x="120" y="770" font-family="Arial" font-size="20" fill="#25364a">Targets can fail if they are</text>
  <text x="120" y="798" font-family="Arial" font-size="20" fill="#25364a">not displayed, not shared by</text>
  <text x="120" y="826" font-family="Arial" font-size="20" fill="#25364a">enough tumor cells, or easy</text>
  <text x="120" y="854" font-family="Arial" font-size="20" fill="#25364a">for cancer to lose.</text>

  <rect x="1080" y="690" width="330" height="172" rx="16" fill="#fff7c2" stroke="#9a7a04" stroke-width="2"/>
  <text x="1110" y="732" font-family="Arial" font-size="26" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="1110" y="770" font-family="Arial" font-size="20" fill="#25364a">This is not a recipe.</text>
  <text x="1110" y="798" font-family="Arial" font-size="20" fill="#25364a">Target selection belongs in</text>
  <text x="1110" y="826" font-family="Arial" font-size="20" fill="#25364a">regulated clinical research</text>
  <text x="1110" y="854" font-family="Arial" font-size="20" fill="#25364a">and oncology care.</text>

  <text x="92" y="912" font-family="Arial" font-size="18" fill="#334155">Evidence anchors: KEYNOTE-942; autogene cevumeran studies; antigen presentation, delivery, manufacturing, and immune-escape source cards.</text>
</svg>
