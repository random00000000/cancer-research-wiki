<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">mRNA癌症治疗需要临床基础设施</title>
  <desc id="desc">科普图：个体化mRNA癌症治疗需要肿瘤样本、测序、抗原选择、受监管生产、质量检测、临床给药、监测和证据评估。</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="70" y="76" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">个体化mRNA癌症治疗是一条临床链</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="21" fill="#334155">目标是理解试验并提出更好的问题，而不是自己制作治疗。</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="165" width="160" height="108" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="94" y="205" font-size="18" font-weight="700" fill="#1e3a8a">肿瘤样本</text><text x="94" y="236" font-size="15" fill="#1e40af">足够可用组织</text>
    <rect x="270" y="165" width="160" height="108" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="293" y="205" font-size="18" font-weight="700" fill="#155e75">测序</text><text x="293" y="236" font-size="15" fill="#0e7490">肿瘤与正常样本</text>
    <rect x="470" y="165" width="160" height="108" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="493" y="205" font-size="18" font-weight="700" fill="#92400e">靶点排序</text><text x="493" y="236" font-size="15" fill="#a16207">HLA与表达</text>
    <rect x="670" y="165" width="160" height="108" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="694" y="205" font-size="18" font-weight="700" fill="#9d174d">mRNA产品</text><text x="694" y="236" font-size="15" fill="#be185d">试验方案内</text>
    <rect x="870" y="165" width="160" height="108" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="894" y="205" font-size="18" font-weight="700" fill="#166534">放行检测</text><text x="894" y="236" font-size="15" fill="#15803d">身份和无菌</text>
    <path d="M232 219 H266M432 219 H466M632 219 H666M832 219 H866" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="170" y="360" width="230" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="196" y="400" font-size="20" font-weight="700" fill="#0f172a">临床给药</text><text x="196" y="432" font-size="16" fill="#334155">肿瘤科团队</text><text x="196" y="458" font-size="16" fill="#334155">方案时间安排</text><text x="196" y="484" font-size="16" fill="#334155">联合治疗背景</text>
    <rect x="485" y="360" width="230" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="511" y="400" font-size="20" font-weight="700" fill="#0f172a">监测</text><text x="511" y="432" font-size="16" fill="#334155">不良事件</text><text x="511" y="458" font-size="16" fill="#334155">免疫检测</text><text x="511" y="484" font-size="16" fill="#334155">影像和复发</text>
    <rect x="800" y="360" width="230" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="826" y="400" font-size="20" font-weight="700" fill="#0f172a">证据评估</text><text x="826" y="432" font-size="16" fill="#334155">终点</text><text x="826" y="458" font-size="16" fill="#334155">获益和风险</text><text x="826" y="484" font-size="16" fill="#334155">监管监督</text>
    <path d="M950 275 C950 315 915 330 915 356M800 435 H720M485 435 H405" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="70" y="590" width="1060" height="92" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="100" y="630" font-size="22" font-weight="700" fill="#9a3412">安全边界</text><text x="100" y="660" font-size="18" fill="#7c2d12">这不是剂量、生产、采购或自行给药指南。</text>
  </g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
</svg>
