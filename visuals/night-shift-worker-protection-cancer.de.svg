<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Nachtarbeit ist eine Systembelastung</title>
  <desc id="desc">Offentliche Infografik zu sichereren Nachtschichtsystemen: weniger Storung, Licht und Erholung, Mitsprache und Unsicherheit beim Krebsrisiko.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">Nachtarbeit ist eine Systembelastung</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">Schutze den Rhythmus durch bessere Schichten, Licht, Erholung und Mitsprache.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Storung verringern</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Unnotige Nachte vermeiden;</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">lange Folgen von Nachtschichten</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">moglichst begrenzen.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Planbare, menschliche</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">Dienstplane nutzen.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Licht und Erholung</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Arbeitslicht kann wach halten;</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">Dunkelheit nach der Schicht</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">schutzt Schlaf und Rhythmus.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Licht, Heimweg, Mahlzeiten</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">und Schlaf planen.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Mitsprache</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Menschen brauchen Personal,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">Pausen, Kinderbetreuung,</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">Transport und Anpassungen.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Sicherheit ist Pflicht von</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">Arbeitgebern und Politik.</text>
  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="30" font-weight="800" fill="#ffffff">Systeme mit Schutzbedarf</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Kliniken, Fabriken, Verkehr, Lager,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">Dienstleistung, Sicherheit und Pflege</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">brauchen Krebspravention mit.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Sicherheitsgrenze</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Gefahrliche Mudigkeit, Sekundenschlaf am</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Steuer, Schlafapnoe, schwere Insomnie,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">Schwangerschaft oder Medikamente brauchen</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">klinische oder arbeitsmedizinische Hilfe.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidenzanker: NTP/IARC-Bewertungen; Schichtplan-Papiere; Schlaf- und Licht-Reviews.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Sicherere Plane konnen circadiane Belastung und Ermudung senken; sie garantieren keine Krebsvermeidung.</text>
</svg>
