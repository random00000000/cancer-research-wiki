<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Radon-safe homes are lung cancer prevention</title>
  <desc id="desc">A public infographic explaining invisible radon exposure, home testing, mitigation, smoking interaction, building systems, and medical safety boundaries.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="800" fill="#102033">Radon-safe homes are lung cancer prevention</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Radon is invisible. Testing and mitigation turn hidden exposure into an action path.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Invisible gas</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Radon can seep from</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">soil and rock into homes</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">and build up indoors.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">You cannot see or smell it;</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">measure the home.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Test, then mitigate</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Testing finds elevated</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">levels. Mitigation reduces</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">long-term exposure.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Use local thresholds and</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">qualified mitigation help.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Smoking multiplies risk</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Radon matters for everyone,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">but absolute risk is much</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">higher with tobacco exposure.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Test homes and support</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">quitting without blame.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Systems matter</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Building codes, rentals, schools, workplaces,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">and mitigation funding shape who is protected.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">A radon visual is not a lung symptom checker.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Persistent cough, coughing blood, chest pain,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">or unexplained shortness of breath need care.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: residential radon meta-analysis; European and North American pooled analyses; never-smoker radon evidence.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Radon action levels, testing units, tenant rights, and mitigation rules vary by country and region.</text>
</svg>
