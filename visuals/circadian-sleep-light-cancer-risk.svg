<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Protect the body clock where life allows</title>
  <desc id="desc">A public infographic explaining circadian disruption, night shift work, light at night, sleep timing, systems support, and cancer-risk uncertainty.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">Protect the body clock where life allows</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Circadian disruption is biology plus work, light, stress, caregiving, illness, and access.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Keep rhythm</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Regular dark sleep helps</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">coordinate hormones, repair,</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">immunity, and metabolism.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Protect regular sleep</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">where life allows.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Reduce night light</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Bright light at night can</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">shift clocks and suppress</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">melatonin signals.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Dim late light; get daylight</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">when possible.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Design safer shifts</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Night work is an exposure,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">not a personal failure.</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">Scheduling and recovery matter.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Protect workers with safer</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">rotations and recovery time.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Systems matter</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Caregiving, illness, housing, poverty, unsafe work,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">and stress can disrupt sleep. Do not blame bodies.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Sleep advice is not diagnosis or cancer treatment.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Severe insomnia, sleep apnea symptoms, depression,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">or dangerous fatigue need clinical support.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: IARC night-shift monograph; breast cancer meta-analyses; light-at-night reviews; sleep umbrella reviews.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Better rhythm can support health; it does not guarantee cancer prevention or erase occupational and social risk.</text>
</svg>
