<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">危险困倦需要支持</title>
  <desc id="desc">公共信息图：区分普通夜班疲劳和需要临床或职业健康支持的睡眠障碍警示信号。</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102033">危险困倦需要支持</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">夜班会让人疲劳，但严重或不安全的症状需要帮助。</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">知道界线</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">与工作时间相关的失眠</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">或过度困倦，可能是</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">睡眠-觉醒障碍。</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">不是每个夜班者都有；</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">危险信号很重要。</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">检查其他原因</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">打鼾、呼吸暂停、疼痛、</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">抑郁、药物或怀孕</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">都会改变风险。</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">不要把所有睡眠问题</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">都归因于夜班。</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">建立支持</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">需要排班审查、休息选择、</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">转诊路径和无惩罚</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">疲劳报告。</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">疲劳安全是雇主和</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">健康系统问题。</text>
  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">不要自行猜药</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">褪黑素、咖啡因时间、安眠药</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">和促醒药都需要时机、风险</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">评估和临床指导。</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">紧急求助</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">疲劳驾驶险情、呼吸暂停、严重失眠、</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">不自觉睡着、怀孕担忧或自伤想法</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">需要临床或职业健康支持。</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">证据锚点：轮班睡眠障碍综述；轮班者睡眠障碍研究；临床睡眠医学摘要。</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">睡眠障碍照护支持安全和健康；它不是癌症治疗，也不能证明风险消失。</text>
</svg>
