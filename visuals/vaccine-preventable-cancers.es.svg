<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Algunas vacunas previenen canceres futuros</title>
  <desc id="desc">Infografia publica sobre vacuna contra VPH, vacuna contra hepatitis B, prevencion del cancer, acceso, tamizaje y lenguaje sin estigma.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" fill="#102033">Algunas vacunas previenen canceres futuros</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Prevenir cancer puede empezar bloqueando infecciones que impulsan la biologia tumoral.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Vacuna VPH</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Previene infecciones por</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">VPH de alto riesgo que</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">pueden causar cancer.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Vacunar antes de la</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">exposicion cuando sea posible.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Vacuna VHB</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Previene hepatitis B,</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">que puede volverse cronica</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">y danar el higado.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">La dosis al nacer y la serie</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">completa importan.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">El sistema lo completa</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Se necesitan acceso,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">confianza, seguimiento,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">tamizaje y tratamiento.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Mantener las rutas de cuidado</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">y el tamizaje recomendado.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#fff">Sin estigma</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">VPH y hepatitis son infecciones, no etiquetas morales.</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">La prevencion debe ser normal y accesible.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Limite de seguridad</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Las reglas varian por edad, pais, embarazo,</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">inmunidad, dosis previas e historia medica.</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">Use orientacion clinica local.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidencia: Lei NEJM 2020; programa VPH de Inglaterra; vacunacion VHB en Taiwan; carga de cancer atribuible a infecciones.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">La vacunacion reduce riesgo; no garantiza riesgo cero ni reemplaza tamizaje o seguimiento recomendado.</text>
</svg>
