<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title desc">
  <title id="title">Welche Krebspräventionshebel je Krebsort am wichtigsten sind</title>
  <desc id="desc">Öffentliche Krebspräventionsgrafik, die Krebsorte mit wichtigen Hebeln für Prävention, Impfung, Screening und Expositionssenkung verbindet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="0.45" stop-color="#fff7ed"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#111827" flood-opacity="0.13"/></filter>
    <style>
      .title { font: 800 45px Arial, Helvetica, sans-serif; fill: #102033; letter-spacing: 0; }
      .subtitle { font: 400 23px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }
      .site { font: 800 25px Arial, Helvetica, sans-serif; fill: #102033; letter-spacing: 0; }
      .lever { font: 700 18px Arial, Helvetica, sans-serif; fill: #102033; letter-spacing: 0; }
      .body { font: 400 17px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }
      .small { font: 400 16px Arial, Helvetica, sans-serif; fill: #475569; letter-spacing: 0; }
      .source { font: 700 15px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }
      .lightSite { font: 800 27px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .lightBody { font: 400 18px Arial, Helvetica, sans-serif; fill: #e2e8f0; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #d8e2ef; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .pill { stroke-width: 2; rx: 18; }
    </style>
  </defs>
  <rect width="1500" height="1100" fill="url(#bg)"/>
  <g transform="translate(70 56)"><text class="title" x="0" y="58">Welche Präventionshebel wiegen am meisten?</text><text class="subtitle" x="2" y="100">Verschiedene Krebsarten haben verschiedene Schwachstellen. Nutzen Sie dies als Fragenkarte, nicht als persönlichen Rat.</text><rect x="0" y="136" width="1360" height="4" fill="#cbd5e1"/></g>
  <g transform="translate(70 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#2563eb"/><text class="site" x="76" y="58">Darm / Rektum</text><rect class="pill" x="30" y="88" width="120" height="34" fill="#dbeafe" stroke="#2563eb"/><text class="lever" x="50" y="111">Screening</text><rect class="pill" x="165" y="88" width="120" height="34" fill="#dcfce7" stroke="#16a34a"/><text class="lever" x="187" y="111">Bewegung</text><text class="body" x="30" y="158">Ballaststoffe und Vollkorn helfen.</text><text class="body" x="30" y="187">Weniger verarbeitetes/rotes</text><text class="body" x="30" y="214">Fleisch und Alkohol.</text></g>
  <g transform="translate(420 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#7c3aed"/><text class="site" x="76" y="58">Gebärmutterhals</text><rect class="pill" x="30" y="88" width="132" height="34" fill="#ede9fe" stroke="#7c3aed"/><text class="lever" x="50" y="111">HPV-Impfung</text><rect class="pill" x="178" y="88" width="112" height="34" fill="#dbeafe" stroke="#2563eb"/><text class="lever" x="198" y="111">Screening</text><text class="body" x="30" y="158">Vorstufen behandeln.</text><text class="body" x="30" y="187">Zugang und Nachsorge sind</text><text class="body" x="30" y="214">zentrale Hebel.</text></g>
  <g transform="translate(770 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#f97316"/><text class="site" x="76" y="58">Leber</text><rect class="pill" x="30" y="88" width="120" height="34" fill="#ffedd5" stroke="#f97316"/><text class="lever" x="48" y="111">HBV-Impfung</text><rect class="pill" x="165" y="88" width="124" height="34" fill="#ecfeff" stroke="#0891b2"/><text class="lever" x="186" y="111">HCV-Therapie</text><text class="body" x="30" y="158">Alkoholschäden senken.</text><text class="body" x="30" y="187">Stoffwechsel und Aflatoxin</text><text class="body" x="30" y="214">hängen von der Region ab.</text></g>
  <g transform="translate(1120 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#ef4444"/><text class="site" x="76" y="58">Lunge</text><rect class="pill" x="30" y="88" width="122" height="34" fill="#fee2e2" stroke="#ef4444"/><text class="lever" x="49" y="111">Kein Rauch</text><rect class="pill" x="167" y="88" width="124" height="34" fill="#e0f2fe" stroke="#0284c7"/><text class="lever" x="196" y="111">Radon</text><text class="body" x="30" y="158">Arbeit und Luft zählen auch.</text><text class="body" x="30" y="187">Hochrisiko-Screening nur</text><text class="body" x="30" y="214">unter Leitlinienbedingungen.</text></g>
  <g transform="translate(70 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#d97706"/><text class="site" x="76" y="58">Haut</text><rect class="pill" x="30" y="88" width="116" height="34" fill="#fef3c7" stroke="#d97706"/><text class="lever" x="65" y="111">UV</text><rect class="pill" x="162" y="88" width="126" height="34" fill="#fee2e2" stroke="#ef4444"/><text class="lever" x="179" y="111">Kein Solarium</text><text class="body" x="30" y="158">Schatten, Kleidung, Sonnencreme</text><text class="body" x="30" y="187">und Arbeitsschutz kombinieren.</text><text class="body" x="30" y="214">Veränderte Läsionen prüfen.</text></g>
  <g transform="translate(420 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#db2777"/><text class="site" x="76" y="58">Brust</text><rect class="pill" x="30" y="88" width="120" height="34" fill="#fce7f3" stroke="#db2777"/><text class="lever" x="50" y="111">Screening</text><rect class="pill" x="165" y="88" width="120" height="34" fill="#ffedd5" stroke="#f97316"/><text class="lever" x="195" y="111">Alkohol</text><text class="body" x="30" y="158">Körperliche Aktivität hilft.</text><text class="body" x="30" y="187">Gesundes Gewicht nach</text><text class="body" x="30" y="214">Menopause ist wichtig.</text></g>
  <g transform="translate(770 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#0f766e"/><text class="site" x="76" y="58">Magen</text><rect class="pill" x="30" y="88" width="126" height="34" fill="#ccfbf1" stroke="#0f766e"/><text class="lever" x="52" y="111">H. pylori</text><rect class="pill" x="171" y="88" width="116" height="34" fill="#fef3c7" stroke="#d97706"/><text class="lever" x="205" y="111">Salz</text><text class="body" x="30" y="158">Test und Therapie hängen</text><text class="body" x="30" y="187">von lokalem Risiko ab.</text><text class="body" x="30" y="214">Weniger verarbeitet; kein Rauch.</text></g>
  <g transform="translate(1120 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#9333ea"/><text class="site" x="76" y="58">Mund / Rachen</text><rect class="pill" x="30" y="88" width="116" height="34" fill="#fee2e2" stroke="#ef4444"/><text class="lever" x="56" y="111">Tabak</text><rect class="pill" x="162" y="88" width="126" height="34" fill="#ede9fe" stroke="#7c3aed"/><text class="lever" x="182" y="111">HPV-Impfung</text><text class="body" x="30" y="158">Weniger Alkohol senkt Risiko.</text><text class="body" x="30" y="187">Betel/Gutka meiden, wo</text><text class="body" x="30" y="214">diese Produkte genutzt werden.</text></g>
  <g transform="translate(110 780)"><rect x="0" y="0" width="1280" height="140" rx="26" fill="#102033"/><text class="lightSite" x="38" y="52">Muster lesen</text><text class="lightBody" x="38" y="88">Einige Hebel wirken vor Krebs: Impfungen, kein Tabak, UV-Schutz, weniger Alkohol, sichere Arbeit und Luft.</text><text class="lightBody" x="38" y="118">Andere finden Krebs oder Vorstufen früher: Screening, Läsionskontrolle und Nachsorgesysteme.</text></g>
  <g transform="translate(110 955)"><rect x="0" y="0" width="1280" height="72" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text class="small" x="26" y="29">Geringeres Risiko ist kein Nullrisiko. Symptome, Erbrisiko, Vorbefunde und lokale Leitlinien brauchen ärztliche Einordnung.</text><text class="source" x="26" y="55">Quellenbasis: prevention/cancer-site-prevention-map.md; NCI, WHO, WCRF/AICR.</text></g>
</svg>
