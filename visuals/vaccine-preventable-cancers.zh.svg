<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">有些疫苗可以预防未来的癌症</title>
  <desc id="desc">面向公众的信息图，说明 HPV 疫苗、乙肝疫苗、癌症预防、可及性、筛查随访和去污名化表达。</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#fff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="48" font-weight="800" fill="#102033">有些疫苗可以预防未来的癌症</text>
  <text x="94" y="154" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#334155">癌症预防可以从阻断会推动癌变的感染开始。</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">1</text>
  <text x="122" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#102033">HPV 疫苗</text>
  <text x="122" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">预防高危 HPV 感染，</text><text x="122" y="424" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">这些感染可导致宫颈癌</text><text x="122" y="452" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">和其他一些癌症。</text>
  <text x="122" y="512" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="800" fill="#102033">公众方向</text><text x="122" y="548" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">尽可能在暴露前接种。</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">2</text>
  <text x="585" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#102033">乙肝疫苗</text>
  <text x="585" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">预防乙型肝炎感染，</text><text x="585" y="424" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">这种感染可能变成慢性，</text><text x="585" y="452" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">并增加肝癌风险。</text>
  <text x="585" y="512" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="800" fill="#102033">公众方向</text><text x="585" y="548" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">出生剂量和完整接种</text><text x="585" y="576" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">程序都很重要。</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">3</text>
  <text x="1048" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="29" font-weight="800" fill="#102033">系统完成路径</text>
  <text x="1048" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">疫苗还需要可及性、</text><text x="1048" y="424" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">信任、随访、筛查、</text><text x="1048" y="452" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">检测和治疗。</text>
  <text x="1048" y="512" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="800" fill="#102033">公众方向</text><text x="1048" y="548" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">保持照护路径畅通；</text><text x="1048" y="576" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">不要跳过建议筛查。</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="31" font-weight="800" fill="#fff">不要污名化</text>
  <text x="130" y="748" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#f8fafc">HPV 和肝炎是感染，不是道德标签。</text><text x="130" y="778" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#f8fafc">预防应当正常、可获得。</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="31" font-weight="800" fill="#102033">安全边界</text>
  <text x="814" y="748" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#111827">疫苗规则因年龄、国家、怀孕、</text><text x="814" y="778" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#111827">免疫状态、既往剂量和病史而异。</text><text x="814" y="808" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#111827">请遵循当地临床指导。</text>
  <text x="92" y="890" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#334155">证据锚点：Lei NEJM 2020；英格兰 HPV 项目；台湾乙肝疫苗项目；感染归因癌症负担研究。</text>
  <text x="92" y="920" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748b">接种可降低风险；不能保证零风险，也不能替代建议的筛查和随访。</text>
</svg>
