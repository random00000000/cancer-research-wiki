<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Cancer screening and vaccination decision guide</title>
  <desc id="desc">A public cancer prevention visual explaining when screening and vaccination questions should be personalized by symptoms, age, anatomy, risk, benefits, harms, and follow-up access.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.52" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#effdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 800 52px Arial, Helvetica, sans-serif; fill: #102033; letter-spacing: 0; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }
      .section { font: 800 31px Arial, Helvetica, sans-serif; fill: #102033; letter-spacing: 0; }
      .label { font: 700 23px Arial, Helvetica, sans-serif; fill: #102033; letter-spacing: 0; }
      .body { font: 400 21px Arial, Helvetica, sans-serif; fill: #24364b; letter-spacing: 0; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #475569; letter-spacing: 0; }
      .source { font: 700 15px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #d8e2ef; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .line { stroke: #475569; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="url(#bg)"/>

  <g transform="translate(70 60)">
    <text class="title" x="0" y="60">Screening and vaccines are cancer prevention tools</text>
    <text class="subtitle" x="2" y="102">The useful question is not “Should everyone do every test?” It is “Which tool fits this person, risk, and follow-up path?”</text>
    <rect x="0" y="138" width="1260" height="4" fill="#cbd5e1"/>
  </g>

  <g transform="translate(70 235)">
    <rect class="card" x="0" y="0" width="380" height="270"/>
    <circle cx="55" cy="62" r="34" fill="#ef4444"/>
    <text class="section" x="105" y="72">Symptoms?</text>
    <text class="body" x="36" y="130">New, persistent, or worrying</text>
    <text class="body" x="36" y="158">symptoms are not screening.</text>
    <text class="label" x="36" y="212">Get medical evaluation.</text>
    <text class="small" x="36" y="242">Do not wait for a routine screen.</text>
  </g>

  <path class="line" d="M450 370 L515 370"/>

  <g transform="translate(515 235)">
    <rect class="card" x="0" y="0" width="395" height="270"/>
    <circle cx="58" cy="62" r="34" fill="#2563eb"/>
    <text class="section" x="108" y="72">No symptoms?</text>
    <text class="body" x="36" y="128">Then ask what applies:</text>
    <text class="body" x="36" y="164">age, anatomy, prior results,</text>
    <text class="body" x="36" y="198">family history, smoking, infections,</text>
    <text class="body" x="36" y="232">immune status, and local guidance.</text>
  </g>

  <path class="line" d="M910 370 L975 370"/>

  <g transform="translate(975 235)">
    <rect class="card" x="0" y="0" width="355" height="270"/>
    <circle cx="55" cy="62" r="34" fill="#16a34a"/>
    <text class="section" x="105" y="72">Choose tools</text>
    <text class="body" x="36" y="128">Some tools prevent cancer.</text>
    <text class="body" x="36" y="160">Some find cancer earlier.</text>
    <text class="body" x="36" y="192">Some are not for everyone.</text>
    <text class="label" x="36" y="238">Match tool to risk.</text>
  </g>

  <g transform="translate(70 570)">
    <rect class="card" x="0" y="0" width="390" height="250"/>
    <text class="section" x="34" y="56">Vaccines</text>
    <text class="body" x="34" y="104">HPV vaccination can prevent</text>
    <text class="body" x="34" y="132">infections that cause several cancers.</text>
    <text class="body" x="34" y="172">Hepatitis B vaccination helps</text>
    <text class="body" x="34" y="200">prevent some liver cancer.</text>
  </g>

  <g transform="translate(505 570)">
    <rect class="card" x="0" y="0" width="390" height="250"/>
    <text class="section" x="34" y="56">Screening</text>
    <text class="body" x="34" y="104">Recommended screening can find</text>
    <text class="body" x="34" y="132">some cancers earlier.</text>
    <text class="body" x="34" y="172">Some screening can find and remove</text>
    <text class="body" x="34" y="200">precancerous changes.</text>
  </g>

  <g transform="translate(940 570)">
    <rect class="card" x="0" y="0" width="390" height="250"/>
    <text class="section" x="34" y="56">Tradeoffs</text>
    <text class="body" x="34" y="104">False alarms, missed cancers,</text>
    <text class="body" x="34" y="132">overdiagnosis, procedures, cost,</text>
    <text class="body" x="34" y="160">stress, and access all matter.</text>
    <text class="label" x="34" y="210">Follow-up is part of screening.</text>
  </g>

  <g transform="translate(70 870)">
    <rect x="0" y="0" width="1260" height="72" rx="24" fill="#102033"/>
    <text x="34" y="45" style="font: 700 24px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0;">Safe takeaway: ask which prevention tools fit your age, body, history, risk, local guidance, and ability to get follow-up care.</text>
  </g>

  <text class="source" x="70" y="975">Source backbone: screening public guidance, screening harms/tradeoffs, infection-related cancer prevention, HPV/HBV vaccine and screening evidence pages. Educational only, not medical advice.</text>
</svg>
