<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Cancer : comment les cellules enfreignent les règles du corps</title>
  <desc id="desc">Infographie en français expliquant comment le cancer commence et grandit, et comment réduire le risque sans promettre un risque nul.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#f5fff8"/>
    </linearGradient>
    <linearGradient id="cellGood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75d7b3"/>
      <stop offset="1" stop-color="#1f9d8a"/>
    </linearGradient>
    <linearGradient id="cellRisk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbc70"/>
      <stop offset="1" stop-color="#e85d5d"/>
    </linearGradient>
    <linearGradient id="cellTumor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c678dd"/>
      <stop offset="1" stop-color="#6a45b8"/>
    </linearGradient>
    <style>
      .title { font: 800 43px Arial, Helvetica, sans-serif; fill: #102033; }
      .subtitle { font: 400 24px Arial, Helvetica, sans-serif; fill: #31445c; }
      .section { font: 800 29px Arial, Helvetica, sans-serif; fill: #102033; }
      .label { font: 700 21px Arial, Helvetica, sans-serif; fill: #102033; }
      .body { font: 400 20px Arial, Helvetica, sans-serif; fill: #24364b; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .tiny { font: 400 15px Arial, Helvetica, sans-serif; fill: #5b6b7f; }
      .card { fill: #ffffff; stroke: #d8e2ef; stroke-width: 2; rx: 22; }
      .line { stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="1700" fill="url(#bg)"/>

  <g transform="translate(60 55)">
    <text class="title" x="0" y="52">Cancer : cellules hors des règles</text>
    <text class="subtitle" x="2" y="92">Ce que c'est, comment cela grandit, et comment réduire le risque sans promesse absolue.</text>
    <rect x="0" y="125" width="1080" height="4" fill="#cbd5e1"/>
  </g>

  <g transform="translate(60 220)">
    <rect class="card" x="0" y="0" width="320" height="370"/>
    <text class="section" x="24" y="48">1. Cellule normale</text>
    <circle cx="160" cy="145" r="78" fill="url(#cellGood)"/>
    <circle cx="160" cy="145" r="38" fill="#e6fff6"/>
    <path d="M128 146 C142 120, 177 120, 192 146 C176 171, 142 171, 128 146 Z" fill="none" stroke="#126c60" stroke-width="8"/>
    <text class="body" x="24" y="260">Les tissus sains ont des contrôles :</text>
    <text class="small" x="24" y="295">croître avec un signal, réparer</text>
    <text class="small" x="24" y="322">les dommages, éliminer les cellules dangereuses.</text>
  </g>

  <g transform="translate(440 220)">
    <rect class="card" x="0" y="0" width="320" height="370"/>
    <text class="section" x="24" y="48">2. Les changements s'accumulent</text>
    <circle cx="160" cy="145" r="78" fill="url(#cellRisk)"/>
    <circle cx="160" cy="145" r="37" fill="#fff6db"/>
    <path d="M125 138 L148 118 L170 168 L197 105" fill="none" stroke="#9a3412" stroke-width="9" stroke-linecap="round"/>
    <text class="body" x="24" y="260">Expositions, infections, âge,</text>
    <text class="small" x="24" y="295">risque hérité et erreurs de copie</text>
    <text class="small" x="24" y="322">peuvent modifier les instructions.</text>
  </g>

  <g transform="translate(820 220)">
    <rect class="card" x="0" y="0" width="320" height="370"/>
    <text class="section" x="24" y="48">3. Comportement cancéreux</text>
    <circle cx="136" cy="130" r="62" fill="url(#cellTumor)"/>
    <circle cx="195" cy="168" r="47" fill="#8b5cf6" opacity="0.9"/>
    <circle cx="111" cy="195" r="38" fill="#a855f7" opacity="0.9"/>
    <text class="body" x="24" y="260">Les cellules peuvent trop se diviser,</text>
    <text class="small" x="24" y="295">échapper aux défenses, attirer des vaisseaux,</text>
    <text class="small" x="24" y="322">envahir et parfois se propager.</text>
  </g>

  <path class="line" d="M380 405 H440"/>
  <path d="M420 389 L448 405 L420 421 Z" fill="#64748b"/>
  <path class="line" d="M760 405 H820"/>
  <path d="M800 389 L828 405 L800 421 Z" fill="#64748b"/>

  <g transform="translate(60 660)">
    <rect class="card" x="0" y="0" width="1080" height="260"/>
    <text class="section" x="30" y="50">La boucle de base</text>
    <text class="body" x="30" y="88">Une cellule altérée survit, se multiplie, s'adapte et transforme le tissu autour d'elle.</text>
    <text class="body" x="30" y="126">La racine n'est pas un seul déclencheur : gènes, immunité, métabolisme, environnement,</text>
    <text class="body" x="30" y="164">âge, infections et accès à la prévention interagissent.</text>
    <text class="small" x="30" y="213">Il faut donc prévention, détection précoce, biologie et meilleurs traitements ensemble.</text>
  </g>

  <g transform="translate(60 1000)">
    <text class="section" x="0" y="0">Réduire le risque : moins probable, pas impossible</text>
    <text class="body" x="0" y="36">Ces actions sont étayées par des preuves, mais ne garantissent pas une vie sans cancer.</text>

    <g transform="translate(0 75)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Pas de tabac</text>
      <text class="small" x="22" y="78">Éviter la fumée; soutenir l'arrêt.</text>
    </g>
    <g transform="translate(278 75)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Moins d'alcool</text>
      <text class="small" x="22" y="78">Moins est plus sûr; zéro évite ce risque.</text>
    </g>
    <g transform="translate(556 75)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Bouger</text>
      <text class="small" x="22" y="78">L'activité régulière réduit plusieurs risques.</text>
    </g>
    <g transform="translate(834 75)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Protection UV</text>
      <text class="small" x="22" y="78">Soleil prudent; pas de cabines UV.</text>
    </g>

    <g transform="translate(0 225)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Vaccins</text>
      <text class="small" x="22" y="78">HPV et hépatite B si indiqué.</text>
    </g>
    <g transform="translate(278 225)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Dépistage</text>
      <text class="small" x="22" y="78">Selon l'âge, le risque et les règles locales.</text>
    </g>
    <g transform="translate(556 225)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Mode sain</text>
      <text class="small" x="22" y="78">Végétaux, grains entiers, équilibre énergétique.</text>
    </g>
    <g transform="translate(834 225)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Moins d'expositions</text>
      <text class="small" x="22" y="78">Air, travail, radon et politiques comptent.</text>
    </g>
  </g>

  <g transform="translate(60 1445)">
    <rect x="0" y="0" width="1080" height="150" rx="24" fill="#102033"/>
    <text x="32" y="48" style="font: 800 27px Arial, Helvetica, sans-serif; fill: #ffffff;">Important : prévenir n'est pas blâmer</text>
    <text x="32" y="86" style="font: 400 20px Arial, Helvetica, sans-serif; fill: #e2e8f0;">Certains cancers surviennent malgré d'excellents choix. Âge, variants hérités, infections,</text>
    <text x="32" y="116" style="font: 400 20px Arial, Helvetica, sans-serif; fill: #e2e8f0;">erreurs cellulaires, environnement, revenus, géographie et accès aux soins comptent aussi.</text>
  </g>

  <text class="tiny" x="60" y="1645">Base : NCI, ACS, IARC/WHO, Hanahan/Weinberg, GBD, WCRF/AICR et pages d'évidence du wiki. Pour symptômes, dépistage ou risque personnel, parler à un professionnel de santé.</text>
</svg>
