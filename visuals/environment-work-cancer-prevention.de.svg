<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Krebsprävention ist auch Umwelt- und Arbeitsschutz</title>
  <desc id="desc">Öffentliche Infografik zu Radon, Asbest, Luftverschmutzung und Arbeitskarzinogenen als Präventionszielen, die Tests, Kontrollen, Politik und Sanierung brauchen.</desc>
  <rect width="1500" height="980" fill="#f7f4ee"/>
  <rect x="50" y="44" width="1400" height="892" rx="24" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#102033">Krebsprävention ist auch saubere Luft und sichere Arbeit</text>
  <text x="94" y="158" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#46515f">Manche Risiken kommen aus Gebäuden, Arbeit, Luft, Materialien und Politik, nicht nur aus Gewohnheiten.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="220" width="305" height="340" rx="18" fill="#e8f1f2" stroke="#1b5d66" stroke-width="3"/>
    <circle cx="152" cy="285" r="40" fill="#1b5d66"/><text x="152" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="122" y="358" font-size="28" font-weight="700" fill="#102033">Radon</text>
    <text x="122" y="400" font-size="20" fill="#46515f">Unsichtbares Gas in</text><text x="122" y="428" font-size="20" fill="#46515f">manchen Gebäuden.</text>
    <text x="122" y="486" font-size="23" font-weight="700" fill="#102033">Hebel</text>
    <text x="122" y="520" font-size="20" fill="#46515f">Messen, mindern, lüften</text><text x="122" y="548" font-size="20" fill="#46515f">und sicherer bauen.</text>
    <rect x="432" y="220" width="305" height="340" rx="18" fill="#fff1d9" stroke="#a26119" stroke-width="3"/>
    <circle cx="492" cy="285" r="40" fill="#a26119"/><text x="492" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="462" y="358" font-size="28" font-weight="700" fill="#102033">Asbest</text>
    <text x="462" y="400" font-size="20" fill="#46515f">Fasern können vom</text><text x="462" y="428" font-size="20" fill="#46515f">Arbeitsplatz ins Haus.</text>
    <text x="462" y="486" font-size="23" font-weight="700" fill="#102033">Hebel</text>
    <text x="462" y="520" font-size="20" fill="#46515f">Nicht stören; Fachprüfung</text><text x="462" y="548" font-size="20" fill="#46515f">und sichere Entfernung.</text>
    <rect x="772" y="220" width="305" height="340" rx="18" fill="#e9ecff" stroke="#3e4d9a" stroke-width="3"/>
    <circle cx="832" cy="285" r="40" fill="#3e4d9a"/><text x="832" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="802" y="358" font-size="28" font-weight="700" fill="#102033">PM2.5-Luft</text>
    <text x="802" y="400" font-size="20" fill="#46515f">Feinstaub erhöht</text><text x="802" y="428" font-size="20" fill="#46515f">Lungenkrebsrisiko.</text>
    <text x="802" y="486" font-size="23" font-weight="700" fill="#102033">Hebel</text>
    <text x="802" y="520" font-size="20" fill="#46515f">Sauberer Verkehr, Energie,</text><text x="802" y="548" font-size="20" fill="#46515f">Industrie und Innenluft.</text>
    <rect x="1112" y="220" width="305" height="340" rx="18" fill="#fde8e6" stroke="#ad3434" stroke-width="3"/>
    <circle cx="1172" cy="285" r="40" fill="#ad3434"/><text x="1172" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="1142" y="358" font-size="28" font-weight="700" fill="#102033">Arbeit</text>
    <text x="1142" y="400" font-size="20" fill="#46515f">Staub, Rauch, Diesel,</text><text x="1142" y="428" font-size="20" fill="#46515f">Silika, Metalle, Lösemittel.</text>
    <text x="1142" y="486" font-size="23" font-weight="700" fill="#102033">Hebel</text>
    <text x="1142" y="520" font-size="20" fill="#46515f">Ersetzen, kapseln, lüften,</text><text x="1142" y="548" font-size="20" fill="#46515f">messen, schützen.</text>
  </g>
  <rect x="92" y="625" width="625" height="172" rx="18" fill="#102033"/>
  <text x="130" y="674" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Öffentliche Bedeutung</text>
  <text x="130" y="718" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Prävention umfasst sichere Gebäude, saubere Luft,</text>
  <text x="130" y="750" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Arbeitsschutz, Sanierung und faire Politik.</text>
  <text x="130" y="782" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Strukturelle Exposition ist keine persönliche Schuld.</text>
  <rect x="775" y="625" width="633" height="172" rx="18" fill="#f4d35e" stroke="#8a6a00" stroke-width="3"/>
  <text x="813" y="674" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102033">Sicherheitsgrenze</text>
  <text x="813" y="718" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Asbest, hohes Radon und Arbeitsbelastungen brauchen</text>
  <text x="813" y="750" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Fachbewertung. Symptome oder Tests gehören zu</text>
  <text x="813" y="782" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Klinik oder Expositionsfachleuten.</text>
  <text x="92" y="858" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46515f">Quellen: Radon-Metaanalyse; europäische Radon-Pooling-Analyse; Asbest-Lungenkrebs-Review;</text>
  <text x="92" y="886" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46515f">Metaanalyse zu nichtberuflichem Asbest und Mesotheliom; PM2.5-Lungenkrebs-Metaanalyse.</text>
  <text x="92" y="918" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b7280">Risikoreduktion ist keine Garantie. Dosis, Dauer, Rauchen, Wohnung, Beruf, Ort und Politik ändern Exposition und Risiko.</text>
</svg>
