<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">UV-Schutz senkt Hautkrebsrisiko</title>
  <desc id="desc">Offentliche Infografik zu UV-DNA-Schaden, Solarien, gestuftem Sonnenschutz und klinischer Abklarung verdachtiger Hautveranderungen.</desc>
  <rect width="1500" height="980" fill="#fbfaf5"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#29312b" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial" font-size="46" font-weight="800" fill="#102033">Haut vor wiederholter UV-Verletzung schutzen</text>
  <text x="94" y="154" font-family="Arial" font-size="24" fill="#334155">Sonne gehort zum Leben. Sonnenbrand und Solarien sind vermeidbare Risiken.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">UV kann DNA schadigen</text><text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">UVA und UVB konnen Hautzellen</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">durch direkte und indirekte</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">DNA-Schaden verletzen.</text><text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Wiederholte Brande meiden;</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">bei hoher UV-Strahlung schutzen.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Keine Solarien</text><text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Ein Solarium ist keine sichere</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">Alternative; Braune zeigt</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">UV-Verletzung.</text><text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Kunstliches Braunen meiden;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">Jugendliche schutzen.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Schutz in Schichten</text><text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Schatten, Kleidung, Hut,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">Brille, Sonnencreme und Zeiten</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">wirken zusammen.</text><text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Sonnencreme ist eine Schicht,</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">keine Erlaubnis zum Brennen.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Systeme zahlen</text><text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Schatten in Schule und Arbeit, sichere Zeiten,</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">Schutzausrustung und Solarienpolitik senken Exposition.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Sicherheitsgrenze</text><text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Eine Bild-Checkliste ist keine Diagnose.</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Veranderte, blutende, schmerzende, nicht heilende</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">oder ungewohnliche Flecken arztlich abklaren.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidenz: IARC Solar/UV und Solarien; Metaanalysen; Nambour-Sonnenschutzstudien; UV-DNA-Schaden.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Risiko variiert nach Hautton, Immunstatus, Geografie, Arbeit, Alter, fruherer Exposition und Schattenzugang.</text>
</svg>
