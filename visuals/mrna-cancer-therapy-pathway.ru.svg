<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">mRNA-терапия рака требует клинической цепи</title>
  <desc id="desc">Общественная инфографика о безопасном пути от образца опухоли к mRNA-вакцине, иммунному ответу, наблюдению и почему это не домашнее лечение.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#102033">mRNA-терапия рака требует клинической цепи</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">mRNA - временная инструкция. Терапия - весь регулируемый путь вокруг нее.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Найти мишени</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Опухоль и нормальные</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">образцы секвенируют, чтобы</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">найти видимые мишени.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Ключевая идея</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Не каждая мутация является</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">хорошей иммунной мишенью.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Сделать и доставить</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Выбранные мишени кодируют</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">как mRNA и упаковывают</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">для клинической доставки.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Ключевая идея</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Доставка, качество и сроки</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">могут решить исход.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Учить T-клетки</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Клетки показывают фрагменты,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">чтобы T-клетки могли узнать</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">подходящие раковые клетки.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Ключевая идея</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Иммунный ответ еще</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">не означает излечение.</text>
  <rect x="92" y="655" width="625" height="200" rx="16" fill="#102033"/>
  <text x="130" y="700" font-family="Arial" font-size="29" font-weight="800" fill="#ffffff">Клиническая инфраструктура</text>
  <text x="130" y="734" font-family="Arial" font-size="29" font-weight="800" fill="#ffffff">является частью терапии</text>
  <text x="130" y="772" font-family="Arial" font-size="21" fill="#f8fafc">Биопсия, секвенирование, выбор антигенов,</text>
  <text x="130" y="800" font-family="Arial" font-size="21" fill="#f8fafc">стерильное производство, тесты и мониторинг</text>
  <text x="130" y="828" font-family="Arial" font-size="21" fill="#f8fafc">не являются лишними.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Эта wiki может объяснять испытания и механизмы.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Она не должна давать домашний дизайн, дозы,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">изготовление, покупку или самолечение.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Опоры: исследование mRNA-4157/V940 при меланоме; autogene cevumeran; обзоры LNP и неоантигенов.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Цель: понимать область, задавать лучшие вопросы и работать с клиническими командами.</text>
</svg>
