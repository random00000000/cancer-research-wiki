<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">防护紫外线可降低皮肤癌风险</title>
  <desc id="desc">公共信息图，解释紫外线 DNA 损伤、日晒床风险、分层防晒、儿童和户外工作者保护，以及可疑皮肤变化需临床评估。</desc>
  <rect width="1500" height="980" fill="#fbfaf5"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#29312b" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial" font-size="48" font-weight="800" fill="#102033">保护皮肤，减少反复紫外线损伤</text>
  <text x="94" y="154" font-family="Arial" font-size="24" fill="#334155">阳光是生活的一部分。晒伤和日晒床是可预防的癌症风险。</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">紫外线可伤 DNA</text><text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">UVA 和 UVB 可通过</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">直接和间接方式损伤</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">皮肤细胞 DNA。</text><text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">避免反复晒伤；</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">高 UV 日加强保护。</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">不要日晒床</text><text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">日晒床不是安全替代；</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">晒黑表示紫外线</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">已经造成损伤。</text><text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">避免室内晒黑；</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">保护青少年。</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">分层保护</text><text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">阴凉、衣物、帽子、</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">太阳镜、防晒霜和</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">时间安排一起发挥作用。</text><text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">防晒霜只是一层，</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">不是晒伤许可。</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">系统很重要</text><text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">学校和工作场所的阴凉、安全时间安排、</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">防护用品和日晒床政策可减少暴露。</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">安全边界</text><text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">图片清单不能诊断。</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">变化、出血、疼痛、不愈合</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">或异常皮肤斑点需要临床评估。</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">证据锚点：IARC 太阳/UV 和日晒床；室内晒黑荟萃分析；Nambour 防晒试验；UV DNA 损伤综述。</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">风险随肤色、免疫状态、地理、工作、年龄、既往暴露和阴凉可及性而变。</text>
</svg>
