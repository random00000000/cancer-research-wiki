<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">El trabajo nocturno es una exposicion del sistema</title>
  <desc id="desc">Infografia publica sobre sistemas mas seguros para turnos nocturnos: menos disrupcion, luz, recuperacion, poder laboral e incertidumbre sobre cancer.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" fill="#102033">El trabajo nocturno es una exposicion del sistema</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">Protege el ritmo circadiano con horarios, luz, recuperacion y control laboral mas seguros.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Reduce la disrupcion</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Evita noches innecesarias;</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">limita largas series de</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">turnos si es posible.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Usa horarios predecibles</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">y humanos.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Luz y recuperacion</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">La luz en el trabajo puede</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">ayudar; la oscuridad despues</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">protege el sueno.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Planifica luz, transporte,</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">comidas y descanso.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Poder laboral</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Se necesitan personal, pausas,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">cuidado infantil, transporte y</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">adaptaciones medicas.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Haz de la seguridad un deber</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">del empleador y la politica.</text>
  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="30" font-weight="800" fill="#ffffff">Sistemas que proteger</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Hospitales, fabricas, transporte, almacenes,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">servicios, seguridad publica y cuidados</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">tambien necesitan prevencion del cancer.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Limite de seguridad</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Somnolencia peligrosa, conducir con sueno,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">apnea, insomnio grave, embarazo o medicinas</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">requieren apoyo clinico u ocupacional.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Anclas de evidencia: evaluaciones NTP/IARC; articulos de horarios; revisiones de sueno y luz.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Horarios mas seguros pueden reducir tension circadiana y fatiga; no garantizan que el cancer no ocurra.</text>
</svg>
