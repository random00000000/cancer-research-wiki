<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Некоторые вакцины предотвращают будущие раки</title>
  <desc id="desc">Публичная инфографика о вакцинации против ВПЧ, гепатита B, профилактике рака, доступе, скрининге и языке без стигмы.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#fff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#102033">Некоторые вакцины предотвращают будущие раки</text>
  <text x="94" y="154" font-family="Arial, sans-serif" font-size="23" fill="#334155">Профилактика рака может начинаться с блокирования инфекций, ведущих к раку.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">1</text>
  <text x="122" y="354" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#102033">Вакцина ВПЧ</text>
  <text x="122" y="396" font-family="Arial, sans-serif" font-size="22" fill="#334155">Предотвращает инфекции</text><text x="122" y="424" font-family="Arial, sans-serif" font-size="22" fill="#334155">ВПЧ высокого риска,</text><text x="122" y="452" font-family="Arial, sans-serif" font-size="22" fill="#334155">связанные с раком.</text>
  <text x="122" y="512" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#102033">Для людей</text><text x="122" y="548" font-family="Arial, sans-serif" font-size="21" fill="#334155">По возможности вакцинировать</text><text x="122" y="576" font-family="Arial, sans-serif" font-size="21" fill="#334155">до контакта с вирусом.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">2</text>
  <text x="585" y="354" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#102033">Вакцина HBV</text>
  <text x="585" y="396" font-family="Arial, sans-serif" font-size="22" fill="#334155">Предотвращает гепатит B,</text><text x="585" y="424" font-family="Arial, sans-serif" font-size="22" fill="#334155">который может стать</text><text x="585" y="452" font-family="Arial, sans-serif" font-size="22" fill="#334155">хроническим и вредить печени.</text>
  <text x="585" y="512" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#102033">Для людей</text><text x="585" y="548" font-family="Arial, sans-serif" font-size="21" fill="#334155">Доза при рождении и полная</text><text x="585" y="576" font-family="Arial, sans-serif" font-size="21" fill="#334155">серия имеют значение.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">3</text>
  <text x="1048" y="354" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#102033">Система завершает путь</text>
  <text x="1048" y="396" font-family="Arial, sans-serif" font-size="22" fill="#334155">Нужны доступ, доверие,</text><text x="1048" y="424" font-family="Arial, sans-serif" font-size="22" fill="#334155">наблюдение, скрининг,</text><text x="1048" y="452" font-family="Arial, sans-serif" font-size="22" fill="#334155">тестирование и лечение.</text>
  <text x="1048" y="512" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#102033">Для людей</text><text x="1048" y="548" font-family="Arial, sans-serif" font-size="21" fill="#334155">Сохранять маршруты помощи;</text><text x="1048" y="576" font-family="Arial, sans-serif" font-size="21" fill="#334155">не пропускать скрининг.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial, sans-serif" font-size="31" font-weight="800" fill="#fff">Без стигмы</text>
  <text x="130" y="748" font-family="Arial, sans-serif" font-size="23" fill="#f8fafc">ВПЧ и гепатит - инфекции, а не моральные ярлыки.</text><text x="130" y="778" font-family="Arial, sans-serif" font-size="23" fill="#f8fafc">Профилактика должна быть обычной и доступной.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial, sans-serif" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text>
  <text x="814" y="748" font-family="Arial, sans-serif" font-size="23" fill="#111827">Правила зависят от возраста, страны, беременности,</text><text x="814" y="778" font-family="Arial, sans-serif" font-size="23" fill="#111827">иммунитета, прошлых доз и истории болезни.</text><text x="814" y="808" font-family="Arial, sans-serif" font-size="23" fill="#111827">Следуйте местным клиническим рекомендациям.</text>
  <text x="92" y="890" font-family="Arial, sans-serif" font-size="19" fill="#334155">Доказательства: Lei NEJM 2020; программа ВПЧ в Англии; вакцинация HBV на Тайване; инфекционная доля рака.</text>
  <text x="92" y="920" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Вакцинация снижает риск; она не дает нулевого риска и не заменяет рекомендованный скрининг.</text>
</svg>
