<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">The drive home is part of night-shift safety</title>
  <desc id="desc">A public safety infographic explaining drowsy driving after night shifts, no-drive plans, protected naps, and employer support.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="800" fill="#102033">The drive home is part of night-shift safety</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Dangerous sleepiness after work needs a plan before the commute begins.</text>

  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Notice danger</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Lane drifting, nodding,</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">missed exits, or heavy eyes</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">mean stop driving.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Microsleeps cannot be</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">willpowered away.</text>

  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Plan no-drive</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Arrange ride, taxi, transit,</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">pickup, nearby rest, or</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">delayed departure.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Make the backup plan</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">before the shift.</text>

  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Make it a system</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Workers need nap spaces,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">rideshare funds, fatigue</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">reporting, and staffing.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Safety should not depend</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">on personal heroics.</text>

  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Do not push through</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Open windows, loud music, phone calls,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">or pinching yourself are not reliable</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">protection from sleep-deprived driving.</text>

  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Severe sleepiness, repeated near-misses,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">sleep apnea symptoms, severe insomnia,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">sedating medicines, or pregnancy need</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">clinical or occupational support.</text>

  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: real-vehicle night-shift driving study; nurse driving simulation; shiftwork injury reviews; safety training.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">This is immediate injury prevention inside the broader night-work and circadian-health evidence map.</text>
</svg>
