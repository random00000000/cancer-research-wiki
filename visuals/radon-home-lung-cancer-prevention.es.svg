<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Hogares seguros frente al radon previenen cancer de pulmon</title>
  <desc id="desc">Infografia publica sobre radon invisible, pruebas en el hogar, mitigacion, interaccion con tabaco, sistemas de construccion y limites medicos.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#fff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#102033">Hogares seguros frente al radon previenen cancer de pulmon</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">El radon es invisible. Medir y mitigar convierte exposicion oculta en accion.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Gas invisible</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">El radon puede entrar</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">desde suelo y roca, y</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">acumularse en interiores.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">No se ve ni se huele;</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">mida la vivienda.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Medir y mitigar</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">La prueba detecta niveles</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">altos. Mitigar reduce la</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">exposicion a largo plazo.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Use umbrales locales y</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">ayuda calificada.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Tabaco sube el riesgo</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">El radon importa para todos,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">pero el riesgo absoluto sube</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">mucho con tabaco.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Medir hogares y apoyar</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">dejar tabaco sin culpa.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#fff">Los sistemas importan</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Codigos, alquileres, escuelas, trabajos y fondos</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">de mitigacion determinan quien queda protegido.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Limite de seguridad</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Esta visual no evalua sintomas pulmonares.</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Tos persistente, sangre, dolor toracico o falta</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">de aire inexplicada necesitan atencion medica.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidencia: metaanalisis residencial; analisis agrupados europeo y norteamericano; estudios en nunca fumadores.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Niveles de accion, unidades, derechos de inquilinos y reglas de mitigacion varian por pais y region.</text>
</svg>
