<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Жировая ткань и метаболизм влияют на риск рака</title>
  <desc id="desc">Общественная инфографика о жировой ткани, метаболических сигналах, специфике видов рака, доступе систем и границах без обвинения.</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#102033">Жировая ткань и метаболизм влияют на риск рака</text>
  <text x="94" y="154" font-family="Arial, sans-serif" font-size="24" fill="#334155">Метаболическое здоровье - биология плюс среда, не моральная оценка.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="27" font-weight="800" fill="#102033">Сигнал по видам</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Более сильные связи:</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">эндометрий, почка, печень,</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">кишечник, поджелудочная.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общее направление</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Использовать карты видов;</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">не смешивать все раки.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="27" font-weight="800" fill="#102033">Механизмы важны</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Инсулин/IGF, гормоны,</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">воспаление, адипокины</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">и жировая печень важны.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общее направление</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Поддерживать метаболизм;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">не обещать чудес.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="27" font-weight="800" fill="#102033">ИМТ не весь человек</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">ИМТ груб. Состав тела,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">болезнь, возраст и доступ</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">меняют контекст.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общее направление</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Измерять риск скромно;</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">никогда не стыдить тела.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Системы важны</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Еда, движение, сон, лекарства, инвалидность,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">стресс, бедность, работа и медицина влияют.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Советы о весе не заменяют диагноз или лечение.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Симптомы, РПП, диабет, беременность</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">или лечение рака требуют помощи врача.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Данные: BMJ umbrella review; оценка IARC; WCRF/AICR; исследования менделевской рандомизации.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Первичный перевод: перед окончательным медицинским использованием нужна проверка носителем языка.</text>
</svg>
