<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Опасная сонливость требует поддержки</title>
  <desc id="desc">Общественная инфографика: обычная усталость после ночной смены и признаки расстройств сна, требующие клинической или профессиональной помощи.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">Опасная сонливость требует поддержки</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Ночная работа утомляет, но тяжелые или опасные симптомы требуют помощи.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Знайте границу</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Бессонница или сонливость,</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">связанные с графиком, могут</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">быть расстройством сна.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий вывод</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Не у каждого ночного работника</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">оно есть; важны сигналы.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Проверьте причины</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Храп, паузы дыхания, боль,</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">депрессия, лекарства или</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">беременность меняют риск.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий вывод</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Не списывайте каждый</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">сонный симптом на смены.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Создайте поддержку</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Нужны пересмотр графика,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">места отдыха, направление</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">к врачу и отчеты без наказания.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий вывод</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Усталость - вопрос труда</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">и системы здоровья.</text>
  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Не гадайте с лекарствами</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Мелатонин, кофеин, снотворные</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">и стимуляторы требуют времени,</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">оценки риска и врача.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Срочно за помощью</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Почти аварии, паузы дыхания, тяжелая</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">бессонница, невольный сон, беременность</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">или мысли о самоповреждении требуют</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">клинической или проф. поддержки.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Опоры: обзоры Shift Work Disorder; исследования сна у сменных работников; клинические резюме.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Помощь со сном поддерживает безопасность и здоровье; это не лечение рака.</text>
</svg>
