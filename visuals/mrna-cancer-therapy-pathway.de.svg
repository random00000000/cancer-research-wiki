<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">mRNA-Krebstherapie braucht eine klinische Kette</title>
  <desc id="desc">Offentliche Infografik zum sicheren Weg von Tumorprobe zu mRNA-Krebsimpfung, Immunantwort, Uberwachung und warum es keine Heimkur ist.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#102033">mRNA-Krebstherapie braucht eine klinische Kette</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">mRNA ist eine zeitweilige Anleitung. Therapie ist der regulierte Weg darum herum.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Ziele finden</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Tumor- und Normalproben</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">werden sequenziert, um</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">sichtbare Krebsziele zu suchen.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Kernidee</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Nicht jede Mutation ist</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">ein gutes Immunziel.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Herstellen und liefern</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Gewahlte Ziele werden als</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">mRNA codiert und klinisch</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">verpackt.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Kernidee</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Lieferung, Qualitat und</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">Zeit konnen entscheiden.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">T-Zellen lehren</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Zellen zeigen Fragmente,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">damit T-Zellen passende</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">Krebszellen erkennen.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Kernidee</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Immunantwort ist nicht</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">gleich Heilung.</text>
  <rect x="92" y="655" width="625" height="200" rx="16" fill="#102033"/>
  <text x="130" y="700" font-family="Arial" font-size="29" font-weight="800" fill="#ffffff">Klinische Infrastruktur</text>
  <text x="130" y="734" font-family="Arial" font-size="29" font-weight="800" fill="#ffffff">gehort zur Therapie</text>
  <text x="130" y="772" font-family="Arial" font-size="21" fill="#f8fafc">Biopsie, Sequenzierung, Antigenauswahl,</text>
  <text x="130" y="800" font-family="Arial" font-size="21" fill="#f8fafc">sterile Herstellung, Tests und Uberwachung</text>
  <text x="130" y="828" font-family="Arial" font-size="21" fill="#f8fafc">sind keine Extras.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Sicherheitsgrenze</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Diese Wiki kann Studien und Mechanismen erklaren.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Sie darf kein Heimdesign, keine Dosierung,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">Herstellung, Beschaffung oder Selbstbehandlung</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">anleiten.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidenzanker: mRNA-4157/V940-Melanomstudie; autogene-cevumeran-Studien; LNP- und Neoantigen-Reviews.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Ziel: das Feld verstehen, bessere Fragen stellen und mit klinischen Forschungs-Teams arbeiten.</text>
</svg>
