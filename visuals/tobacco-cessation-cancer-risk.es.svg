<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">El riesgo de cancer por tabaco baja al detener la exposicion</title>
  <desc id="desc">Infografia publica sobre dano al ADN por humo de tabaco, abandono, riesgo persistente, cribado y apoyo sin culpa.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#27312d" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#102033">El riesgo por tabaco baja al detener la exposicion</text>
  <text x="94" y="158" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Dejarlo ayuda a cualquier edad. Antes es mejor. El apoyo funciona mejor que la culpa.</text>
  <rect x="92" y="220" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="286" r="40" fill="#1f6f6b"/><text x="143" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">El humo dana celulas</text>
  <text x="122" y="398" font-family="Arial" font-size="22" fill="#334155">El humo del tabaco contiene</text><text x="122" y="426" font-family="Arial" font-size="22" fill="#334155">carcinogenos que pueden danar</text><text x="122" y="454" font-family="Arial" font-size="22" fill="#334155">ADN y defensas del tejido.</text>
  <text x="122" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="122" y="550" font-family="Arial" font-size="21" fill="#334155">Evitar la exposicion al humo</text><text x="122" y="578" font-family="Arial" font-size="21" fill="#334155">y proteger espacios sin humo.</text>
  <rect x="555" y="220" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="286" r="40" fill="#b46b13"/><text x="606" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Dejarlo cambia la ruta</text>
  <text x="585" y="398" font-family="Arial" font-size="22" fill="#334155">Al parar baja la nueva exposicion.</text><text x="585" y="426" font-family="Arial" font-size="22" fill="#334155">El riesgo suele bajar con el tiempo,</text><text x="585" y="454" font-family="Arial" font-size="22" fill="#334155">sobre todo si se deja antes.</text>
  <text x="585" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="585" y="550" font-family="Arial" font-size="21" fill="#334155">Cada intento importa;</text><text x="585" y="578" font-family="Arial" font-size="21" fill="#334155">medicinas y apoyo ayudan.</text>
  <rect x="1018" y="220" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="286" r="40" fill="#b93636"/><text x="1069" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Puede quedar riesgo</text>
  <text x="1048" y="398" font-family="Arial" font-size="22" fill="#334155">Exfumadores pueden mantener</text><text x="1048" y="426" font-family="Arial" font-size="22" fill="#334155">mas riesgo de cancer pulmonar</text><text x="1048" y="454" font-family="Arial" font-size="22" fill="#334155">durante anos.</text>
  <text x="1048" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="1048" y="550" font-family="Arial" font-size="21" fill="#334155">Cribado de alto riesgo y</text><text x="1048" y="578" font-family="Arial" font-size="21" fill="#334155">sintomas persistentes importan.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Sin culpa</text><text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">La dependencia a la nicotina es biologica, comercial,</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">social y ambiental. El apoyo supera la verguenza.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Limite de seguridad</text><text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Dejarlo no borra todo el riesgo pasado.</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Cribado, sintomas, embarazo, cancer previo</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">y medicinas necesitan apoyo clinico.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidencia: IARC tabaco; Hecht carcinogenos; cohortes Jha/Pirie; cohorte Park; revisiones sobre riesgo tras dejarlo.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Reducir humo ajeno, radon, exposiciones laborales y alcohol. No retrase atencion por sintomas.</text>
</svg>
