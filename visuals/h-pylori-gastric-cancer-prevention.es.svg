<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">H. pylori es un riesgo tratable de cancer de estomago</title>
  <desc id="desc">Infografia publica sobre Helicobacter pylori, inflamacion gastrica, prevencion de cancer gastrico, sistemas de prueba y tratamiento, resistencia antibiotica y senales de alarma.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" fill="#102033">H. pylori es un riesgo tratable de cancer de estomago</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Buscar y tratar previene cuando pruebas, antibioticos y seguimiento encajan con el lugar.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Infeccion tratable</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">H. pylori persistente puede</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">inflamar el revestimiento</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">del estomago por anos.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Buscar y tratar en el</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">contexto de riesgo correcto.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Prevenir antes</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">La erradicacion funciona</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">mejor antes de cambios</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">precancerosos avanzados.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Programas de alto riesgo</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">no deben esperar sintomas.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Importa resistencia</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Antibiotico, efectos,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">reinfeccion y confirmacion</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">varian por region.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Use guia clinica local;</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">no se automedique.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Los sistemas importan</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Acceso a pruebas, endoscopia, datos de resistencia,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">saneamiento y seguimiento cambian el beneficio.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Limite de seguridad</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Vomitar sangre, heces negras, anemia, dificultad</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">al tragar, perdida de peso o dolor persistente</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">requieren evaluacion medica.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Anclajes: ensayos y metaanalisis; revision Cochrane; estrategia IARC de buscar y tratar; estudios regionales.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Erradicar reduce riesgo; no garantiza que no haya cancer gastrico ni reemplaza evaluacion clinica.</text>
</svg>
