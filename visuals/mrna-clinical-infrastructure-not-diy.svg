<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">mRNA cancer therapy needs clinical infrastructure</title>
  <desc id="desc">Public education visual explaining that personalized mRNA cancer therapy requires tumor sampling, sequencing, antigen selection, regulated manufacturing, quality testing, clinical delivery, monitoring, and evidence review, not do-it-yourself treatment.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="70" y="76" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">Personalized mRNA cancer therapy is a clinical chain</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="22" fill="#334155">The useful goal is understanding trial options and asking better questions, not crafting a cure alone.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="165" width="160" height="108" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="94" y="205" font-size="18" font-weight="700" fill="#1e3a8a">Tumor sample</text>
    <text x="94" y="236" font-size="15" fill="#1e40af">Enough usable tissue</text>

    <rect x="270" y="165" width="160" height="108" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="293" y="205" font-size="18" font-weight="700" fill="#155e75">Sequencing</text>
    <text x="293" y="236" font-size="15" fill="#0e7490">Tumor plus normal</text>

    <rect x="470" y="165" width="160" height="108" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="493" y="205" font-size="18" font-weight="700" fill="#92400e">Target ranking</text>
    <text x="493" y="236" font-size="15" fill="#a16207">HLA and expression</text>

    <rect x="670" y="165" width="160" height="108" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="694" y="205" font-size="18" font-weight="700" fill="#9d174d">mRNA product</text>
    <text x="694" y="236" font-size="15" fill="#be185d">Designed for a trial</text>

    <rect x="870" y="165" width="160" height="108" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="894" y="205" font-size="18" font-weight="700" fill="#166534">Release tests</text>
    <text x="894" y="236" font-size="15" fill="#15803d">Identity and sterility</text>

    <path d="M232 219 H266" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M432 219 H466" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M632 219 H666" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M832 219 H866" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="170" y="360" width="230" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="196" y="400" font-size="20" font-weight="700" fill="#0f172a">Clinical delivery</text>
    <text x="196" y="432" font-size="16" fill="#334155">Oncology team</text>
    <text x="196" y="458" font-size="16" fill="#334155">Protocol timing</text>
    <text x="196" y="484" font-size="16" fill="#334155">Combination context</text>

    <rect x="485" y="360" width="230" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="511" y="400" font-size="20" font-weight="700" fill="#0f172a">Monitoring</text>
    <text x="511" y="432" font-size="16" fill="#334155">Adverse events</text>
    <text x="511" y="458" font-size="16" fill="#334155">Immune assays</text>
    <text x="511" y="484" font-size="16" fill="#334155">Scans and recurrence</text>

    <rect x="800" y="360" width="230" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="826" y="400" font-size="20" font-weight="700" fill="#0f172a">Evidence review</text>
    <text x="826" y="432" font-size="16" fill="#334155">Endpoints</text>
    <text x="826" y="458" font-size="16" fill="#334155">Safety and benefit</text>
    <text x="826" y="484" font-size="16" fill="#334155">Regulatory oversight</text>

    <path d="M950 275 C950 315 915 330 915 356" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M800 435 H720" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M485 435 H405" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="70" y="590" width="1060" height="92" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="100" y="630" font-size="22" font-weight="700" fill="#9a3412">Safety boundary</text>
    <text x="100" y="660" font-size="18" fill="#7c2d12">This is research and trial literacy. It is not dosing, manufacturing, procurement, or self-administration guidance.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
