<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title desc">
  <title id="title">Какие рычаги профилактики важнее для разных видов рака</title>
  <desc id="desc">Публичная схема профилактики рака, связывающая основные локализации рака с важными мерами профилактики, вакцинации, скрининга и снижения воздействий.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="0.45" stop-color="#fff7ed"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#111827" flood-opacity="0.13"/></filter>
    <style>
      .title { font: 800 45px Arial, Helvetica, sans-serif; fill: #102033; letter-spacing: 0; }
      .subtitle { font: 400 23px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }
      .site { font: 800 25px Arial, Helvetica, sans-serif; fill: #102033; letter-spacing: 0; }
      .lever { font: 700 18px Arial, Helvetica, sans-serif; fill: #102033; letter-spacing: 0; }
      .body { font: 400 17px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }
      .small { font: 400 16px Arial, Helvetica, sans-serif; fill: #475569; letter-spacing: 0; }
      .source { font: 700 15px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }
      .lightSite { font: 800 27px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .lightBody { font: 400 18px Arial, Helvetica, sans-serif; fill: #e2e8f0; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #d8e2ef; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .pill { stroke-width: 2; rx: 18; }
    </style>
  </defs>
  <rect width="1500" height="1100" fill="url(#bg)"/>
  <g transform="translate(70 56)"><text class="title" x="0" y="58">Какие рычаги профилактики важнее?</text><text class="subtitle" x="2" y="100">У разных видов рака разные слабые места. Это карта вопросов, а не личный медицинский совет.</text><rect x="0" y="136" width="1360" height="4" fill="#cbd5e1"/></g>
  <g transform="translate(70 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#2563eb"/><text class="site" x="76" y="58">Толстая / прямая</text><rect class="pill" x="30" y="88" width="120" height="34" fill="#dbeafe" stroke="#2563eb"/><text class="lever" x="51" y="111">Скрининг</text><rect class="pill" x="165" y="88" width="120" height="34" fill="#dcfce7" stroke="#16a34a"/><text class="lever" x="184" y="111">Активность</text><text class="body" x="30" y="158">Клетчатка и цельные злаки</text><text class="body" x="30" y="187">помогают. Меньше красного/</text><text class="body" x="30" y="214">переработанного мяса и алкоголя.</text></g>
  <g transform="translate(420 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#7c3aed"/><text class="site" x="76" y="58">Шейка матки</text><rect class="pill" x="30" y="88" width="132" height="34" fill="#ede9fe" stroke="#7c3aed"/><text class="lever" x="48" y="111">Вакцина ВПЧ</text><rect class="pill" x="178" y="88" width="112" height="34" fill="#dbeafe" stroke="#2563eb"/><text class="lever" x="198" y="111">Скрининг</text><text class="body" x="30" y="158">Лечить предраковые изменения.</text><text class="body" x="30" y="187">Доступ и наблюдение —</text><text class="body" x="30" y="214">ключевые рычаги.</text></g>
  <g transform="translate(770 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#f97316"/><text class="site" x="76" y="58">Печень</text><rect class="pill" x="30" y="88" width="120" height="34" fill="#ffedd5" stroke="#f97316"/><text class="lever" x="47" y="111">Вакцина HBV</text><rect class="pill" x="165" y="88" width="124" height="34" fill="#ecfeff" stroke="#0891b2"/><text class="lever" x="185" y="111">Лечение HCV</text><text class="body" x="30" y="158">Меньше алкогольного вреда.</text><text class="body" x="30" y="187">Метаболизм и афлатоксин</text><text class="body" x="30" y="214">зависят от региона.</text></g>
  <g transform="translate(1120 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#ef4444"/><text class="site" x="76" y="58">Легкое</text><rect class="pill" x="30" y="88" width="122" height="34" fill="#fee2e2" stroke="#ef4444"/><text class="lever" x="45" y="111">Без дыма</text><rect class="pill" x="167" y="88" width="124" height="34" fill="#e0f2fe" stroke="#0284c7"/><text class="lever" x="198" y="111">Радон</text><text class="body" x="30" y="158">Работа и воздух тоже важны.</text><text class="body" x="30" y="187">Скрининг высокого риска</text><text class="body" x="30" y="214">только по условиям гайдлайнов.</text></g>
  <g transform="translate(70 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#d97706"/><text class="site" x="76" y="58">Кожа</text><rect class="pill" x="30" y="88" width="116" height="34" fill="#fef3c7" stroke="#d97706"/><text class="lever" x="65" y="111">УФ</text><rect class="pill" x="162" y="88" width="126" height="34" fill="#fee2e2" stroke="#ef4444"/><text class="lever" x="174" y="111">Нет солярия</text><text class="body" x="30" y="158">Тень, одежда, крем и</text><text class="body" x="30" y="187">защита на работе вместе.</text><text class="body" x="30" y="214">Проверять меняющиеся пятна.</text></g>
  <g transform="translate(420 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#db2777"/><text class="site" x="76" y="58">Молочная железа</text><rect class="pill" x="30" y="88" width="120" height="34" fill="#fce7f3" stroke="#db2777"/><text class="lever" x="51" y="111">Скрининг</text><rect class="pill" x="165" y="88" width="120" height="34" fill="#ffedd5" stroke="#f97316"/><text class="lever" x="190" y="111">Алкоголь</text><text class="body" x="30" y="158">Физическая активность помогает.</text><text class="body" x="30" y="187">Здоровый вес после менопаузы</text><text class="body" x="30" y="214">важен.</text></g>
  <g transform="translate(770 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#0f766e"/><text class="site" x="76" y="58">Желудок</text><rect class="pill" x="30" y="88" width="126" height="34" fill="#ccfbf1" stroke="#0f766e"/><text class="lever" x="52" y="111">H. pylori</text><rect class="pill" x="171" y="88" width="116" height="34" fill="#fef3c7" stroke="#d97706"/><text class="lever" x="205" y="111">Соль</text><text class="body" x="30" y="158">Тест и лечение зависят</text><text class="body" x="30" y="187">от местного риска.</text><text class="body" x="30" y="214">Меньше переработанного; без дыма.</text></g>
  <g transform="translate(1120 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#9333ea"/><text class="site" x="76" y="58">Рот / горло</text><rect class="pill" x="30" y="88" width="116" height="34" fill="#fee2e2" stroke="#ef4444"/><text class="lever" x="55" y="111">Табак</text><rect class="pill" x="162" y="88" width="126" height="34" fill="#ede9fe" stroke="#7c3aed"/><text class="lever" x="180" y="111">Вакцина ВПЧ</text><text class="body" x="30" y="158">Меньше алкоголя снижает риск.</text><text class="body" x="30" y="187">Избегать бетеля/гутки там,</text><text class="body" x="30" y="214">где их используют.</text></g>
  <g transform="translate(110 780)"><rect x="0" y="0" width="1280" height="140" rx="26" fill="#102033"/><text class="lightSite" x="38" y="52">Читайте закономерность</text><text class="lightBody" x="38" y="88">Одни рычаги действуют до рака: вакцины, без табака, защита от УФ, меньше алкоголя, безопасная работа и воздух.</text><text class="lightBody" x="38" y="118">Другие находят рак или предрак раньше: скрининг, проверка подозрительных пятен и системы наблюдения.</text></g>
  <g transform="translate(110 955)"><rect x="0" y="0" width="1280" height="72" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text class="small" x="26" y="29">Снижение риска не равно нулю. Симптомы, наследственность, прошлые результаты и местные рекомендации требуют врача.</text><text class="source" x="26" y="55">Основа: prevention/cancer-site-prevention-map.md; NCI, WHO, WCRF/AICR.</text></g>
</svg>
