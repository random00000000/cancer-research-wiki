<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Дорога домой - часть безопасности ночной смены</title>
  <desc id="desc">Общественная инфографика о сонном вождении после ночных смен, плане не садиться за руль, защищенном отдыхе и поддержке работодателя.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#102033">Дорога домой - часть безопасности ночной смены</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Опасная сонливость требует плана до начала поездки.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Заметьте опасность</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Снос полосы, клевки носом,</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">пропуск поворотов или</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">тяжелые глаза: остановитесь.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий вывод</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Микросон нельзя победить</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">силой воли.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">План без вождения</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Договоритесь о такси,</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">транспорте, встрече, отдыхе</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">рядом или позднем выезде.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий вывод</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Запасной план нужен</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">до смены.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Система, не героизм</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Нужны места для сна,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">оплата поездки, сообщение</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">об усталости и штат.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий вывод</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Безопасность не должна</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">держаться на терпении.</text>
  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Не продавливайте</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Окно, громкая музыка, звонки</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">или щипки не защищают надежно</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">от вождения без сна.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Сильная сонливость, почти аварии,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">апноэ сна, тяжелая бессонница,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">седативные лекарства или беременность</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">требуют клинической или проф. помощи.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Опоры: реальное вождение после ночной смены; симуляция для медсестер; обзоры травм.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Это немедленная профилактика травм в карте доказательств о ночной работе и циркадном здоровье.</text>
</svg>
