<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Some vaccines prevent future cancers</title>
  <desc id="desc">A public infographic explaining HPV vaccination, hepatitis B vaccination, cancer prevention, access systems, screening follow-up, and stigma-free wording.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102033">Some vaccines prevent future cancers</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Cancer prevention can start by blocking infections that drive cancer biology.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">HPV vaccine</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Prevents high-risk HPV</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">infections that can cause</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">cervical and other cancers.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Vaccinate before exposure</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">where possible.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">HBV vaccine</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Prevents hepatitis B</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">infection that can become</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">chronic and harm the liver.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Birth dose and complete</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">series matter.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Systems complete it</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Vaccines need access,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">trust, follow-up, screening,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">testing, and treatment.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Keep care pathways open;</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">do not skip recommended screening.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">No stigma</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">HPV and hepatitis are infections, not moral labels.</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">Prevention should be normal and accessible.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Vaccine rules vary by age, country, pregnancy,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">immune status, prior doses, and medical history.</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">Use local clinical guidance.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: Lei NEJM 2020; England HPV programme; Taiwan HBV vaccination programme; infection-attributable cancer burden studies.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Vaccination reduces risk; it does not guarantee cancer cannot happen or replace recommended screening and follow-up.</text>
</svg>
