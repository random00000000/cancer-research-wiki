<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Ung thư: tế bào phá vỡ quy tắc của cơ thể như thế nào</title>
  <desc id="desc">Infographic tiếng Việt giải thích ung thư bắt đầu và phát triển như thế nào, và cách giảm nguy cơ mà không hứa nguy cơ bằng không.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset=".52" stop-color="#fff8f2"/><stop offset="1" stop-color="#f5fff8"/></linearGradient><linearGradient id="cellGood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#75d7b3"/><stop offset="1" stop-color="#1f9d8a"/></linearGradient><linearGradient id="cellRisk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbc70"/><stop offset="1" stop-color="#e85d5d"/></linearGradient><linearGradient id="cellTumor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c678dd"/><stop offset="1" stop-color="#6a45b8"/></linearGradient><style>.title{font:800 43px Arial,sans-serif;fill:#102033}.subtitle{font:400 24px Arial,sans-serif;fill:#31445c}.section{font:800 29px Arial,sans-serif;fill:#102033}.label{font:700 21px Arial,sans-serif;fill:#102033}.body{font:400 20px Arial,sans-serif;fill:#24364b}.small{font:400 18px Arial,sans-serif;fill:#475569}.tiny{font:400 15px Arial,sans-serif;fill:#5b6b7f}.card{fill:#fff;stroke:#d8e2ef;stroke-width:2;rx:22}.line{stroke:#64748b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}</style></defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>
  <g transform="translate(60 55)"><text class="title" x="0" y="52">Ung thư: tế bào phá vỡ quy tắc</text><text class="subtitle" x="2" y="92">Ung thư là gì, phát triển ra sao, và giảm nguy cơ mà không hứa chắc chắn.</text><rect x="0" y="125" width="1080" height="4" fill="#cbd5e1"/></g>
  <g transform="translate(60 220)"><rect class="card" width="320" height="370"/><text class="section" x="24" y="48">1. Tế bào bình thường</text><circle cx="160" cy="145" r="78" fill="url(#cellGood)"/><circle cx="160" cy="145" r="38" fill="#e6fff6"/><path d="M128 146 C142 120,177 120,192 146 C176 171,142 171,128 146 Z" fill="none" stroke="#126c60" stroke-width="8"/><text class="body" x="24" y="260">Mô khỏe có các lớp kiểm soát:</text><text class="small" x="24" y="295">lớn lên khi có tín hiệu, sửa hư hại,</text><text class="small" x="24" y="322">và loại bỏ tế bào không an toàn.</text></g>
  <g transform="translate(440 220)"><rect class="card" width="320" height="370"/><text class="section" x="24" y="48">2. Thay đổi tích tụ</text><circle cx="160" cy="145" r="78" fill="url(#cellRisk)"/><circle cx="160" cy="145" r="37" fill="#fff6db"/><path d="M125 138 L148 118 L170 168 L197 105" fill="none" stroke="#9a3412" stroke-width="9" stroke-linecap="round"/><text class="body" x="24" y="260">Phơi nhiễm, nhiễm trùng, tuổi,</text><text class="small" x="24" y="295">nguy cơ di truyền và lỗi sao chép</text><text class="small" x="24" y="322">có thể đổi chỉ dẫn tế bào.</text></g>
  <g transform="translate(820 220)"><rect class="card" width="320" height="370"/><text class="section" x="24" y="48">3. Hành vi ung thư</text><circle cx="136" cy="130" r="62" fill="url(#cellTumor)"/><circle cx="195" cy="168" r="47" fill="#8b5cf6" opacity=".9"/><circle cx="111" cy="195" r="38" fill="#a855f7" opacity=".9"/><text class="body" x="24" y="260">Có thể phân chia quá mức,</text><text class="small" x="24" y="295">né miễn dịch, gọi mạch máu,</text><text class="small" x="24" y="322">xâm lấn và đôi khi lan rộng.</text></g>
  <path class="line" d="M380 405 H440"/><path d="M420 389 L448 405 L420 421 Z" fill="#64748b"/><path class="line" d="M760 405 H820"/><path d="M800 389 L828 405 L800 421 Z" fill="#64748b"/>
  <g transform="translate(60 660)"><rect class="card" width="1080" height="260"/><text class="section" x="30" y="50">Vòng lặp cơ bản</text><text class="body" x="30" y="88">Một tế bào đã đổi sống sót, nhân lên, thích nghi và thay đổi mô xung quanh.</text><text class="body" x="30" y="126">Gốc rễ không phải một công tắc thần kỳ: gen, miễn dịch, chuyển hóa, môi trường,</text><text class="body" x="30" y="164">tuổi, nhiễm trùng và tiếp cận phòng ngừa cùng tương tác.</text><text class="small" x="30" y="213">Vì vậy cần phòng ngừa, phát hiện sớm, sinh học và điều trị tốt hơn cùng lúc.</text></g>
  <g transform="translate(60 1000)"><text class="section" x="0" y="0">Giảm nguy cơ: giảm khả năng, không về không</text><text class="body" x="0" y="36">Các bước này có bằng chứng, nhưng không bảo đảm cuộc sống không ung thư.</text><g transform="translate(0 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Không thuốc lá</text><text class="small" x="22" y="78">Tránh khói; hỗ trợ bỏ thuốc.</text></g><g transform="translate(278 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Ít rượu hơn</text><text class="small" x="22" y="78">Ít hơn an toàn hơn; không uống tránh nguy cơ đó.</text></g><g transform="translate(556 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Vận động</text><text class="small" x="22" y="78">Hoạt động đều giúp giảm nhiều nguy cơ.</text></g><g transform="translate(834 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Bảo vệ UV</text><text class="small" x="22" y="78">Nắng an toàn; tránh giường nhuộm da.</text></g><g transform="translate(0 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Vắc xin</text><text class="small" x="22" y="78">HPV và viêm gan B khi phù hợp.</text></g><g transform="translate(278 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Sàng lọc</text><text class="small" x="22" y="78">Theo tuổi, nguy cơ và hướng dẫn địa phương.</text></g><g transform="translate(556 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Mẫu sống khỏe</text><text class="small" x="22" y="78">Thực vật, ngũ cốc nguyên hạt, cân bằng năng lượng.</text></g><g transform="translate(834 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Giảm phơi nhiễm</text><text class="small" x="22" y="78">Không khí, việc làm, radon, chính sách đều quan trọng.</text></g></g>
  <g transform="translate(60 1445)"><rect width="1080" height="150" rx="24" fill="#102033"/><text x="32" y="48" style="font:800 27px Arial,sans-serif;fill:#fff">Quan trọng: phòng ngừa không phải đổ lỗi</text><text x="32" y="86" style="font:400 20px Arial,sans-serif;fill:#e2e8f0">Một số ung thư vẫn xảy ra dù lựa chọn rất tốt. Tuổi, biến thể di truyền, nhiễm trùng,</text><text x="32" y="116" style="font:400 20px Arial,sans-serif;fill:#e2e8f0">lỗi tế bào, môi trường, thu nhập, địa lý và tiếp cận chăm sóc cũng quan trọng.</text></g>
  <text class="tiny" x="60" y="1645">Nền tảng: NCI, ACS, IARC/WHO, Hanahan/Weinberg, GBD, WCRF/AICR và trang bằng chứng của wiki. Với triệu chứng, sàng lọc hoặc nguy cơ cá nhân, hãy hỏi chuyên gia y tế.</text>
</svg>
