<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Night work is a system exposure</title>
  <desc id="desc">A public infographic explaining safer night-shift systems: reduced disruption, light and recovery design, worker power, and cancer-prevention uncertainty.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102033">Night work is a system exposure</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Protect circadian rhythm by designing safer schedules, light, recovery, and worker control.</text>

  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Reduce disruption</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Avoid unnecessary nights;</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">limit long runs of night</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">shifts when possible.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Use predictable, humane</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">schedules.</text>

  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Light and recovery</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Work light may aid alertness;</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">darkness after shift protects</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">sleep and rhythm.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Plan light, commute, meals,</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">and protected sleep.</text>

  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Worker power</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">People need staffing, breaks,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">childcare, transport, and</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">medical accommodations.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Make safety an employer</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">and policy duty.</text>

  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Systems that need protection</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Hospitals, factories, transport, warehouses,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">service work, public safety, and caregiving</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">need cancer-prevention thinking too.</text>

  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Dangerous sleepiness, drowsy driving, sleep</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">apnea symptoms, severe insomnia, pregnancy,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">or medication issues need clinical or</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">occupational support.</text>

  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: NTP/IARC night-shift hazard evaluations; shift-work scheduling papers; sleep and light-intervention reviews.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Safer schedules may reduce circadian strain and fatigue; they are not a guarantee that cancer cannot happen.</text>
</svg>
