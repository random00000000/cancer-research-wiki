<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Kanser: hücreler vücudun kurallarını nasıl bozar</title>
  <desc id="desc">Kanserin nasıl başladığını ve büyüdüğünü, sıfır risk vaadi olmadan riskin nasıl azaltılabileceğini anlatan Türkçe infografik.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="0.52" stop-color="#fff8f2"/><stop offset="1" stop-color="#f5fff8"/></linearGradient>
    <linearGradient id="cellGood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#75d7b3"/><stop offset="1" stop-color="#1f9d8a"/></linearGradient>
    <linearGradient id="cellRisk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbc70"/><stop offset="1" stop-color="#e85d5d"/></linearGradient>
    <linearGradient id="cellTumor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c678dd"/><stop offset="1" stop-color="#6a45b8"/></linearGradient>
    <style>.title{font:800 43px Arial,sans-serif;fill:#102033}.subtitle{font:400 24px Arial,sans-serif;fill:#31445c}.section{font:800 29px Arial,sans-serif;fill:#102033}.label{font:700 21px Arial,sans-serif;fill:#102033}.body{font:400 20px Arial,sans-serif;fill:#24364b}.small{font:400 18px Arial,sans-serif;fill:#475569}.tiny{font:400 15px Arial,sans-serif;fill:#5b6b7f}.card{fill:#fff;stroke:#d8e2ef;stroke-width:2;rx:22}.line{stroke:#64748b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}</style>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>
  <g transform="translate(60 55)"><text class="title" x="0" y="52">Kanser: hücreler kuralları bozar</text><text class="subtitle" x="2" y="92">Kanser nedir, nasıl büyür ve risk sahte garanti olmadan nasıl azaltılır.</text><rect x="0" y="125" width="1080" height="4" fill="#cbd5e1"/></g>
  <g transform="translate(60 220)"><rect class="card" width="320" height="370"/><text class="section" x="24" y="48">1. Normal hücre</text><circle cx="160" cy="145" r="78" fill="url(#cellGood)"/><circle cx="160" cy="145" r="38" fill="#e6fff6"/><path d="M128 146 C142 120,177 120,192 146 C176 171,142 171,128 146 Z" fill="none" stroke="#126c60" stroke-width="8"/><text class="body" x="24" y="260">Sağlıklı dokuda kontroller vardır:</text><text class="small" x="24" y="295">sinyalle büyümek, hasarı onarmak,</text><text class="small" x="24" y="322">güvensiz hücreleri kaldırmak.</text></g>
  <g transform="translate(440 220)"><rect class="card" width="320" height="370"/><text class="section" x="24" y="48">2. Değişimler birikir</text><circle cx="160" cy="145" r="78" fill="url(#cellRisk)"/><circle cx="160" cy="145" r="37" fill="#fff6db"/><path d="M125 138 L148 118 L170 168 L197 105" fill="none" stroke="#9a3412" stroke-width="9" stroke-linecap="round"/><text class="body" x="24" y="260">Maruziyet, enfeksiyon, yaş,</text><text class="small" x="24" y="295">kalıtsal risk ve kopya hataları</text><text class="small" x="24" y="322">hücre talimatlarını değiştirebilir.</text></g>
  <g transform="translate(820 220)"><rect class="card" width="320" height="370"/><text class="section" x="24" y="48">3. Kanser davranışı</text><circle cx="136" cy="130" r="62" fill="url(#cellTumor)"/><circle cx="195" cy="168" r="47" fill="#8b5cf6" opacity=".9"/><circle cx="111" cy="195" r="38" fill="#a855f7" opacity=".9"/><text class="body" x="24" y="260">Fazla bölünebilir, savunmadan kaçabilir,</text><text class="small" x="24" y="295">damar çağırabilir, istila edebilir</text><text class="small" x="24" y="322">ve bazen yayılabilir.</text></g>
  <path class="line" d="M380 405 H440"/><path d="M420 389 L448 405 L420 421 Z" fill="#64748b"/><path class="line" d="M760 405 H820"/><path d="M800 389 L828 405 L800 421 Z" fill="#64748b"/>
  <g transform="translate(60 660)"><rect class="card" width="1080" height="260"/><text class="section" x="30" y="50">Temel döngü</text><text class="body" x="30" y="88">Değişmiş hücre yaşar, çoğalır, baskıya uyum sağlar ve çevre dokuyu değiştirir.</text><text class="body" x="30" y="126">Kök neden tek sihirli tetikleyici değildir: genler, bağışıklık, metabolizma, çevre,</text><text class="body" x="30" y="164">yaş, enfeksiyonlar ve önlemeye erişim birlikte çalışır.</text><text class="small" x="30" y="213">Bu yüzden önleme, erken bulma, biyoloji ve daha iyi tedaviler birlikte gerekir.</text></g>
  <g transform="translate(60 1000)"><text class="section" x="0" y="0">Riski azaltmak: olasılığı düşürür, sıfır yapmaz</text><text class="body" x="0" y="36">Bu adımlar kanıt desteklidir, ama kansersiz yaşam garantisi değildir.</text><g transform="translate(0 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Tütün yok</text><text class="small" x="22" y="78">Dumandan kaçın; bırakmayı destekle.</text></g><g transform="translate(278 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Daha az alkol</text><text class="small" x="22" y="78">Azı daha güvenli; sıfır o riski önler.</text></g><g transform="translate(556 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Hareket</text><text class="small" x="22" y="78">Düzenli aktivite birçok riski düşürür.</text></g><g transform="translate(834 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">UV koruması</text><text class="small" x="22" y="78">Güvenli güneş; solaryum yok.</text></g><g transform="translate(0 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Aşılar</text><text class="small" x="22" y="78">HPV ve hepatit B uygun olduğunda.</text></g><g transform="translate(278 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Tarama</text><text class="small" x="22" y="78">Yaş, risk ve yerel öneriye göre.</text></g><g transform="translate(556 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Sağlıklı örüntü</text><text class="small" x="22" y="78">Bitkiler, tam tahıllar, enerji dengesi.</text></g><g transform="translate(834 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Daha az maruziyet</text><text class="small" x="22" y="78">Hava, iş, radon ve politika önemlidir.</text></g></g>
  <g transform="translate(60 1445)"><rect width="1080" height="150" rx="24" fill="#102033"/><text x="32" y="48" style="font:800 27px Arial,sans-serif;fill:#fff">Önemli: önleme suçlama değildir</text><text x="32" y="86" style="font:400 20px Arial,sans-serif;fill:#e2e8f0">Bazı kanserler çok iyi seçimlere rağmen olur. Yaş, kalıtsal varyantlar, enfeksiyonlar,</text><text x="32" y="116" style="font:400 20px Arial,sans-serif;fill:#e2e8f0">hücre hataları, çevre, gelir, coğrafya ve bakıma erişim de önemlidir.</text></g>
  <text class="tiny" x="60" y="1645">Temel: NCI, ACS, IARC/WHO, Hanahan/Weinberg, GBD, WCRF/AICR ve wiki kanıt sayfaları. Belirti, tarama veya kişisel risk için sağlık uzmanıyla konuşun.</text>
</svg>
