<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">H. pylori - излечимый фактор риска рака желудка</title>
  <desc id="desc">Публичная инфографика о Helicobacter pylori, воспалении желудка, профилактике рака желудка, стратегии тестирования и лечения, устойчивости к антибиотикам и тревожных симптомах.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#102033">H. pylori - излечимый фактор риска рака желудка</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Тестировать и лечить полезно, когда тесты, антибиотики и контроль подходят месту.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Излечимая инфекция</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Стойкая H. pylori может</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">годами воспалять</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">слизистую желудка.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий ориентир</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Искать и лечить в верной</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">группе риска.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Раньше лучше</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Эрадикация полезнее</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">до развитых предраковых</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">изменений желудка.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий ориентир</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Программы высокого риска</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">не ждут симптомов.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Важна устойчивость</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Выбор антибиотика,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">побочные эффекты, контроль</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">и реинфекция зависят от места.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий ориентир</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Следуйте местным правилам;</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">не лечитесь сами.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Системы важны</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Доступ к тестам, эндоскопия, данные устойчивости,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">санитария и наблюдение меняют пользу.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Кровавая рвота, черный стул, анемия,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">трудность глотания, похудение или стойкая боль</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">требуют медицинской оценки.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Опоры: рандомизированные исследования и метаанализы; Cochrane; стратегия IARC; региональные исследования.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Эрадикация снижает риск; она не гарантирует отсутствие рака желудка и не заменяет осмотр врача.</text>
</svg>
