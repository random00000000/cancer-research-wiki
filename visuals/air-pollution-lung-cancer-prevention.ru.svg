<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Более чистый воздух - профилактика рака легкого</title>
  <desc id="desc">Публичная инфографика о PM2.5, долгой экспозиции загрязнения воздуха, риске рака легкого, личной защите, системных изменениях и медицинских границах.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#fff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#102033">Более чистый воздух - профилактика рака легкого</text>
  <text x="94" y="154" font-family="Arial, sans-serif" font-size="24" fill="#334155">Мелкие частицы достигают глубокой ткани легких. Нужны более чистые системы.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">1</text>
  <text x="122" y="354" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#102033">PM2.5 глубоко</text>
  <text x="122" y="396" font-family="Arial, sans-serif" font-size="22" fill="#334155">Частицы от транспорта,</text><text x="122" y="424" font-family="Arial, sans-serif" font-size="22" fill="#334155">сжигания, промышленности</text><text x="122" y="452" font-family="Arial, sans-serif" font-size="22" fill="#334155">и дыма входят в легкие.</text>
  <text x="122" y="512" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#102033">Для людей</text><text x="122" y="548" font-family="Arial, sans-serif" font-size="21" fill="#334155">Проверяйте качество воздуха;</text><text x="122" y="576" font-family="Arial, sans-serif" font-size="21" fill="#334155">снижайте сильную экспозицию.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">2</text>
  <text x="585" y="354" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#102033">Долгое давление</text>
  <text x="585" y="396" font-family="Arial, sans-serif" font-size="22" fill="#334155">Повторная экспозиция</text><text x="585" y="424" font-family="Arial, sans-serif" font-size="22" fill="#334155">может усиливать стресс,</text><text x="585" y="452" font-family="Arial, sans-serif" font-size="22" fill="#334155">воспаление и повреждение.</text>
  <text x="585" y="512" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#102033">Для людей</text><text x="585" y="548" font-family="Arial, sans-serif" font-size="21" fill="#334155">Чистый воздух снижает</text><text x="585" y="576" font-family="Arial, sans-serif" font-size="21" fill="#334155">хроническое давление.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">3</text>
  <text x="1048" y="354" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#102033">Не только курение</text>
  <text x="1048" y="396" font-family="Arial, sans-serif" font-size="22" fill="#334155">Загрязнение важно и</text><text x="1048" y="424" font-family="Arial, sans-serif" font-size="22" fill="#334155">для некурящих; табак</text><text x="1048" y="452" font-family="Arial, sans-serif" font-size="22" fill="#334155">остается главным рычагом.</text>
  <text x="1048" y="512" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#102033">Для людей</text><text x="1048" y="548" font-family="Arial, sans-serif" font-size="21" fill="#334155">Защищайте легкие без</text><text x="1048" y="576" font-family="Arial, sans-serif" font-size="21" fill="#334155">обвинения и ложной уверенности.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial, sans-serif" font-size="31" font-weight="800" fill="#fff">Системы важны</text>
  <text x="130" y="748" font-family="Arial, sans-serif" font-size="23" fill="#f8fafc">Чистый транспорт, энергия, промышленность,</text><text x="130" y="778" font-family="Arial, sans-serif" font-size="23" fill="#f8fafc">фильтры и защита труда снижают риск.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial, sans-serif" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text>
  <text x="814" y="748" font-family="Arial, sans-serif" font-size="23" fill="#111827">Совет по воздуху не является диагнозом.</text><text x="814" y="778" font-family="Arial, sans-serif" font-size="23" fill="#111827">Долгий кашель, кровь, боль в груди или</text><text x="814" y="808" font-family="Arial, sans-serif" font-size="23" fill="#111827">неясная одышка требуют медицинской оценки.</text>
  <text x="92" y="890" font-family="Arial, sans-serif" font-size="19" fill="#334155">Доказательства: метаанализы PM2.5 и рака легкого; обзор JTO; обзоры окислительного стресса и воспаления.</text>
  <text x="92" y="920" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Источники, индексы воздуха, фильтры/маски и правовая защита различаются по странам и регионам.</text>
</svg>
