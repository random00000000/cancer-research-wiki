<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">How mRNA cancer vaccines try to teach T cells</title>
  <desc id="desc">Public explainer showing antigen display, CD8 and CD4 T-cell expansion, tumor access, immune escape, and the need for clinical endpoints.</desc>
  <rect width="1500" height="980" fill="#f6f8fb"/>
  <rect x="48" y="44" width="1404" height="892" rx="24" fill="#ffffff" stroke="#263541" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">An immune response is not the same as a cure</text>
  <text x="94" y="154" font-family="Arial" font-size="24" fill="#25364a">mRNA cancer vaccines try to teach T cells, but clinical outcomes decide whether the teaching helped.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="90" y="220" width="320" height="214" rx="18" fill="#e6f2ee" stroke="#147d64" stroke-width="3"/>
  <text x="125" y="268" font-family="Arial" font-size="30" font-weight="800" fill="#102033">1. Show the target</text>
  <text x="125" y="310" font-family="Arial" font-size="21" fill="#25364a">Antigen-presenting cells</text>
  <text x="125" y="340" font-family="Arial" font-size="21" fill="#25364a">display target fragments on</text>
  <text x="125" y="370" font-family="Arial" font-size="21" fill="#25364a">HLA/MHC molecules.</text>

  <rect x="590" y="220" width="320" height="214" rx="18" fill="#eef4ff" stroke="#4961c8" stroke-width="3"/>
  <text x="625" y="268" font-family="Arial" font-size="30" font-weight="800" fill="#102033">2. Expand T cells</text>
  <text x="625" y="310" font-family="Arial" font-size="21" fill="#25364a">CD8 cells may kill target-</text>
  <text x="625" y="340" font-family="Arial" font-size="21" fill="#25364a">bearing cells. CD4 cells can</text>
  <text x="625" y="370" font-family="Arial" font-size="21" fill="#25364a">support memory and function.</text>

  <rect x="1090" y="220" width="320" height="214" rx="18" fill="#fff0d7" stroke="#c26a0a" stroke-width="3"/>
  <text x="1125" y="268" font-family="Arial" font-size="30" font-weight="800" fill="#102033">3. Reach the tumor</text>
  <text x="1125" y="310" font-family="Arial" font-size="21" fill="#25364a">T cells must find cancer cells</text>
  <text x="1125" y="340" font-family="Arial" font-size="21" fill="#25364a">that still show the matching</text>
  <text x="1125" y="370" font-family="Arial" font-size="21" fill="#25364a">target in hostile tissue.</text>

  <line x1="420" y1="325" x2="575" y2="325" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="920" y1="325" x2="1075" y2="325" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="90" y="515" width="392" height="250" rx="18" fill="#f8fafc" stroke="#9aa8b2" stroke-width="2"/>
  <text x="122" y="560" font-family="Arial" font-size="30" font-weight="800" fill="#102033">What assays can show</text>
  <text x="122" y="604" font-family="Arial" font-size="21" fill="#25364a">Target-specific T cells</text>
  <text x="122" y="638" font-family="Arial" font-size="21" fill="#25364a">Cytokine or killing signals</text>
  <text x="122" y="672" font-family="Arial" font-size="21" fill="#25364a">T-cell clone persistence</text>
  <text x="122" y="706" font-family="Arial" font-size="21" fill="#25364a">Blood response, not always tumor control</text>

  <rect x="554" y="515" width="392" height="250" rx="18" fill="#f4e9ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="588" y="560" font-family="Arial" font-size="30" font-weight="800" fill="#102033">How cancer can escape</text>
  <text x="588" y="604" font-family="Arial" font-size="21" fill="#25364a">Loses the antigen</text>
  <text x="588" y="638" font-family="Arial" font-size="21" fill="#25364a">Stops displaying it on HLA</text>
  <text x="588" y="672" font-family="Arial" font-size="21" fill="#25364a">Blocks or exhausts T cells</text>
  <text x="588" y="706" font-family="Arial" font-size="21" fill="#25364a">Keeps T cells out of the tumor</text>

  <rect x="1020" y="515" width="392" height="250" rx="18" fill="#fff7c2" stroke="#9a7a04" stroke-width="2"/>
  <text x="1054" y="560" font-family="Arial" font-size="30" font-weight="800" fill="#102033">What proves value?</text>
  <text x="1054" y="604" font-family="Arial" font-size="21" fill="#25364a">Less recurrence or progression</text>
  <text x="1054" y="638" font-family="Arial" font-size="21" fill="#25364a">Longer survival or durable control</text>
  <text x="1054" y="672" font-family="Arial" font-size="21" fill="#25364a">Acceptable safety and quality of life</text>
  <text x="1054" y="706" font-family="Arial" font-size="21" fill="#25364a">Peer-reviewed trial evidence</text>

  <rect x="310" y="805" width="880" height="58" rx="29" fill="#102033"/>
  <text x="455" y="842" font-family="Arial" font-size="27" font-weight="800" fill="#ffffff">Immune engagement is not clinical proof.</text>
  <text x="92" y="912" font-family="Arial" font-size="18" fill="#334155">Evidence anchors: autogene cevumeran PDAC studies; individualized mRNA vaccine T-cell reports; cancer vaccine endpoint reviews.</text>
</svg>
