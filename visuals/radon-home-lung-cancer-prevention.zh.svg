<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">氡安全住宅也是肺癌预防</title>
  <desc id="desc">面向公众的信息图，说明看不见的氡暴露、家庭检测、降低暴露、吸烟交互、建筑系统和医疗安全边界。</desc>
  <rect width="1500" height="980" fill="#f7faf8"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#fff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="48" font-weight="800" fill="#102033">氡安全住宅也是肺癌预防</text>
  <text x="94" y="154" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#334155">氡看不见、闻不到。检测和治理把隐藏暴露变成行动路径。</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">1</text>
  <text x="122" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#102033">看不见的气体</text>
  <text x="122" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">氡可从土壤和岩石</text><text x="122" y="424" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">进入住宅，并在室内</text><text x="122" y="452" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">积聚。</text>
  <text x="122" y="512" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="800" fill="#102033">公众方向</text><text x="122" y="548" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">不能靠看或闻判断；</text><text x="122" y="576" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">要检测住宅。</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">2</text>
  <text x="585" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#102033">先检测，再治理</text>
  <text x="585" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">检测发现高水平。</text><text x="585" y="424" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">治理可降低长期</text><text x="585" y="452" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">暴露。</text>
  <text x="585" y="512" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="800" fill="#102033">公众方向</text><text x="585" y="548" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">遵循当地阈值，</text><text x="585" y="576" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">使用合格帮助。</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">3</text>
  <text x="1048" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#102033">吸烟会放大风险</text>
  <text x="1048" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">氡对每个人都重要，</text><text x="1048" y="424" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">但有烟草暴露时，</text><text x="1048" y="452" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">绝对风险高得多。</text>
  <text x="1048" y="512" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="800" fill="#102033">公众方向</text><text x="1048" y="548" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">检测住宅，并支持</text><text x="1048" y="576" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">无责戒烟。</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="31" font-weight="800" fill="#fff">系统很重要</text>
  <text x="130" y="748" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#f8fafc">建筑规范、租房、学校、工作场所</text><text x="130" y="778" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#f8fafc">和治理资金决定谁能被保护。</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="31" font-weight="800" fill="#102033">安全边界</text>
  <text x="814" y="748" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#111827">这张图不能评估肺部症状。</text><text x="814" y="778" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#111827">持续咳嗽、咳血、胸痛或原因不明</text><text x="814" y="808" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#111827">的气短需要医疗评估。</text>
  <text x="92" y="890" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#334155">证据锚点：住宅氡荟萃分析；欧洲和北美汇总分析；从不吸烟者氡证据。</text>
  <text x="92" y="920" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748b">行动水平、检测单位、租户权利和治理规则因国家和地区而异。</text>
</svg>
