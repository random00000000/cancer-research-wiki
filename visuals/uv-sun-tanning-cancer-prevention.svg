<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">UV protection lowers skin cancer risk</title>
  <desc id="desc">A public infographic explaining UV DNA damage, indoor tanning risk, layered sun protection, outdoor worker and child protection, and clinical evaluation of suspicious skin changes.</desc>
  <rect width="1500" height="980" fill="#fbfaf5"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#29312b" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102033">Protect skin from repeated UV injury</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Sunlight is part of life. Burns and tanning beds are preventable cancer risks.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">UV can damage DNA</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">UVA and UVB can injure</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">skin cells through direct</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">and indirect DNA damage.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Avoid repeated burns;</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">protect high-UV days.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">No tanning beds</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">A tanning bed is not a</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">safe controlled alternative;</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">a tan signals UV injury.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Skip indoor tanning;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">protect teens and young adults.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Layer protection</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Shade, clothing, hats,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">sunglasses, sunscreen, and</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">schedule changes work together.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Sunscreen is one layer,</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">not permission to burn.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Systems matter</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Shade at schools and worksites, safer schedules,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">protective gear, and tanning policies reduce exposure.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">A visual checklist is not a diagnosis.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Changing, bleeding, painful, non-healing, or unusual</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">skin spots need clinician evaluation.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: IARC solar/UV and sunbeds; indoor tanning meta-analyses; Nambour sunscreen trials; UV DNA-damage reviews.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Risk differs by skin tone, immune state, geography, work, age, past exposure, and shade access.</text>
</svg>
