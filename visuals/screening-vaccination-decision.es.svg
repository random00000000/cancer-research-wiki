<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Guía de decisiones sobre cribado y vacunación contra el cáncer</title>
  <desc id="desc">Infografía en español que explica cómo síntomas, riesgo, beneficios, daños y seguimiento influyen en el cribado y la vacunación.</desc>
  <rect width="1200" height="850" fill="#f8fbff"/>
  <rect x="48" y="42" width="1104" height="766" rx="24" fill="#ffffff" stroke="#d8e2ef" stroke-width="3"/>
  <text x="84" y="104" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#102033">Cribado y vacunas ayudan a prevenir cáncer</text>
  <text x="86" y="142" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">La pregunta útil es qué herramienta encaja con la persona, el riesgo y el seguimiento.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="84" y="190" width="310" height="190" rx="18" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="112" y="240" font-size="26" font-weight="800" fill="#102033">¿Síntomas?</text>
    <text x="112" y="288" font-size="20" fill="#334155">Síntomas nuevos o persistentes</text>
    <text x="112" y="316" font-size="20" fill="#334155">no son cribado.</text>
    <text x="112" y="354" font-size="21" font-weight="800" fill="#102033">Busca evaluación médica.</text>
    <rect x="445" y="190" width="310" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="473" y="240" font-size="26" font-weight="800" fill="#102033">¿Sin síntomas?</text>
    <text x="473" y="288" font-size="20" fill="#334155">Revisa edad, anatomía,</text>
    <text x="473" y="316" font-size="20" fill="#334155">antecedentes, infecciones,</text>
    <text x="473" y="344" font-size="20" fill="#334155">riesgo y guías locales.</text>
    <rect x="806" y="190" width="310" height="190" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="834" y="240" font-size="26" font-weight="800" fill="#102033">Elige herramientas</text>
    <text x="834" y="288" font-size="20" fill="#334155">Algunas previenen cáncer.</text>
    <text x="834" y="316" font-size="20" fill="#334155">Algunas lo detectan antes.</text>
    <text x="834" y="354" font-size="21" font-weight="800" fill="#102033">Ajusta al riesgo.</text>
    <rect x="84" y="440" width="310" height="170" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="112" y="488" font-size="26" font-weight="800" fill="#102033">Vacunas</text>
    <text x="112" y="532" font-size="20" fill="#334155">VPH: previene infecciones</text>
    <text x="112" y="560" font-size="20" fill="#334155">que causan varios cánceres.</text>
    <text x="112" y="588" font-size="20" fill="#334155">Hepatitis B: protege el hígado.</text>
    <rect x="445" y="440" width="310" height="170" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="473" y="488" font-size="26" font-weight="800" fill="#102033">Cribado</text>
    <text x="473" y="532" font-size="20" fill="#334155">Puede detectar cáncer antes</text>
    <text x="473" y="560" font-size="20" fill="#334155">o encontrar lesiones previas.</text>
    <rect x="806" y="440" width="310" height="170" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="834" y="488" font-size="26" font-weight="800" fill="#102033">Equilibrio</text>
    <text x="834" y="532" font-size="20" fill="#334155">Falsas alarmas, daños, coste,</text>
    <text x="834" y="560" font-size="20" fill="#334155">estrés y acceso importan.</text>
    <text x="834" y="588" font-size="20" font-weight="800" fill="#102033">El seguimiento cuenta.</text>
  </g>
  <rect x="84" y="675" width="1032" height="68" rx="22" fill="#102033"/>
  <text x="118" y="718" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Mensaje seguro: pregunta qué prevención encaja con tu edad, cuerpo, historia, riesgo y acceso a seguimiento.</text>
  <text x="84" y="790" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">Educación, no consejo médico personal. Base: cribado, daños del cribado, prevención por infecciones y vacunas VPH/VHB.</text>
</svg>
