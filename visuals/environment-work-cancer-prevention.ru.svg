<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Профилактика рака — это также среда и безопасная работа</title>
  <desc id="desc">Общественная инфографика о радоне, асбесте, загрязнении воздуха и рабочих канцерогенах как целях профилактики, требующих тестов, контроля, политики и устранения.</desc>
  <rect width="1500" height="980" fill="#f7f4ee"/>
  <rect x="50" y="44" width="1400" height="892" rx="24" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#102033">Профилактика рака — это чистый воздух и безопасная работа</text>
  <text x="94" y="158" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#46515f">Часть рисков идет от зданий, работы, воздуха, материалов и политики, а не только от привычек.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="220" width="305" height="340" rx="18" fill="#e8f1f2" stroke="#1b5d66" stroke-width="3"/>
    <circle cx="152" cy="285" r="40" fill="#1b5d66"/><text x="152" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="122" y="358" font-size="28" font-weight="700" fill="#102033">Радон</text>
    <text x="122" y="400" font-size="20" fill="#46515f">Невидимый газ в</text><text x="122" y="428" font-size="20" fill="#46515f">некоторых зданиях.</text>
    <text x="122" y="486" font-size="23" font-weight="700" fill="#102033">Рычаг</text>
    <text x="122" y="520" font-size="20" fill="#46515f">Тестировать, снижать,</text><text x="122" y="548" font-size="20" fill="#46515f">проветривать.</text>
    <rect x="432" y="220" width="305" height="340" rx="18" fill="#fff1d9" stroke="#a26119" stroke-width="3"/>
    <circle cx="492" cy="285" r="40" fill="#a26119"/><text x="492" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="462" y="358" font-size="28" font-weight="700" fill="#102033">Асбест</text>
    <text x="462" y="400" font-size="20" fill="#46515f">Волокна могут идти</text><text x="462" y="428" font-size="20" fill="#46515f">с работы домой.</text>
    <text x="462" y="486" font-size="23" font-weight="700" fill="#102033">Рычаг</text>
    <text x="462" y="520" font-size="20" fill="#46515f">Не тревожить; нужна</text><text x="462" y="548" font-size="20" fill="#46515f">профоценка и удаление.</text>
    <rect x="772" y="220" width="305" height="340" rx="18" fill="#e9ecff" stroke="#3e4d9a" stroke-width="3"/>
    <circle cx="832" cy="285" r="40" fill="#3e4d9a"/><text x="832" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="802" y="358" font-size="28" font-weight="700" fill="#102033">PM2.5</text>
    <text x="802" y="400" font-size="20" fill="#46515f">Мелкие частицы повышают</text><text x="802" y="428" font-size="20" fill="#46515f">риск рака легкого.</text>
    <text x="802" y="486" font-size="23" font-weight="700" fill="#102033">Рычаг</text>
    <text x="802" y="520" font-size="20" fill="#46515f">Чище транспорт, энергия,</text><text x="802" y="548" font-size="20" fill="#46515f">промышленность.</text>
    <rect x="1112" y="220" width="305" height="340" rx="18" fill="#fde8e6" stroke="#ad3434" stroke-width="3"/>
    <circle cx="1172" cy="285" r="40" fill="#ad3434"/><text x="1172" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="1142" y="358" font-size="28" font-weight="700" fill="#102033">Работа</text>
    <text x="1142" y="400" font-size="20" fill="#46515f">Пыль, дым, дизель,</text><text x="1142" y="428" font-size="20" fill="#46515f">кремнезем, металлы.</text>
    <text x="1142" y="486" font-size="23" font-weight="700" fill="#102033">Рычаг</text>
    <text x="1142" y="520" font-size="20" fill="#46515f">Заменять, закрывать,</text><text x="1142" y="548" font-size="20" fill="#46515f">вентилировать, защищать.</text>
  </g>
  <rect x="92" y="625" width="625" height="172" rx="18" fill="#102033"/>
  <text x="130" y="674" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Публичный смысл</text>
  <text x="130" y="718" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Профилактика включает безопасные здания,</text>
  <text x="130" y="750" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">чистый воздух, защиту работников и политику.</text>
  <text x="130" y="782" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Структурные экспозиции — не личная вина.</text>
  <rect x="775" y="625" width="633" height="172" rx="18" fill="#f4d35e" stroke="#8a6a00" stroke-width="3"/>
  <text x="813" y="674" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102033">Граница безопасности</text>
  <text x="813" y="718" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Асбест, высокий радон и рабочие экспозиции</text>
  <text x="813" y="750" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">требуют квалифицированной оценки. Симптомы</text>
  <text x="813" y="782" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">или тесты — к клиницисту или специалисту.</text>
  <text x="92" y="858" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46515f">Источники: метаанализ радона в жилье; европейский анализ радона; обзор асбеста;</text>
  <text x="92" y="886" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46515f">метаанализ нерабочего асбеста и мезотелиомы; метаанализ PM2.5 и рака легкого.</text>
  <text x="92" y="918" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b7280">Снижение риска не гарантия. Доза, срок, курение, жилье, работа, место и политика меняют экспозицию и риск.</text>
</svg>
