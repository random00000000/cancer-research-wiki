<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Ночная работа - системное воздействие</title>
  <desc id="desc">Общественная инфографика о более безопасных ночных сменах: меньше сбоя, свет и восстановление, права работников и неопределенность риска рака.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">Ночная работа - системное воздействие</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">Защищайте ритм через более безопасные графики, свет, восстановление и право голоса.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Меньше сбоя</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Избегайте лишних ночей;</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">ограничивайте длинные</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">серии ночных смен.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий вывод</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Нужны предсказуемые</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">и гуманные графики.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Свет и отдых</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Свет на работе может бодрить;</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">темнота после смены</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">защищает сон и ритм.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий вывод</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Планируйте свет, дорогу,</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">еду и защищенный сон.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Голос работников</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Нужны штат, перерывы,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">уход за детьми, транспорт</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">и мед. адаптации.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий вывод</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Безопасность - обязанность</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">работодателей и политики.</text>
  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="30" font-weight="800" fill="#ffffff">Системы, которым нужен щит</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Больницы, заводы, транспорт, склады,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">сервис, общественная безопасность и уход</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">тоже требуют профилактики рака.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Опасная сонливость, вождение после смены,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">апноэ сна, тяжелая бессонница, беременность</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">или лекарства требуют клинической</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">или профессиональной поддержки.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Опоры доказательств: оценки NTP/IARC; работы о графиках; обзоры сна и световых вмешательств.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Более безопасные графики могут снизить сбой ритма и усталость; это не гарантия от рака.</text>
</svg>
