<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">癌症预防也包括环境和工作保护</title>
  <desc id="desc">公共信息图：氡、石棉、空气污染和工作场所致癌物是癌症预防目标，需要检测、控制、政策和修复。</desc>
  <rect width="1500" height="980" fill="#f7f4ee"/>
  <rect x="50" y="44" width="1400" height="892" rx="24" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="92" y="112" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="52" font-weight="700" fill="#102033">癌症预防也需要清洁空气和安全工作</text>
  <text x="94" y="158" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" fill="#46515f">有些风险来自建筑、工作、空气、材料和政策选择，不只是个人习惯。</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <rect x="92" y="220" width="305" height="340" rx="18" fill="#e8f1f2" stroke="#1b5d66" stroke-width="3"/>
    <circle cx="152" cy="285" r="40" fill="#1b5d66"/><text x="152" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="122" y="358" font-size="28" font-weight="700" fill="#102033">氡</text>
    <text x="122" y="400" font-size="20" fill="#46515f">某些住宅和建筑中的</text><text x="122" y="428" font-size="20" fill="#46515f">无形气体。</text>
    <text x="122" y="486" font-size="23" font-weight="700" fill="#102033">杠杆</text>
    <text x="122" y="520" font-size="20" fill="#46515f">检测、降低、通风，</text><text x="122" y="548" font-size="20" fill="#46515f">并更安全地建造。</text>
    <rect x="432" y="220" width="305" height="340" rx="18" fill="#fff1d9" stroke="#a26119" stroke-width="3"/>
    <circle cx="492" cy="285" r="40" fill="#a26119"/><text x="492" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="462" y="358" font-size="28" font-weight="700" fill="#102033">石棉</text>
    <text x="462" y="400" font-size="20" fill="#46515f">纤维可从工作场所</text><text x="462" y="428" font-size="20" fill="#46515f">进入家庭。</text>
    <text x="462" y="486" font-size="23" font-weight="700" fill="#102033">杠杆</text>
    <text x="462" y="520" font-size="20" fill="#46515f">不要随意扰动；</text><text x="462" y="548" font-size="20" fill="#46515f">需专业评估和清除。</text>
    <rect x="772" y="220" width="305" height="340" rx="18" fill="#e9ecff" stroke="#3e4d9a" stroke-width="3"/>
    <circle cx="832" cy="285" r="40" fill="#3e4d9a"/><text x="832" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="802" y="358" font-size="28" font-weight="700" fill="#102033">PM2.5 空气</text>
    <text x="802" y="400" font-size="20" fill="#46515f">细颗粒物会提高</text><text x="802" y="428" font-size="20" fill="#46515f">肺癌风险。</text>
    <text x="802" y="486" font-size="23" font-weight="700" fill="#102033">杠杆</text>
    <text x="802" y="520" font-size="20" fill="#46515f">更清洁的交通、能源、</text><text x="802" y="548" font-size="20" fill="#46515f">工业和室内空气。</text>
    <rect x="1112" y="220" width="305" height="340" rx="18" fill="#fde8e6" stroke="#ad3434" stroke-width="3"/>
    <circle cx="1172" cy="285" r="40" fill="#ad3434"/><text x="1172" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="1142" y="358" font-size="28" font-weight="700" fill="#102033">工作场所</text>
    <text x="1142" y="400" font-size="20" fill="#46515f">粉尘、烟雾、柴油、</text><text x="1142" y="428" font-size="20" fill="#46515f">硅尘、金属、溶剂。</text>
    <text x="1142" y="486" font-size="23" font-weight="700" fill="#102033">杠杆</text>
    <text x="1142" y="520" font-size="20" fill="#46515f">替代、封闭、通风、</text><text x="1142" y="548" font-size="20" fill="#46515f">监测并保护工人。</text>
  </g>
  <rect x="92" y="625" width="625" height="172" rx="18" fill="#102033"/>
  <text x="130" y="674" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">公共意义</text>
  <text x="130" y="718" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" fill="#d9e4ef">预防包括更安全的建筑、清洁空气、</text>
  <text x="130" y="750" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" fill="#d9e4ef">工人保护、环境修复和公平政策。</text>
  <text x="130" y="782" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" fill="#d9e4ef">不要把结构性暴露变成个人责备。</text>
  <rect x="775" y="625" width="633" height="172" rx="18" fill="#f4d35e" stroke="#8a6a00" stroke-width="3"/>
  <text x="813" y="674" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#102033">安全边界</text>
  <text x="813" y="718" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" fill="#102033">石棉、高氡和职业暴露需要合格评估。</text>
  <text x="813" y="750" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" fill="#102033">症状或检测结果应交给临床人员</text>
  <text x="813" y="782" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" fill="#102033">或暴露评估专业人员。</text>
  <text x="92" y="858" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" fill="#46515f">证据锚点：住宅氡荟萃分析；欧洲氡汇总分析；石棉肺癌综述；</text>
  <text x="92" y="886" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" fill="#46515f">非职业石棉/间皮瘤荟萃分析；PM2.5 与肺癌荟萃分析。</text>
  <text x="92" y="918" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" fill="#6b7280">降低风险不是保证。剂量、时间、吸烟、住房、职业、地点和政策都会改变暴露和风险。</text>
</svg>
