<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Cambios persistentes merecen atencion</title>
  <desc id="desc">Infografia publica que explica que una imagen de prevencion no diagnostica sintomas, los cambios persistentes necesitan evaluacion medica y el seguimiento importa.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">Cambios persistentes merecen atencion</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">La mayoria de sintomas no son cancer, pero una grafica no puede diagnosticar.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Note patrones</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Cambios nuevos, persistentes,</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">peores, con sangre, bultos</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">o sin explicacion importan.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Accion</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Anote que cambio y</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">cuando empezo.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Busque evaluacion</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Los sintomas no son</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">tamizaje. Un clinico puede</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">examinar y decidir pasos.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Accion</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">No reemplace cuidado con</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">dietas, detox o calma falsa.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">De seguimiento</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Si continua, vuelva.</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">Si la explicacion no encaja,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">pregunte que mas podria ser.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Accion</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Guarde resultados, fechas,</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">fotos y preguntas.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Acceso tambien previene</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Costo, tiempo, estigma, transporte, idioma, discapacidad</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">y desconfianza pueden retrasar cuidado.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Limite urgente</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Sangrado fuerte, dolor severo, falta de aire,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">sintomas neurologicos, confusion o deterioro</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">rapido necesitan ayuda medica urgente.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Anclajes: revisiones de sintomas; estudios predictivos en atencion primaria; busqueda de ayuda; metaanalisis de demora.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Una lista de sintomas no confirma ni descarta cancer. Solo apunta a evaluacion y seguimiento oportunos.</text>
</svg>
