<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Las infecciones pueden ser objetivos de prevención del cáncer</title>
  <desc id="desc">Infografía pública que explica que el cáncer no es contagioso, pero algunas infecciones persistentes elevan el riesgo y pueden prevenirse, detectarse o tratarse.</desc>
  <rect width="1500" height="980" fill="#f7f4ee"/>
  <rect x="50" y="44" width="1400" height="892" rx="24" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#102033">Algunas infecciones pueden aumentar el riesgo de cáncer</text>
  <text x="94" y="158" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#46515f">El cáncer no se contagia como un resfriado, pero una infección persistente puede dañar tejidos</text>
  <text x="94" y="190" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#46515f">o alterar células.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="215" width="400" height="390" rx="18" fill="#e8f1f2" stroke="#1b5d66" stroke-width="3"/>
    <circle cx="156" cy="285" r="42" fill="#1b5d66"/>
    <text x="156" y="301" font-size="39" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="220" y="278" font-size="31" font-weight="700" fill="#102033">VPH</text>
    <text x="220" y="313" font-size="21" fill="#46515f">Virus del papiloma humano</text>
    <text x="122" y="372" font-size="25" font-weight="700" fill="#102033">Relación con cáncer</text>
    <text x="122" y="408" font-size="21" fill="#46515f">Cáncer cervical y algunos</text>
    <text x="122" y="436" font-size="21" fill="#46515f">cánceres anales, de garganta,</text>
    <text x="122" y="464" font-size="21" fill="#46515f">vulva, vagina y pene.</text>
    <text x="122" y="514" font-size="25" font-weight="700" fill="#102033">Palanca preventiva</text>
    <text x="122" y="548" font-size="21" fill="#46515f">Vacunar temprano; mantener</text>
    <text x="122" y="576" font-size="21" fill="#46515f">tamizaje y seguimiento.</text>
    <rect x="550" y="215" width="400" height="390" rx="18" fill="#fff1d9" stroke="#a26119" stroke-width="3"/>
    <circle cx="614" cy="285" r="42" fill="#a26119"/>
    <text x="614" y="301" font-size="39" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="678" y="278" font-size="31" font-weight="700" fill="#102033">VHB y VHC</text>
    <text x="678" y="313" font-size="21" fill="#46515f">Hepatitis B y C</text>
    <text x="580" y="372" font-size="25" font-weight="700" fill="#102033">Relación con cáncer</text>
    <text x="580" y="408" font-size="21" fill="#46515f">La infección hepática crónica</text>
    <text x="580" y="436" font-size="21" fill="#46515f">puede llevar a cirrosis y</text>
    <text x="580" y="464" font-size="21" fill="#46515f">riesgo de cáncer de hígado.</text>
    <text x="580" y="514" font-size="25" font-weight="700" fill="#102033">Palanca preventiva</text>
    <text x="580" y="548" font-size="21" fill="#46515f">Vacuna VHB, sangre e inyecciones</text>
    <text x="580" y="576" font-size="21" fill="#46515f">seguras, prueba y cura del VHC.</text>
    <rect x="1008" y="215" width="400" height="390" rx="18" fill="#e9ecff" stroke="#3e4d9a" stroke-width="3"/>
    <circle cx="1072" cy="285" r="42" fill="#3e4d9a"/>
    <text x="1072" y="301" font-size="39" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="1136" y="278" font-size="31" font-weight="700" fill="#102033">H. pylori</text>
    <text x="1136" y="313" font-size="21" fill="#46515f">Bacteria del estómago</text>
    <text x="1038" y="372" font-size="25" font-weight="700" fill="#102033">Relación con cáncer</text>
    <text x="1038" y="408" font-size="21" fill="#46515f">Puede inflamar el estómago</text>
    <text x="1038" y="436" font-size="21" fill="#46515f">por años y elevar el riesgo</text>
    <text x="1038" y="464" font-size="21" fill="#46515f">de cáncer gástrico.</text>
    <text x="1038" y="514" font-size="25" font-weight="700" fill="#102033">Palanca preventiva</text>
    <text x="1038" y="548" font-size="21" fill="#46515f">Detectar y tratar cuando la</text>
    <text x="1038" y="576" font-size="21" fill="#46515f">evidencia y el riesgo encajan.</text>
  </g>
  <rect x="92" y="640" width="625" height="172" rx="18" fill="#102033"/>
  <text x="130" y="690" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Mensaje público</text>
  <text x="130" y="734" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">La prevención no es solo estilo de vida. Vacunas,</text>
  <text x="130" y="766" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">pruebas, tratamiento, saneamiento y seguimiento</text>
  <text x="130" y="798" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">pueden bloquear vías antes del cáncer.</text>
  <rect x="775" y="640" width="633" height="172" rx="18" fill="#f4d35e" stroke="#8a6a00" stroke-width="3"/>
  <text x="813" y="690" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102033">Límite de seguridad</text>
  <text x="813" y="734" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Use guías locales de vacunas, tamizaje y tratamiento.</text>
  <text x="813" y="766" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Síntomas, resultados, hígado o estómago enfermos</text>
  <text x="813" y="798" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">deben revisarse con un profesional clínico.</text>
  <text x="92" y="862" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46515f">Fuentes: de Martel/Lancet Glob Health 2020; Lei/NEJM 2020; programa VPH de Inglaterra;</text>
  <text x="92" y="890" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46515f">VHB Taiwán; cohortes VHC; metaanálisis de H. pylori.</text>
  <text x="92" y="922" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b7280">Reducir riesgo no es garantizar. Acceso, tiempo, cepa, biología, seguimiento y calidad del sistema cambian resultados.</text>
</svg>
