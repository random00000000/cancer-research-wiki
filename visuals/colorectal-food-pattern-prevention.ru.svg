<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Пищевой режим важен для риска колоректального рака</title>
  <desc id="desc">Общественная инфографика о продуктах с клетчаткой, ограничении переработанного мяса, скрининге, доступе и симптомах, требующих медицинской оценки.</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, sans-serif" font-size="43" font-weight="800" fill="#102033">Пищевой режим важен для колоректального рака</text>
  <text x="94" y="154" font-family="Arial, sans-serif" font-size="24" fill="#334155">Цель - более здоровая среда кишки, не чудо-продукт и не идеальная диета.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Больше клетчатки</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Цельные злаки, бобовые,</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">овощи, фрукты и другие</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">продукты с клетчаткой.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общее направление</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Сделать такую еду</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">доступнее каждый день.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="26" font-weight="800" fill="#102033">Меньше колбасных</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Переработанное мясо</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">связано с более высоким</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">риском рака кишечника.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общее направление</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Менять привычные блюда;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">не обвинять людей.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="27" font-weight="800" fill="#102033">Скрининг важен</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Питание меняет риск;</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">скрининг может найти</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">ранний рак или полипы.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общее направление</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Делать оба по совету;</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">контролировать результаты.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Системы важны</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Цена, время, культура, работа, школьное питание,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">магазины, кухни и реклама влияют на выбор еды.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Диета не заменяет диагноз, скрининг или лечение.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Кровь в стуле, стойкие изменения, анемия</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">или потеря веса требуют медицинской оценки.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Данные: BMJ мета-анализ клетчатки/цельных злаков; PLOS красное/переработанное мясо; оценка IARC/Lancet.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Первичный перевод: перед окончательным медицинским использованием нужна проверка носителем языка.</text>
</svg>
