<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Cómo el cáncer sigue adaptándose</title>
  <desc id="desc">Infografía en español sobre variación, presión selectiva, ecosistema tumoral y metástasis.</desc>
  <rect width="1200" height="900" fill="#f8fbff"/>
  <rect x="48" y="42" width="1104" height="816" rx="24" fill="#ffffff" stroke="#d8e2ef" stroke-width="3"/>
  <text x="86" y="112" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">Cómo el cáncer sigue adaptándose</text>
  <text x="88" y="154" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334155">No es una sola célula mala: es un sistema que evoluciona bajo presión.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="86" y="210" width="245" height="230" rx="18" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
    <text x="112" y="260" font-size="28" font-weight="800" fill="#102033">1. Variación</text>
    <circle cx="150" cy="330" r="36" fill="#a855f7"/><circle cx="214" cy="318" r="28" fill="#f97316"/><circle cx="270" cy="354" r="32" fill="#0ea5e9"/>
    <text x="112" y="402" font-size="20" fill="#334155">Las células tumorales</text><text x="112" y="428" font-size="20" fill="#334155">pueden ser diferentes.</text>
    <rect x="358" y="210" width="245" height="230" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="384" y="260" font-size="28" font-weight="800" fill="#102033">2. Selección</text>
    <rect x="388" y="306" width="160" height="42" rx="21" fill="#f97316"/>
    <text x="410" y="335" font-size="20" font-weight="800" fill="#ffffff">presión</text>
    <text x="384" y="402" font-size="20" fill="#334155">Oxígeno bajo, inmunidad</text><text x="384" y="428" font-size="20" fill="#334155">o terapia favorecen sobrevivientes.</text>
    <rect x="630" y="210" width="245" height="230" rx="18" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <text x="656" y="260" font-size="28" font-weight="800" fill="#102033">3. Ecosistema</text>
    <circle cx="730" cy="332" r="58" fill="#c084fc"/><circle cx="664" cy="310" r="24" fill="#38bdf8"/><rect x="790" y="300" width="58" height="24" rx="12" fill="#ef4444"/>
    <text x="656" y="402" font-size="20" fill="#334155">Inmunidad, vasos, matriz</text><text x="656" y="428" font-size="20" fill="#334155">y señales cambian el tumor.</text>
    <rect x="902" y="210" width="210" height="230" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="928" y="260" font-size="28" font-weight="800" fill="#102033">4. Diseminación</text>
    <path d="M930 330 L975 330 L1020 330 L1065 330" stroke="#475569" stroke-width="5" fill="none"/>
    <circle cx="930" cy="330" r="18" fill="#7c3aed"/><circle cx="975" cy="330" r="18" fill="#f97316"/><circle cx="1020" cy="330" r="18" fill="#94a3b8"/><circle cx="1065" cy="330" r="18" fill="#dc2626"/>
    <text x="928" y="402" font-size="20" fill="#334155">La metástasis requiere</text><text x="928" y="428" font-size="20" fill="#334155">muchos éxitos raros.</text>
  </g>
  <rect x="86" y="510" width="1026" height="138" rx="20" fill="#102033"/>
  <text x="124" y="560" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#ffffff">Idea central</text>
  <text x="124" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#dbeafe">Controlar el cáncer exige mirar células, evolución, ecosistema, escape inmune y diseminación.</text>
  <text x="86" y="740" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">Reducir riesgo no es garantía. Para síntomas, diagnóstico, tratamiento o riesgo personal, consulta a profesionales clínicos.</text>
  <text x="86" y="790" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155">Base: Hallmarks of Cancer 2011/2022; evolución clonal; microambiente tumoral; revisiones de colonización metastásica.</text>
</svg>
