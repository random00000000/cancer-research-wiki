<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Metabolic signals and body fatness affect cancer risk</title>
  <desc id="desc">A public infographic explaining body fatness, metabolic signaling, cancer-site specificity, systems access, and no-blame safety boundaries.</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" fill="#102033">Metabolic signals and body fatness affect cancer risk</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Metabolic health is biology plus environment, not a moral score.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Site-specific signal</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Stronger links include</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">endometrium, kidney, liver,</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">colorectum, pancreas, breast.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Use site maps; do not</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">flatten every cancer together.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Mechanisms matter</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Insulin/IGF, hormones,</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">inflammation, adipokines,</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">and fatty liver can matter.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Support metabolic health;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">avoid miracle promises.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">BMI is not the person</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">BMI is crude. Body</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">composition, illness, age,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">and access change context.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Measure risk humbly;</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">never shame bodies.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Systems matter</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Food access, movement, sleep, medicines, disability,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">stress, poverty, work, and care access shape risk.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Weight advice is not diagnosis, screening, or care.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Symptoms, eating disorders, diabetes, pregnancy,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">or cancer treatment need clinician support.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: BMJ adiposity umbrella review; IARC body-fatness evaluation; WCRF/AICR evidence; MR mechanism studies.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Best public wording: support metabolic health and systems; risk reduction is not body blame.</text>
</svg>
