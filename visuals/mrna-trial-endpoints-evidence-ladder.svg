<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">mRNA cancer trial endpoints evidence ladder</title>
  <desc id="desc">Public education visual explaining that immune response, tumor shrinkage, recurrence-free survival, progression-free survival, overall survival, and safety answer different questions in mRNA cancer trials.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="70" y="76" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">A trial result is only as strong as its endpoint</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="22" fill="#334155">Immune activation is important biology. Patient benefit still needs clinical endpoints and safety context.</text>

  <g font-family="Arial, sans-serif">
    <rect x="120" y="600" width="900" height="58" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="150" y="636" font-size="21" font-weight="700" fill="#075985">Immune response</text>
    <text x="390" y="636" font-size="17" fill="#0c4a6e">T cells recognize vaccine targets; this does not equal cure.</text>

    <rect x="120" y="510" width="900" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="150" y="546" font-size="21" font-weight="700" fill="#166534">Tumor shrinkage</text>
    <text x="390" y="546" font-size="17" fill="#14532d">Useful in advanced disease; durability still matters.</text>

    <rect x="120" y="420" width="900" height="58" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="150" y="456" font-size="21" font-weight="700" fill="#854d0e">Recurrence-free survival</text>
    <text x="390" y="456" font-size="17" fill="#713f12">Important after surgery; follow-up and control arm matter.</text>

    <rect x="120" y="330" width="900" height="58" rx="8" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/>
    <text x="150" y="366" font-size="21" font-weight="700" fill="#86198f">Progression-free survival</text>
    <text x="390" y="366" font-size="17" fill="#701a75">Shows delayed growth/spread; not always longer life.</text>

    <rect x="120" y="240" width="900" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="150" y="276" font-size="21" font-weight="700" fill="#991b1b">Overall survival</text>
    <text x="390" y="276" font-size="17" fill="#7f1d1d">Often most meaningful, but slower and affected by later care.</text>

    <rect x="120" y="150" width="900" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="150" y="186" font-size="21" font-weight="700" fill="#5b21b6">Safety and tolerability</text>
    <text x="390" y="186" font-size="17" fill="#4c1d95">Required at every step; benefit must outweigh harm.</text>

    <path d="M1060 650 V165" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="1040" y="704" font-size="17" fill="#475569" transform="rotate(-90 1040 704)">More direct clinical meaning</text>

    <rect x="70" y="688" width="1040" height="42" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="96" y="715" font-size="17" fill="#9a3412">Ask: What endpoint was measured? In which cancer setting? With which combination? What harms were seen?</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
