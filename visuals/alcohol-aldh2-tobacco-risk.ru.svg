<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Риск алкоголя зависит от биологии и совместных экспозиций</title>
  <desc id="desc">Общественная инфографика об ацетальдегиде, покраснении после алкоголя, биологии ALDH2 и сочетании табака с алкоголем как факторах риска без обвинения и генетического детерминизма.</desc>
  <rect width="1500" height="980" fill="#f7f4ee"/>
  <rect x="50" y="44" width="1400" height="892" rx="24" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#102033">Риск алкоголя зависит от дозы, биологии и табака</text>
  <text x="94" y="158" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#46515f">Меньше алкоголя обычно означает ниже риск. Без алкоголя нет алкоголь-атрибутивного риска.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="220" width="390" height="390" rx="18" fill="#e8f1f2" stroke="#1b5d66" stroke-width="3"/>
    <circle cx="152" cy="285" r="40" fill="#1b5d66"/><text x="152" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="122" y="356" font-size="28" font-weight="700" fill="#102033">Ацетальдегид</text>
    <text x="122" y="398" font-size="21" fill="#46515f">Алкоголь превращается</text><text x="122" y="426" font-size="21" fill="#46515f">в ацетальдегид, который</text><text x="122" y="454" font-size="21" fill="#46515f">может повреждать ДНК.</text>
    <text x="122" y="512" font-size="23" font-weight="700" fill="#102033">Публичный путь</text><text x="122" y="546" font-size="21" fill="#46515f">Пить меньше или не пить.</text>
    <rect x="555" y="220" width="390" height="390" rx="18" fill="#fff1d9" stroke="#a26119" stroke-width="3"/>
    <circle cx="615" cy="285" r="40" fill="#a26119"/><text x="615" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="585" y="356" font-size="28" font-weight="700" fill="#102033">Покраснение и ALDH2</text>
    <text x="585" y="398" font-size="21" fill="#46515f">Покраснение лица после</text><text x="585" y="426" font-size="21" fill="#46515f">алкоголя может указывать</text><text x="585" y="454" font-size="21" fill="#46515f">на медленный клиренс.</text>
    <text x="585" y="512" font-size="23" font-weight="700" fill="#102033">Публичный путь</text><text x="585" y="546" font-size="21" fill="#46515f">Это предупреждение,</text><text x="585" y="574" font-size="21" fill="#46515f">не доказательство безопасности.</text>
    <rect x="1018" y="220" width="390" height="390" rx="18" fill="#fde8e6" stroke="#ad3434" stroke-width="3"/>
    <circle cx="1078" cy="285" r="40" fill="#ad3434"/><text x="1078" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="1048" y="356" font-size="28" font-weight="700" fill="#102033">Табак плюс алкоголь</text>
    <text x="1048" y="398" font-size="21" fill="#46515f">Вместе они особенно важны</text><text x="1048" y="426" font-size="21" fill="#46515f">для рта, горла, гортани</text><text x="1048" y="454" font-size="21" fill="#46515f">и пищевода.</text>
    <text x="1048" y="512" font-size="23" font-weight="700" fill="#102033">Публичный путь</text><text x="1048" y="546" font-size="21" fill="#46515f">Избегать табака еще важнее,</text><text x="1048" y="574" font-size="21" fill="#46515f">если присутствует алкоголь.</text>
  </g>
  <rect x="92" y="655" width="625" height="160" rx="18" fill="#102033"/>
  <text x="130" y="704" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Без обвинения</text>
  <text x="130" y="748" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Один напиток, разная биология. Та же экспозиция,</text><text x="130" y="780" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">другой контекст. Риск — не судьба.</text>
  <rect x="775" y="655" width="633" height="200" rx="18" fill="#f4d35e" stroke="#8a6a00" stroke-width="3"/>
  <text x="813" y="704" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102033">Граница безопасности</text>
  <text x="813" y="748" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102033">Покраснение — не диагноз и не генетический тест.</text>
  <text x="813" y="778" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102033">Зависимость, симптомы, печень, лекарства,</text>
  <text x="813" y="808" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102033">беременность или прошлый рак</text>
  <text x="813" y="838" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102033">требуют клинической поддержки.</text>
  <text x="92" y="880" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#46515f">Источники: Rumgay 2021; Bagnardi; ацетальдегид; Andrici покраснение/ESCC; Chang ALDH2; Hashibe INHANCE.</text>
  <text x="92" y="918" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7280">Избегайте стереотипов. ALDH2 меняет риск; это не идентичность и не судьба. Табак важен во всех группах.</text>
</svg>
