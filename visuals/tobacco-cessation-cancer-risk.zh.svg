<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">停止烟草暴露后癌症风险会下降</title>
  <desc id="desc">公共信息图，解释烟草烟雾、DNA 损伤、戒烟、残余风险、筛查和无责备支持。</desc>
  <rect width="1500" height="980" fill="#f7faf8"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#27312d" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">停止烟草暴露后，癌症风险会下降</text>
  <text x="94" y="158" font-family="Arial" font-size="24" fill="#334155">任何年龄戒烟都有帮助，越早越好。支持比责备更有效。</text>
  <rect x="92" y="220" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="286" r="40" fill="#1f6f6b"/><text x="143" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">烟雾伤害细胞</text><text x="122" y="398" font-family="Arial" font-size="22" fill="#334155">烟草烟雾含有致癌物，</text><text x="122" y="426" font-family="Arial" font-size="22" fill="#334155">可损伤 DNA 和组织</text><text x="122" y="454" font-family="Arial" font-size="22" fill="#334155">防御系统。</text><text x="122" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="122" y="550" font-family="Arial" font-size="21" fill="#334155">避免烟雾暴露，保护</text><text x="122" y="578" font-family="Arial" font-size="21" fill="#334155">无烟空间。</text>
  <rect x="555" y="220" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="286" r="40" fill="#b46b13"/><text x="606" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">戒烟会改变路径</text><text x="585" y="398" font-family="Arial" font-size="22" fill="#334155">停止吸烟会减少新的暴露。</text><text x="585" y="426" font-family="Arial" font-size="22" fill="#334155">风险通常会随时间下降，</text><text x="585" y="454" font-family="Arial" font-size="22" fill="#334155">越早戒烟收益越大。</text><text x="585" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="585" y="550" font-family="Arial" font-size="21" fill="#334155">每次尝试都重要；</text><text x="585" y="578" font-family="Arial" font-size="21" fill="#334155">药物和支持能帮忙。</text>
  <rect x="1018" y="220" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="286" r="40" fill="#b93636"/><text x="1069" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">过去风险可残留</text><text x="1048" y="398" font-family="Arial" font-size="22" fill="#334155">戒烟者的肺癌风险</text><text x="1048" y="426" font-family="Arial" font-size="22" fill="#334155">仍可能多年高于</text><text x="1048" y="454" font-family="Arial" font-size="22" fill="#334155">从不吸烟者。</text><text x="1048" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="1048" y="550" font-family="Arial" font-size="21" fill="#334155">高风险筛查讨论和</text><text x="1048" y="578" font-family="Arial" font-size="21" fill="#334155">持续症状仍然重要。</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">不责备</text><text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">尼古丁依赖有生物、商业、社会和环境因素。</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">支持比羞辱更有用。</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">安全边界</text><text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">戒烟不会清除所有过去风险。</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">高风险筛查、症状、怀孕、癌症治疗</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">和用药需要临床支持。</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">证据锚点：IARC 烟草烟雾；Hecht 致癌物；Jha/Pirie 队列；Park 韩国队列；戒烟后风险综述。</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">同时减少二手烟、氡、职业暴露和酒精共暴露。有症状不要延误就医。</text>
</svg>
