<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">饮食模式影响结直肠癌风险</title>
  <desc id="desc">面向公众的信息图，说明高纤维食物、减少加工肉、结直肠筛查、系统性可及性和需要就医的症状边界。</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="48" font-weight="800" fill="#102033">饮食模式影响结直肠癌风险</text>
  <text x="94" y="154" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#334155">目标是更健康的肠道环境，不是神奇食物或完美饮食。</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial, 'Microsoft YaHei'" font-size="30" font-weight="800" fill="#102033">高纤维模式</text>
  <text x="122" y="396" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">全谷物、豆类、蔬菜、</text><text x="122" y="424" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">水果和其他含纤维</text><text x="122" y="452" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">食物有帮助。</text>
  <text x="122" y="512" font-family="Arial, 'Microsoft YaHei'" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="122" y="548" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">让高纤维食物</text><text x="122" y="576" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">更容易每天选择。</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial, 'Microsoft YaHei'" font-size="30" font-weight="800" fill="#102033">少吃加工肉</text>
  <text x="585" y="396" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">加工肉与更高的</text><text x="585" y="424" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">结直肠癌风险</text><text x="585" y="452" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">有关联。</text>
  <text x="585" y="512" font-family="Arial, 'Microsoft YaHei'" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="585" y="548" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">改变日常餐食，</text><text x="585" y="576" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">不要责备个人。</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial, 'Microsoft YaHei'" font-size="30" font-weight="800" fill="#102033">筛查仍然重要</text>
  <text x="1048" y="396" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">饮食改变风险概率；</text><text x="1048" y="424" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">筛查可发现早期癌</text><text x="1048" y="452" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">或癌前息肉。</text>
  <text x="1048" y="512" font-family="Arial, 'Microsoft YaHei'" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="1048" y="548" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">按建议两者都做；</text><text x="1048" y="576" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">异常结果要随访。</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial, 'Microsoft YaHei'" font-size="31" font-weight="800" fill="#ffffff">系统也重要</text>
  <text x="130" y="748" font-family="Arial, 'Microsoft YaHei'" font-size="23" fill="#f8fafc">价格、时间、文化、工作、学校餐、商店、</text>
  <text x="130" y="778" font-family="Arial, 'Microsoft YaHei'" font-size="23" fill="#f8fafc">厨房和营销都会影响食物选择。</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial, 'Microsoft YaHei'" font-size="31" font-weight="800" fill="#102033">安全边界</text>
  <text x="814" y="748" font-family="Arial, 'Microsoft YaHei'" font-size="23" fill="#111827">饮食不是诊断、筛查或治疗。</text>
  <text x="814" y="778" font-family="Arial, 'Microsoft YaHei'" font-size="23" fill="#111827">便血、持续排便改变、贫血、</text>
  <text x="814" y="808" font-family="Arial, 'Microsoft YaHei'" font-size="23" fill="#111827">或体重下降需要医疗评估。</text>
  <text x="92" y="890" font-family="Arial, 'Microsoft YaHei'" font-size="19" fill="#334155">证据锚点：BMJ纤维/全谷物荟萃分析；PLOS红肉/加工肉剂量反应分析；IARC/Lancet评估。</text>
  <text x="92" y="920" font-family="Arial, 'Microsoft YaHei'" font-size="16" fill="#64748b">初版翻译：最终医学使用前需要母语审阅。</text>
</svg>
