<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">How LNP delivery helps mRNA teach immunity</title>
  <desc id="desc">Public explainer showing that lipid nanoparticles protect mRNA, help cells take it up, allow translation, support antigen presentation, and require clinical safety monitoring.</desc>
  <rect width="1500" height="980" fill="#f7faf9"/>
  <rect x="48" y="44" width="1404" height="892" rx="24" fill="#ffffff" stroke="#263541" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102033">LNP delivery is part of the therapy</text>
  <text x="94" y="154" font-family="Arial" font-size="24" fill="#25364a">mRNA needs a protected ride, cellular uptake, escape into the cell, antigen display, and clinical monitoring.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="88" y="220" width="245" height="210" rx="18" fill="#e6f2ee" stroke="#147d64" stroke-width="3"/>
  <circle cx="160" cy="290" r="42" fill="#147d64"/>
  <text x="145" y="305" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="125" y="360" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Protect</text>
  <text x="125" y="393" font-family="Arial" font-size="20" fill="#25364a">LNPs shield fragile</text>
  <text x="125" y="420" font-family="Arial" font-size="20" fill="#25364a">mRNA during delivery.</text>

  <rect x="385" y="220" width="245" height="210" rx="18" fill="#eef4ff" stroke="#4961c8" stroke-width="3"/>
  <circle cx="457" cy="290" r="42" fill="#4961c8"/>
  <text x="442" y="305" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="422" y="360" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Enter cells</text>
  <text x="422" y="393" font-family="Arial" font-size="20" fill="#25364a">Cells take up the</text>
  <text x="422" y="420" font-family="Arial" font-size="20" fill="#25364a">mRNA package.</text>

  <rect x="682" y="220" width="245" height="210" rx="18" fill="#fff0d7" stroke="#c26a0a" stroke-width="3"/>
  <circle cx="754" cy="290" r="42" fill="#c26a0a"/>
  <text x="739" y="305" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="719" y="360" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Escape</text>
  <text x="719" y="393" font-family="Arial" font-size="20" fill="#25364a">mRNA must reach</text>
  <text x="719" y="420" font-family="Arial" font-size="20" fill="#25364a">the translation space.</text>

  <rect x="979" y="220" width="245" height="210" rx="18" fill="#f4e9ff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="1051" cy="290" r="42" fill="#7c3aed"/>
  <text x="1036" y="305" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">4</text>
  <text x="1016" y="360" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Display</text>
  <text x="1016" y="393" font-family="Arial" font-size="20" fill="#25364a">Cells show target</text>
  <text x="1016" y="420" font-family="Arial" font-size="20" fill="#25364a">fragments on HLA.</text>

  <line x1="340" y1="325" x2="374" y2="325" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="637" y1="325" x2="671" y2="325" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="934" y1="325" x2="968" y2="325" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="88" y="500" width="392" height="250" rx="18" fill="#f8fafc" stroke="#9aa8b2" stroke-width="2"/>
  <text x="122" y="546" font-family="Arial" font-size="30" font-weight="800" fill="#102033">What can go wrong?</text>
  <text x="122" y="590" font-family="Arial" font-size="21" fill="#25364a">Wrong tissue distribution</text>
  <text x="122" y="624" font-family="Arial" font-size="21" fill="#25364a">Low uptake or poor escape</text>
  <text x="122" y="658" font-family="Arial" font-size="21" fill="#25364a">Too little or too much innate signal</text>
  <text x="122" y="692" font-family="Arial" font-size="21" fill="#25364a">Side effects or repeat-dose limits</text>

  <rect x="554" y="500" width="392" height="250" rx="18" fill="#e6f2ee" stroke="#147d64" stroke-width="2"/>
  <text x="588" y="546" font-family="Arial" font-size="30" font-weight="800" fill="#102033">What success means</text>
  <text x="588" y="590" font-family="Arial" font-size="21" fill="#25364a">Antigen-presenting cells engage</text>
  <text x="588" y="624" font-family="Arial" font-size="21" fill="#25364a">CD8 and CD4 T cells can expand</text>
  <text x="588" y="658" font-family="Arial" font-size="21" fill="#25364a">T cells may recognize matching tumor</text>
  <text x="588" y="692" font-family="Arial" font-size="21" fill="#25364a">Clinical endpoints still decide value</text>

  <rect x="1020" y="500" width="392" height="250" rx="18" fill="#fff7c2" stroke="#9a7a04" stroke-width="2"/>
  <text x="1054" y="546" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="1054" y="590" font-family="Arial" font-size="21" fill="#25364a">This is not formulation guidance.</text>
  <text x="1054" y="624" font-family="Arial" font-size="21" fill="#25364a">No ratios, recipes, dosing, or</text>
  <text x="1054" y="658" font-family="Arial" font-size="21" fill="#25364a">self-treatment instructions belong</text>
  <text x="1054" y="692" font-family="Arial" font-size="21" fill="#25364a">in this wiki.</text>

  <rect x="310" y="800" width="880" height="62" rx="31" fill="#102033"/>
  <text x="430" y="840" font-family="Arial" font-size="27" font-weight="800" fill="#ffffff">Delivery helps mRNA teach immunity.</text>
  <text x="92" y="912" font-family="Arial" font-size="18" fill="#334155">Evidence anchors: LNP cancer vaccine reviews; dendritic-cell targeting literature; antigen presentation and innate-sensing source cards.</text>
</svg>
