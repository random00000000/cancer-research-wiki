<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Movement, food pattern, and metabolic health shape cancer risk</title>
  <desc id="desc">A public infographic explaining movement, diet pattern, body fatness, metabolic signaling, systems access, and cancer risk reduction without body shame.</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#26312b" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#102033">Movement, food pattern, and metabolism matter</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Risk reduction is about biology plus systems, not body shame or miracle diets.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Move where possible</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Activity can improve insulin,</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">inflammation, immune tone,</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">and energy balance.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">More movement, less sitting,</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">adapted to ability and safety.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Food pattern beats fads</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Whole grains, fiber foods,</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">vegetables, fruits, and beans</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">are stronger than miracle claims.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Favor fiber-rich patterns;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">limit processed meat.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Metabolic signals</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Body fatness can affect</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">hormones, insulin/IGF,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">inflammation, and adipokines.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Support metabolic health</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">without blame or guarantees.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Systems matter</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Food access, safe streets, time, disability, stress,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">sleep, work, income, and medicines shape options.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">No diet, exercise plan, or body size guarantees safety.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Symptoms, eating disorders, diabetes, pregnancy,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">disability, or cancer care need clinician support.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: WCRF/AICR; Moore 2016; Matthews 2020; fiber/whole-grain meta-analysis; obesity-cancer mechanism reviews.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Best public wording: make the healthy path easier; risk reduction is not personal blame.</text>
</svg>
