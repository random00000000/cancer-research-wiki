<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">мРНК-терапия рака требует клинической инфраструктуры</title>
  <desc id="desc">Образовательная схема: персонализированная мРНК-терапия рака требует образца опухоли, секвенирования, выбора антигенов, регулируемого производства, контроля качества, клинического введения, наблюдения и оценки доказательств.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="70" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Персонализированная мРНК-терапия — клиническая цепочка</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="21" fill="#334155">Цель — понимать испытания и задавать вопросы, а не самостоятельно создавать лечение.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="165" width="160" height="108" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="94" y="205" font-size="18" font-weight="700" fill="#1e3a8a">Образец</text><text x="94" y="236" font-size="15" fill="#1e40af">Достаточно ткани</text>
    <rect x="270" y="165" width="160" height="108" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="293" y="205" font-size="18" font-weight="700" fill="#155e75">Секвенирование</text><text x="293" y="236" font-size="15" fill="#0e7490">Опухоль и норма</text>
    <rect x="470" y="165" width="160" height="108" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="493" y="205" font-size="18" font-weight="700" fill="#92400e">Выбор целей</text><text x="493" y="236" font-size="15" fill="#a16207">HLA и экспрессия</text>
    <rect x="670" y="165" width="160" height="108" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="694" y="205" font-size="18" font-weight="700" fill="#9d174d">мРНК-продукт</text><text x="694" y="236" font-size="15" fill="#be185d">В рамках протокола</text>
    <rect x="870" y="165" width="160" height="108" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="894" y="205" font-size="18" font-weight="700" fill="#166534">Контроль</text><text x="894" y="236" font-size="15" fill="#15803d">Идентичность и стерильность</text>
    <path d="M232 219 H266M432 219 H466M632 219 H666M832 219 H866" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="170" y="360" width="230" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="196" y="400" font-size="20" font-weight="700" fill="#0f172a">Клиническое введение</text><text x="196" y="432" font-size="16" fill="#334155">Команда онкологов</text><text x="196" y="458" font-size="16" fill="#334155">Сроки протокола</text><text x="196" y="484" font-size="16" fill="#334155">Комбинации</text>
    <rect x="485" y="360" width="230" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="511" y="400" font-size="20" font-weight="700" fill="#0f172a">Наблюдение</text><text x="511" y="432" font-size="16" fill="#334155">Нежелательные явления</text><text x="511" y="458" font-size="16" fill="#334155">Иммунные тесты</text><text x="511" y="484" font-size="16" fill="#334155">Снимки и рецидив</text>
    <rect x="800" y="360" width="230" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="826" y="400" font-size="20" font-weight="700" fill="#0f172a">Доказательства</text><text x="826" y="432" font-size="16" fill="#334155">Конечные точки</text><text x="826" y="458" font-size="16" fill="#334155">Польза и риск</text><text x="826" y="484" font-size="16" fill="#334155">Надзор регуляторов</text>
    <path d="M950 275 C950 315 915 330 915 356M800 435 H720M485 435 H405" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="70" y="590" width="1060" height="92" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="100" y="630" font-size="22" font-weight="700" fill="#9a3412">Граница безопасности</text><text x="100" y="660" font-size="18" fill="#7c2d12">Это не инструкция по дозам, производству, покупке или самостоятельному введению.</text>
  </g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
</svg>
