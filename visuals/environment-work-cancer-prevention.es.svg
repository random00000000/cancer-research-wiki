<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">La prevención del cáncer también es protección ambiental</title>
  <desc id="desc">Infografía pública sobre radón, asbesto, contaminación del aire y carcinógenos laborales como objetivos de prevención que requieren pruebas, controles, políticas y remediación.</desc>
  <rect width="1500" height="980" fill="#f7f4ee"/>
  <rect x="50" y="44" width="1400" height="892" rx="24" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#102033">Prevenir cáncer también es aire limpio y trabajo seguro</text>
  <text x="94" y="158" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#46515f">Algunos riesgos vienen de edificios, trabajos, aire, materiales y políticas, no solo de hábitos personales.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="220" width="305" height="340" rx="18" fill="#e8f1f2" stroke="#1b5d66" stroke-width="3"/>
    <circle cx="152" cy="285" r="40" fill="#1b5d66"/><text x="152" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="122" y="358" font-size="28" font-weight="700" fill="#102033">Radón</text>
    <text x="122" y="400" font-size="20" fill="#46515f">Gas invisible en algunas</text><text x="122" y="428" font-size="20" fill="#46515f">casas y edificios.</text>
    <text x="122" y="486" font-size="23" font-weight="700" fill="#102033">Palanca</text>
    <text x="122" y="520" font-size="20" fill="#46515f">Medir, mitigar, ventilar</text><text x="122" y="548" font-size="20" fill="#46515f">y construir mejor.</text>
    <rect x="432" y="220" width="305" height="340" rx="18" fill="#fff1d9" stroke="#a26119" stroke-width="3"/>
    <circle cx="492" cy="285" r="40" fill="#a26119"/><text x="492" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="462" y="358" font-size="28" font-weight="700" fill="#102033">Asbesto</text>
    <text x="462" y="400" font-size="20" fill="#46515f">Las fibras pueden pasar</text><text x="462" y="428" font-size="20" fill="#46515f">del trabajo al hogar.</text>
    <text x="462" y="486" font-size="23" font-weight="700" fill="#102033">Palanca</text>
    <text x="462" y="520" font-size="20" fill="#46515f">No remover sin expertos;</text><text x="462" y="548" font-size="20" fill="#46515f">evaluación y retiro seguros.</text>
    <rect x="772" y="220" width="305" height="340" rx="18" fill="#e9ecff" stroke="#3e4d9a" stroke-width="3"/>
    <circle cx="832" cy="285" r="40" fill="#3e4d9a"/><text x="832" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="802" y="358" font-size="28" font-weight="700" fill="#102033">Aire PM2.5</text>
    <text x="802" y="400" font-size="20" fill="#46515f">Partículas finas elevan</text><text x="802" y="428" font-size="20" fill="#46515f">riesgo de cáncer pulmonar.</text>
    <text x="802" y="486" font-size="23" font-weight="700" fill="#102033">Palanca</text>
    <text x="802" y="520" font-size="20" fill="#46515f">Transporte, energía, industria</text><text x="802" y="548" font-size="20" fill="#46515f">y aire interior más limpios.</text>
    <rect x="1112" y="220" width="305" height="340" rx="18" fill="#fde8e6" stroke="#ad3434" stroke-width="3"/>
    <circle cx="1172" cy="285" r="40" fill="#ad3434"/><text x="1172" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="1142" y="358" font-size="28" font-weight="700" fill="#102033">Trabajo</text>
    <text x="1142" y="400" font-size="20" fill="#46515f">Polvos, humos, diésel,</text><text x="1142" y="428" font-size="20" fill="#46515f">sílice, metales, solventes.</text>
    <text x="1142" y="486" font-size="23" font-weight="700" fill="#102033">Palanca</text>
    <text x="1142" y="520" font-size="20" fill="#46515f">Sustituir, encerrar, ventilar,</text><text x="1142" y="548" font-size="20" fill="#46515f">medir y proteger.</text>
  </g>
  <rect x="92" y="625" width="625" height="172" rx="18" fill="#102033"/>
  <text x="130" y="674" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Mensaje público</text>
  <text x="130" y="718" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Prevenir incluye edificios seguros, aire limpio,</text>
  <text x="130" y="750" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">protección laboral, remediación y política justa.</text>
  <text x="130" y="782" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">No convierta exposiciones estructurales en culpa.</text>
  <rect x="775" y="625" width="633" height="172" rx="18" fill="#f4d35e" stroke="#8a6a00" stroke-width="3"/>
  <text x="813" y="674" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102033">Límite de seguridad</text>
  <text x="813" y="718" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Asbesto, radón alto y exposiciones laborales</text>
  <text x="813" y="750" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">necesitan evaluación calificada. Síntomas o pruebas</text>
  <text x="813" y="782" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">pertenecen a clínicos o expertos en exposición.</text>
  <text x="92" y="858" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46515f">Fuentes: metaanálisis de radón residencial; análisis europeo de radón; revisión de asbesto;</text>
  <text x="92" y="886" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46515f">metaanálisis de asbesto no laboral y mesotelioma; metaanálisis PM2.5 y cáncer pulmonar.</text>
  <text x="92" y="918" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b7280">Reducir riesgo no es garantizar. Dosis, duración, tabaco, vivienda, ocupación, lugar y políticas cambian exposición y riesgo.</text>
</svg>
