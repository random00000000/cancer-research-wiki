<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Food pattern matters for colorectal cancer</title>
  <desc id="desc">A public infographic explaining fiber-rich foods, processed meat limitation, colorectal screening, systems access, and symptom safety boundaries.</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102033">Food pattern matters for colorectal cancer</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Aim for a healthier colon environment, not a miracle food or perfect diet.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Fiber-rich pattern</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Whole grains, beans,</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">vegetables, fruits, and</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">other fiber foods help.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Make fiber-rich foods</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">easier to choose daily.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Limit processed meat</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Processed meats are</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">linked with higher</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">colorectal cancer risk.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Shift routine meals;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">do not shame people.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Screening still matters</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Food pattern shifts risk;</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">screening can find early</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">cancer or polyps.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Do both when advised;</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">follow up abnormal tests.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Systems matter</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Cost, time, culture, work, school meals, stores,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">kitchens, and marketing shape food choices.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Diet is not diagnosis, screening, or treatment.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Blood in stool, persistent bowel changes, anemia,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">or weight loss need medical evaluation.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: BMJ fiber/whole-grain meta-analysis; PLOS red/processed meat dose-response meta-analysis; IARC/Lancet evaluation.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Best public wording: food pattern can lower risk probability; it cannot guarantee protection or replace screening.</text>
</svg>
