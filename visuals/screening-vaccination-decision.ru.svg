<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Решения о скрининге и вакцинации против рака</title>
  <desc id="desc">Инфографика на русском о симптомах, риске, пользе, вреде, наблюдении, скрининге и вакцинации.</desc>
  <rect width="1200" height="850" fill="#f8fbff"/>
  <rect x="48" y="42" width="1104" height="766" rx="24" fill="#ffffff" stroke="#d8e2ef" stroke-width="3"/>
  <text x="84" y="104" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#102033">Скрининг и вакцины помогают предотвращать рак</text>
  <text x="86" y="142" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">Главный вопрос: какой инструмент подходит человеку, риску и доступному наблюдению?</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="84" y="190" width="310" height="190" rx="18" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="112" y="240" font-size="26" font-weight="800" fill="#102033">Есть симптомы?</text>
    <text x="112" y="288" font-size="20" fill="#334155">Новые или стойкие симптомы</text>
    <text x="112" y="316" font-size="20" fill="#334155">это не скрининг.</text>
    <text x="112" y="354" font-size="21" font-weight="800" fill="#102033">Нужна оценка врача.</text>
    <rect x="445" y="190" width="310" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="473" y="240" font-size="26" font-weight="800" fill="#102033">Нет симптомов?</text>
    <text x="473" y="288" font-size="20" fill="#334155">Учитывают возраст, органы,</text>
    <text x="473" y="316" font-size="20" fill="#334155">историю, семью, инфекции,</text>
    <text x="473" y="344" font-size="20" fill="#334155">риск и местные правила.</text>
    <rect x="806" y="190" width="310" height="190" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="834" y="240" font-size="26" font-weight="800" fill="#102033">Выбор инструмента</text>
    <text x="834" y="288" font-size="20" fill="#334155">Одни предотвращают рак.</text>
    <text x="834" y="316" font-size="20" fill="#334155">Другие находят его раньше.</text>
    <text x="834" y="354" font-size="21" font-weight="800" fill="#102033">Подбирать по риску.</text>
    <rect x="84" y="440" width="310" height="170" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="112" y="488" font-size="26" font-weight="800" fill="#102033">Вакцины</text>
    <text x="112" y="532" font-size="20" fill="#334155">ВПЧ: предотвращает инфекции,</text>
    <text x="112" y="560" font-size="20" fill="#334155">вызывающие разные раки.</text>
    <text x="112" y="588" font-size="20" fill="#334155">Гепатит B: защита печени.</text>
    <rect x="445" y="440" width="310" height="170" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="473" y="488" font-size="26" font-weight="800" fill="#102033">Скрининг</text>
    <text x="473" y="532" font-size="20" fill="#334155">Может найти рак раньше</text>
    <text x="473" y="560" font-size="20" fill="#334155">или предраковые изменения.</text>
    <rect x="806" y="440" width="310" height="170" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="834" y="488" font-size="26" font-weight="800" fill="#102033">Баланс</text>
    <text x="834" y="532" font-size="20" fill="#334155">Ложные тревоги, вред, цена,</text>
    <text x="834" y="560" font-size="20" fill="#334155">стресс и доступ имеют значение.</text>
    <text x="834" y="588" font-size="20" font-weight="800" fill="#102033">Наблюдение важно.</text>
  </g>
  <rect x="84" y="675" width="1032" height="68" rx="22" fill="#102033"/>
  <text x="118" y="718" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Безопасный вывод: спросите, какая профилактика подходит возрасту, телу, истории, риску и наблюдению.</text>
  <text x="84" y="790" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">Образование, не личный медсовет. Основа: скрининг, вред скрининга, инфекции и вакцины ВПЧ/ВГВ.</text>
</svg>
