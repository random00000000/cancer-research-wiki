<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Tabakbedingtes Krebsrisiko sinkt, wenn Exposition stoppt</title>
  <desc id="desc">Offentliche Infografik zu Tabakrauch, DNA-Schaden, Rauchstopp, verbleibendem Risiko, Screening und Unterstutzung ohne Schuldzuweisung.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#27312d" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#102033">Tabakrisiko sinkt, wenn die Exposition stoppt</text>
  <text x="94" y="158" font-family="Arial" font-size="24" fill="#334155">Aufhoren hilft in jedem Alter. Fruher ist besser. Unterstutzung wirkt besser als Scham.</text>
  <rect x="92" y="220" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="286" r="40" fill="#1f6f6b"/><text x="143" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Rauch verletzt Zellen</text><text x="122" y="398" font-family="Arial" font-size="22" fill="#334155">Tabakrauch enthalt Karzinogene,</text><text x="122" y="426" font-family="Arial" font-size="22" fill="#334155">die DNA und Gewebeschutz</text><text x="122" y="454" font-family="Arial" font-size="22" fill="#334155">schadigen konnen.</text><text x="122" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text><text x="122" y="550" font-family="Arial" font-size="21" fill="#334155">Rauch meiden und rauchfreie</text><text x="122" y="578" font-family="Arial" font-size="21" fill="#334155">Raume schutzen.</text>
  <rect x="555" y="220" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="286" r="40" fill="#b46b13"/><text x="606" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Aufhoren hilft</text><text x="585" y="398" font-family="Arial" font-size="22" fill="#334155">Stoppen senkt neue Exposition.</text><text x="585" y="426" font-family="Arial" font-size="22" fill="#334155">Das Risiko sinkt meist mit Zeit,</text><text x="585" y="454" font-family="Arial" font-size="22" fill="#334155">besonders bei fruhem Stopp.</text><text x="585" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text><text x="585" y="550" font-family="Arial" font-size="21" fill="#334155">Jeder Versuch zahlt;</text><text x="585" y="578" font-family="Arial" font-size="21" fill="#334155">Medikamente und Hilfe nutzen.</text>
  <rect x="1018" y="220" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="286" r="40" fill="#b93636"/><text x="1069" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Restrisiko bleibt moglich</text><text x="1048" y="398" font-family="Arial" font-size="22" fill="#334155">Ehemalige Raucher konnen</text><text x="1048" y="426" font-family="Arial" font-size="22" fill="#334155">jahrelang erhohtes Lungenkrebs-</text><text x="1048" y="454" font-family="Arial" font-size="22" fill="#334155">risiko behalten.</text><text x="1048" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text><text x="1048" y="550" font-family="Arial" font-size="21" fill="#334155">Screening-Gesprach und</text><text x="1048" y="578" font-family="Arial" font-size="21" fill="#334155">anhaltende Symptome zahlen.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Keine Schuld</text><text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Nikotinabhangigkeit ist biologisch, kommerziell,</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">sozial und umweltbedingt. Hilfe schlagt Scham.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Sicherheitsgrenze</text><text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Aufhoren loscht nicht jedes fruhere Risiko.</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Screening, Symptome, Schwangerschaft,</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">Krebsversorgung und Medikamente brauchen Hilfe.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidenz: IARC Tabakrauch; Hecht Karzinogene; Jha/Pirie Kohorten; Park Korea; Reviews zum Risiko nach Stopp.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Auch Passivrauch, Radon, Arbeitsstoffe und Alkohol-Koexposition reduzieren. Symptome nicht abwarten.</text>
</svg>
