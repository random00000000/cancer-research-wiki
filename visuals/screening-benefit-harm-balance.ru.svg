<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Скрининг рака требует баланса</title>
  <desc id="desc">Публичная инфографика о пользе и вреде скрининга рака: ложные тревоги, пропущенный рак, гипердиагностика, процедуры и необходимость наблюдения.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">Скрининг рака требует баланса</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Правильный тест может спасать жизни, но больше тестов не всегда лучше.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Возможная польза</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Некоторый скрининг</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">снижает смертность или</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">находит предрак.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Спросите</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Какой рак, какой тест,</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">какой возраст и риск?</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Возможный вред</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Ложная тревога, пропуск,</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">гипердиагностика,</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">процедуры, цена, стресс.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Спросите</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Что будет после</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">аномального результата?</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Симптомы отдельно</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Скрининг для людей</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">без симптомов.</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">Симптомы требуют помощи.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Спросите</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Это профилактика, раннее</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">выявление или диагноз?</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Нужны абсолютные числа</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Относительный процент может звучать огромно.</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">Спросите: сколько пользы или вреда на 1 000?</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Новые, стойкие или тревожные симптомы</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">не являются скринингом. Нужны медицинская</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">оценка и наблюдение.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Опоры: рандомизированные исследования, метаанализы скрининга, обзоры гипердиагностики, анализы пользы и вреда.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Скрининг зависит от вида рака, возраста, анатомии, риска, прошлых результатов, местных правил и доступа к наблюдению.</text>
</svg>
