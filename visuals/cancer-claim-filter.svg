<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cancer claim filter</title>
  <desc id="desc">A public safety infographic showing five checks before trusting a cancer prevention or treatment claim.</desc>
  <rect width="1200" height="760" fill="#f7f4ee"/>
  <rect x="48" y="42" width="1104" height="676" rx="22" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="88" y="112" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#18212f">Before You Trust a Cancer Claim</text>
  <text x="90" y="155" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#46515f">A five-gate filter for prevention advice, miracle cures, and social-media protocols.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="205" width="196" height="245" rx="14" fill="#e8f1f2" stroke="#1b5d66" stroke-width="2"/>
    <circle cx="188" cy="272" r="46" fill="#1b5d66"/>
    <text x="188" y="288" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="118" y="346" font-size="25" font-weight="700" fill="#18212f">Human</text>
    <text x="118" y="378" font-size="25" font-weight="700" fill="#18212f">outcomes?</text>
    <text x="118" y="417" font-size="18" fill="#46515f">Not just cells,</text>
    <text x="118" y="440" font-size="18" fill="#46515f">mice, or hype.</text>
    <rect x="303" y="205" width="196" height="245" rx="14" fill="#fff1d9" stroke="#a26119" stroke-width="2"/>
    <circle cx="401" cy="272" r="46" fill="#a26119"/>
    <text x="401" y="288" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="331" y="346" font-size="25" font-weight="700" fill="#18212f">Absolute</text>
    <text x="331" y="378" font-size="25" font-weight="700" fill="#18212f">impact?</text>
    <text x="331" y="417" font-size="18" fill="#46515f">How many helped</text>
    <text x="331" y="440" font-size="18" fill="#46515f">or harmed?</text>
    <rect x="516" y="205" width="196" height="245" rx="14" fill="#e9ecff" stroke="#3e4d9a" stroke-width="2"/>
    <circle cx="614" cy="272" r="46" fill="#3e4d9a"/>
    <text x="614" y="288" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="544" y="346" font-size="25" font-weight="700" fill="#18212f">Replicated?</text>
    <text x="544" y="386" font-size="18" fill="#46515f">More than one</text>
    <text x="544" y="409" font-size="18" fill="#46515f">group, trial, or</text>
    <text x="544" y="432" font-size="18" fill="#46515f">population?</text>
    <rect x="729" y="205" width="196" height="245" rx="14" fill="#fde8e6" stroke="#ad3434" stroke-width="2"/>
    <circle cx="827" cy="272" r="46" fill="#ad3434"/>
    <text x="827" y="288" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="757" y="346" font-size="25" font-weight="700" fill="#18212f">Harms?</text>
    <text x="757" y="386" font-size="18" fill="#46515f">Toxicity, drug</text>
    <text x="757" y="409" font-size="18" fill="#46515f">interactions,</text>
    <text x="757" y="432" font-size="18" fill="#46515f">malnutrition?</text>
    <rect x="942" y="205" width="168" height="245" rx="14" fill="#e8f4df" stroke="#50742d" stroke-width="2"/>
    <circle cx="1026" cy="272" r="46" fill="#50742d"/>
    <text x="1026" y="288" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="974" y="346" font-size="25" font-weight="700" fill="#18212f">Care</text>
    <text x="974" y="378" font-size="25" font-weight="700" fill="#18212f">delay?</text>
    <text x="974" y="417" font-size="18" fill="#46515f">Does it replace</text>
    <text x="974" y="440" font-size="18" fill="#46515f">proven care?</text>
  </g>
  <rect x="90" y="500" width="485" height="112" rx="16" fill="#18212f"/>
  <text x="124" y="545" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">If it fails the filter</text>
  <text x="124" y="584" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#d9e4ef">Call it preliminary, misleading, or dangerous.</text>
  <rect x="625" y="500" width="485" height="112" rx="16" fill="#f4d35e" stroke="#8a6a00" stroke-width="2"/>
  <text x="659" y="545" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#18212f">If it touches treatment</text>
  <text x="659" y="584" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#18212f">Bring an oncology team into the decision.</text>
  <text x="90" y="665" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46515f">Good cancer research asks hard questions. Good public guidance waits for human evidence and protects people from delay, toxicity, and false certainty.</text>
</svg>
