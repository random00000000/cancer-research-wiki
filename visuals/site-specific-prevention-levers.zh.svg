<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title desc">
  <title id="title">不同癌症部位最重要的预防杠杆</title>
  <desc id="desc">面向公众的癌症预防图，将主要癌症部位与高信号的预防、疫苗、筛查和减少暴露措施相连。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="0.45" stop-color="#fff7ed"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#111827" flood-opacity="0.13"/></filter>
    <style>
      .title { font: 800 50px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #102033; letter-spacing: 0; }
      .subtitle { font: 400 24px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; letter-spacing: 0; }
      .site { font: 800 26px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #102033; letter-spacing: 0; }
      .lever { font: 700 19px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #102033; letter-spacing: 0; }
      .body { font: 400 18px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; letter-spacing: 0; }
      .small { font: 400 16px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; letter-spacing: 0; }
      .source { font: 700 15px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; letter-spacing: 0; }
      .lightSite { font: 800 27px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .lightBody { font: 400 18px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #e2e8f0; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #d8e2ef; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .pill { stroke-width: 2; rx: 18; }
    </style>
  </defs>
  <rect width="1500" height="1100" fill="url(#bg)"/>
  <g transform="translate(70 56)"><text class="title" x="0" y="58">哪些预防杠杆最重要？</text><text class="subtitle" x="2" y="100">不同癌症有不同弱点。请把它当作提问地图，不是个人医疗建议。</text><rect x="0" y="136" width="1360" height="4" fill="#cbd5e1"/></g>
  <g transform="translate(70 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#2563eb"/><text class="site" x="76" y="58">结肠 / 直肠</text><rect class="pill" x="30" y="88" width="120" height="34" fill="#dbeafe" stroke="#2563eb"/><text class="lever" x="68" y="111">筛查</text><rect class="pill" x="165" y="88" width="120" height="34" fill="#dcfce7" stroke="#16a34a"/><text class="lever" x="202" y="111">活动</text><text class="body" x="30" y="158">纤维和全谷物有帮助。</text><text class="body" x="30" y="187">少吃加工/红肉，</text><text class="body" x="30" y="214">减少酒精暴露。</text></g>
  <g transform="translate(420 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#7c3aed"/><text class="site" x="76" y="58">宫颈</text><rect class="pill" x="30" y="88" width="132" height="34" fill="#ede9fe" stroke="#7c3aed"/><text class="lever" x="58" y="111">HPV疫苗</text><rect class="pill" x="178" y="88" width="112" height="34" fill="#dbeafe" stroke="#2563eb"/><text class="lever" x="213" y="111">筛查</text><text class="body" x="30" y="158">治疗癌前病变。</text><text class="body" x="30" y="187">可及性和随访</text><text class="body" x="30" y="214">是核心杠杆。</text></g>
  <g transform="translate(770 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#f97316"/><text class="site" x="76" y="58">肝</text><rect class="pill" x="30" y="88" width="120" height="34" fill="#ffedd5" stroke="#f97316"/><text class="lever" x="52" y="111">乙肝疫苗</text><rect class="pill" x="165" y="88" width="124" height="34" fill="#ecfeff" stroke="#0891b2"/><text class="lever" x="187" y="111">丙肝治疗</text><text class="body" x="30" y="158">减少酒精性肝损伤。</text><text class="body" x="30" y="187">代谢健康和黄曲霉毒素</text><text class="body" x="30" y="214">因地区而异。</text></g>
  <g transform="translate(1120 205)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#ef4444"/><text class="site" x="76" y="58">肺</text><rect class="pill" x="30" y="88" width="122" height="34" fill="#fee2e2" stroke="#ef4444"/><text class="lever" x="56" y="111">无烟</text><rect class="pill" x="167" y="88" width="124" height="34" fill="#e0f2fe" stroke="#0284c7"/><text class="lever" x="202" y="111">氡</text><text class="body" x="30" y="158">工作和空气暴露也重要。</text><text class="body" x="30" y="187">高风险筛查只适合</text><text class="body" x="30" y="214">指南条件下的人群。</text></g>
  <g transform="translate(70 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#d97706"/><text class="site" x="76" y="58">皮肤</text><rect class="pill" x="30" y="88" width="116" height="34" fill="#fef3c7" stroke="#d97706"/><text class="lever" x="64" y="111">紫外线</text><rect class="pill" x="162" y="88" width="126" height="34" fill="#fee2e2" stroke="#ef4444"/><text class="lever" x="185" y="111">不晒灯</text><text class="body" x="30" y="158">阴凉、衣物、防晒霜</text><text class="body" x="30" y="187">和职业防护要结合。</text><text class="body" x="30" y="214">检查变化的皮损。</text></g>
  <g transform="translate(420 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#db2777"/><text class="site" x="76" y="58">乳腺</text><rect class="pill" x="30" y="88" width="120" height="34" fill="#fce7f3" stroke="#db2777"/><text class="lever" x="68" y="111">筛查</text><rect class="pill" x="165" y="88" width="120" height="34" fill="#ffedd5" stroke="#f97316"/><text class="lever" x="202" y="111">酒精</text><text class="body" x="30" y="158">身体活动有帮助。</text><text class="body" x="30" y="187">绝经后健康体重</text><text class="body" x="30" y="214">是重要杠杆。</text></g>
  <g transform="translate(770 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#0f766e"/><text class="site" x="76" y="58">胃</text><rect class="pill" x="30" y="88" width="126" height="34" fill="#ccfbf1" stroke="#0f766e"/><text class="lever" x="52" y="111">幽门螺杆菌</text><rect class="pill" x="171" y="88" width="116" height="34" fill="#fef3c7" stroke="#d97706"/><text class="lever" x="209" y="111">盐</text><text class="body" x="30" y="158">检测和治疗取决于</text><text class="body" x="30" y="187">当地风险和耐药性。</text><text class="body" x="30" y="214">少加工肉；无烟。</text></g>
  <g transform="translate(1120 470)"><rect class="card" x="0" y="0" width="320" height="230"/><circle cx="40" cy="48" r="22" fill="#9333ea"/><text class="site" x="76" y="58">口腔 / 咽喉</text><rect class="pill" x="30" y="88" width="116" height="34" fill="#fee2e2" stroke="#ef4444"/><text class="lever" x="56" y="111">烟草</text><rect class="pill" x="162" y="88" width="126" height="34" fill="#ede9fe" stroke="#7c3aed"/><text class="lever" x="185" y="111">HPV疫苗</text><text class="body" x="30" y="158">少酒可降低风险。</text><text class="body" x="30" y="187">有槟榔/古特卡使用处</text><text class="body" x="30" y="214">应避免这些产品。</text></g>
  <g transform="translate(110 780)"><rect x="0" y="0" width="1280" height="140" rx="26" fill="#102033"/><text class="lightSite" x="38" y="52">看模式</text><text class="lightBody" x="38" y="88">有些杠杆在癌症发生前起作用：疫苗、无烟、紫外线防护、少酒、更安全的工作和空气。</text><text class="lightBody" x="38" y="118">有些杠杆更早发现癌症或癌前病变：筛查、可疑皮损检查和随访系统。</text></g>
  <g transform="translate(110 955)"><rect x="0" y="0" width="1280" height="72" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text class="small" x="26" y="29">降低风险不是零风险。症状、遗传风险、既往结果、癌症史和当地指南需要临床判断。</text><text class="source" x="26" y="55">来源基础：prevention/cancer-site-prevention-map.md；NCI、WHO、WCRF/AICR。</text></g>
</svg>
