<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Alcohol cancer risk depends on biology and co-exposures</title>
  <desc id="desc">A public infographic explaining acetaldehyde, alcohol flushing, ALDH2 biology, and tobacco plus alcohol co-exposure as cancer risk factors without blame or genetic determinism.</desc>
  <rect width="1500" height="980" fill="#f7f4ee"/>
  <rect x="50" y="44" width="1400" height="892" rx="24" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#102033">Alcohol Risk Depends on Dose, Biology, and Tobacco</text>
  <text x="94" y="158" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#46515f">Less alcohol generally means lower cancer risk. No alcohol avoids alcohol-attributable cancer risk.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="220" width="390" height="390" rx="18" fill="#e8f1f2" stroke="#1b5d66" stroke-width="3"/>
    <circle cx="152" cy="285" r="40" fill="#1b5d66"/>
    <text x="152" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="122" y="356" font-size="28" font-weight="700" fill="#102033">Acetaldehyde</text>
    <text x="122" y="398" font-size="21" fill="#46515f">Alcohol becomes acetaldehyde,</text>
    <text x="122" y="426" font-size="21" fill="#46515f">a reactive chemical that can</text>
    <text x="122" y="454" font-size="21" fill="#46515f">damage DNA and repair systems.</text>
    <text x="122" y="512" font-size="23" font-weight="700" fill="#102033">Public direction</text>
    <text x="122" y="546" font-size="21" fill="#46515f">Drink less or not at all.</text>
    <rect x="555" y="220" width="390" height="390" rx="18" fill="#fff1d9" stroke="#a26119" stroke-width="3"/>
    <circle cx="615" cy="285" r="40" fill="#a26119"/>
    <text x="615" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="585" y="356" font-size="28" font-weight="700" fill="#102033">Flushing and ALDH2</text>
    <text x="585" y="398" font-size="21" fill="#46515f">Face flushing after alcohol can</text>
    <text x="585" y="426" font-size="21" fill="#46515f">signal slower acetaldehyde</text>
    <text x="585" y="454" font-size="21" fill="#46515f">clearance in some people.</text>
    <text x="585" y="512" font-size="23" font-weight="700" fill="#102033">Public direction</text>
    <text x="585" y="546" font-size="21" fill="#46515f">Treat flushing as a warning sign,</text>
    <text x="585" y="574" font-size="21" fill="#46515f">not harmless tolerance.</text>
    <rect x="1018" y="220" width="390" height="390" rx="18" fill="#fde8e6" stroke="#ad3434" stroke-width="3"/>
    <circle cx="1078" cy="285" r="40" fill="#ad3434"/>
    <text x="1078" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="1048" y="356" font-size="28" font-weight="700" fill="#102033">Tobacco plus alcohol</text>
    <text x="1048" y="398" font-size="21" fill="#46515f">Together they are especially</text>
    <text x="1048" y="426" font-size="21" fill="#46515f">concerning for mouth, throat,</text>
    <text x="1048" y="454" font-size="21" fill="#46515f">voice box, and esophagus cancers.</text>
    <text x="1048" y="512" font-size="23" font-weight="700" fill="#102033">Public direction</text>
    <text x="1048" y="546" font-size="21" fill="#46515f">Avoiding tobacco matters</text>
    <text x="1048" y="574" font-size="21" fill="#46515f">when alcohol is present.</text>
  </g>
  <rect x="92" y="655" width="625" height="160" rx="18" fill="#102033"/>
  <text x="130" y="704" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">No-blame meaning</text>
  <text x="130" y="748" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Same drink, different biology. Same exposure, different</text>
  <text x="130" y="780" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">context. Risk changes probabilities, not destiny.</text>
  <rect x="775" y="655" width="633" height="200" rx="18" fill="#f4d35e" stroke="#8a6a00" stroke-width="3"/>
  <text x="813" y="704" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102033">Safety boundary</text>
  <text x="813" y="748" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Flushing is not a diagnosis or a genotype test.</text>
  <text x="813" y="780" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Alcohol dependence, symptoms, liver disease,</text>
  <text x="813" y="812" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">medications, pregnancy, or prior cancer</text>
  <text x="813" y="840" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">need clinician support.</text>
  <text x="92" y="880" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#46515f">Evidence anchors: Rumgay 2021; Bagnardi; acetaldehyde reviews; Andrici flushing/ESCC; Chang ALDH2; Hashibe INHANCE.</text>
  <text x="92" y="918" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7280">Avoid stereotyping. ALDH2 modifies risk; it is not identity or destiny. Tobacco avoidance matters across populations.</text>
</svg>
