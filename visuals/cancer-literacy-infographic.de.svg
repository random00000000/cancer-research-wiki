<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Krebs: wie Zellen die Regeln des Körpers brechen</title>
  <desc id="desc">Deutschsprachige Infografik darüber, wie Krebs beginnt und wächst und wie Risiko gesenkt werden kann, ohne Nullrisiko zu versprechen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#f5fff8"/>
    </linearGradient>
    <linearGradient id="cellGood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75d7b3"/>
      <stop offset="1" stop-color="#1f9d8a"/>
    </linearGradient>
    <linearGradient id="cellRisk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbc70"/>
      <stop offset="1" stop-color="#e85d5d"/>
    </linearGradient>
    <linearGradient id="cellTumor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c678dd"/>
      <stop offset="1" stop-color="#6a45b8"/>
    </linearGradient>
    <style>
      .title { font: 800 44px Arial, Helvetica, sans-serif; fill: #102033; }
      .subtitle { font: 400 24px Arial, Helvetica, sans-serif; fill: #31445c; }
      .section { font: 800 29px Arial, Helvetica, sans-serif; fill: #102033; }
      .label { font: 700 21px Arial, Helvetica, sans-serif; fill: #102033; }
      .body { font: 400 20px Arial, Helvetica, sans-serif; fill: #24364b; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .tiny { font: 400 15px Arial, Helvetica, sans-serif; fill: #5b6b7f; }
      .card { fill: #ffffff; stroke: #d8e2ef; stroke-width: 2; rx: 22; }
      .line { stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="1700" fill="url(#bg)"/>

  <g transform="translate(60 55)">
    <text class="title" x="0" y="52">Krebs: Zellen brechen Körperregeln</text>
    <text class="subtitle" x="2" y="92">Was Krebs ist, wie er wächst und wie Risiko ohne falsche Sicherheit sinken kann.</text>
    <rect x="0" y="125" width="1080" height="4" fill="#cbd5e1"/>
  </g>

  <g transform="translate(60 220)">
    <rect class="card" x="0" y="0" width="320" height="370"/>
    <text class="section" x="24" y="48">1. Normale Zelle</text>
    <circle cx="160" cy="145" r="78" fill="url(#cellGood)"/>
    <circle cx="160" cy="145" r="38" fill="#e6fff6"/>
    <path d="M128 146 C142 120, 177 120, 192 146 C176 171, 142 171, 128 146 Z" fill="none" stroke="#126c60" stroke-width="8"/>
    <text class="body" x="24" y="260">Gesundes Gewebe nutzt Kontrollen:</text>
    <text class="small" x="24" y="295">nur bei Signal wachsen, Schäden</text>
    <text class="small" x="24" y="322">reparieren, unsichere Zellen entfernen.</text>
  </g>

  <g transform="translate(440 220)">
    <rect class="card" x="0" y="0" width="320" height="370"/>
    <text class="section" x="24" y="48">2. Änderungen sammeln sich</text>
    <circle cx="160" cy="145" r="78" fill="url(#cellRisk)"/>
    <circle cx="160" cy="145" r="37" fill="#fff6db"/>
    <path d="M125 138 L148 118 L170 168 L197 105" fill="none" stroke="#9a3412" stroke-width="9" stroke-linecap="round"/>
    <text class="body" x="24" y="260">Expositionen, Infektionen, Alter,</text>
    <text class="small" x="24" y="295">ererbtes Risiko und Kopierfehler</text>
    <text class="small" x="24" y="322">können Zellprogramme verändern.</text>
  </g>

  <g transform="translate(820 220)">
    <rect class="card" x="0" y="0" width="320" height="370"/>
    <text class="section" x="24" y="48">3. Krebsverhalten</text>
    <circle cx="136" cy="130" r="62" fill="url(#cellTumor)"/>
    <circle cx="195" cy="168" r="47" fill="#8b5cf6" opacity="0.9"/>
    <circle cx="111" cy="195" r="38" fill="#a855f7" opacity="0.9"/>
    <text class="body" x="24" y="260">Zellen können sich zu stark teilen,</text>
    <text class="small" x="24" y="295">Abwehr umgehen, Gefäße anlocken,</text>
    <text class="small" x="24" y="322">eindringen und sich ausbreiten.</text>
  </g>

  <path class="line" d="M380 405 H440"/>
  <path d="M420 389 L448 405 L420 421 Z" fill="#64748b"/>
  <path class="line" d="M760 405 H820"/>
  <path d="M800 389 L828 405 L800 421 Z" fill="#64748b"/>

  <g transform="translate(60 660)">
    <rect class="card" x="0" y="0" width="1080" height="260"/>
    <text class="section" x="30" y="50">Der Grundablauf</text>
    <text class="body" x="30" y="88">Eine veränderte Zelle überlebt, vermehrt sich, passt sich an und verändert Gewebe.</text>
    <text class="body" x="30" y="126">Die Wurzel ist kein einzelner Auslöser: Gene, Immunität, Stoffwechsel, Umwelt,</text>
    <text class="body" x="30" y="164">Alter, Infektionen und Zugang zu Prävention wirken zusammen.</text>
    <text class="small" x="30" y="213">Deshalb braucht Krebsbekämpfung Prävention, Früherkennung, Biologie und bessere Therapien.</text>
  </g>

  <g transform="translate(60 1000)">
    <text class="section" x="0" y="0">Risiko senken: Wahrscheinlichkeiten, keine Garantie</text>
    <text class="body" x="0" y="36">Diese Schritte sind evidenzgestützt, versprechen aber kein krebsfreies Leben.</text>

    <g transform="translate(0 75)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Kein Tabak</text>
      <text class="small" x="22" y="78">Rauch vermeiden, Rauchstopp unterstützen.</text>
    </g>
    <g transform="translate(278 75)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Weniger Alkohol</text>
      <text class="small" x="22" y="78">Weniger ist sicherer; null vermeidet dieses Risiko.</text>
    </g>
    <g transform="translate(556 75)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Bewegung</text>
      <text class="small" x="22" y="78">Regelmäßige Aktivität senkt mehrere Risiken.</text>
    </g>
    <g transform="translate(834 75)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">UV-Schutz</text>
      <text class="small" x="22" y="78">Sonnenschutz; keine Solarien.</text>
    </g>

    <g transform="translate(0 225)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Impfungen</text>
      <text class="small" x="22" y="78">HPV und Hepatitis B, wenn passend.</text>
    </g>
    <g transform="translate(278 225)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Früherkennung</text>
      <text class="small" x="22" y="78">Nach Alter, Risiko und lokaler Empfehlung.</text>
    </g>
    <g transform="translate(556 225)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Gesundes Muster</text>
      <text class="small" x="22" y="78">Pflanzen, Vollkorn, Energiebalance.</text>
    </g>
    <g transform="translate(834 225)">
      <rect class="card" x="0" y="0" width="245" height="120"/>
      <text class="label" x="22" y="42">Exposition senken</text>
      <text class="small" x="22" y="78">Luft, Arbeit, Radon und Politik zählen.</text>
    </g>
  </g>

  <g transform="translate(60 1445)">
    <rect x="0" y="0" width="1080" height="150" rx="24" fill="#102033"/>
    <text x="32" y="48" style="font: 800 27px Arial, Helvetica, sans-serif; fill: #ffffff;">Wichtig: Prävention ist keine Schuldzuweisung</text>
    <text x="32" y="86" style="font: 400 20px Arial, Helvetica, sans-serif; fill: #e2e8f0;">Manche Krebserkrankungen entstehen trotz sehr guter Entscheidungen. Alter, ererbte Varianten,</text>
    <text x="32" y="116" style="font: 400 20px Arial, Helvetica, sans-serif; fill: #e2e8f0;">Infektionen, Zellfehler, Umwelt, Einkommen, Geografie und Zugang zu Versorgung zählen mit.</text>
  </g>

  <text class="tiny" x="60" y="1645">Basis: NCI, ACS, IARC/WHO, Hanahan/Weinberg, GBD, WCRF/AICR und Wiki-Evidenzseiten. Bei Symptomen, Früherkennung oder persönlichem Risiko medizinisches Fachpersonal fragen.</text>
</svg>
