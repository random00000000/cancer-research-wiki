<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Infektionen können Ziele der Krebsprävention sein</title>
  <desc id="desc">Öffentliche Infografik: Krebs ist nicht ansteckend, aber manche dauerhafte Infektionen erhöhen Krebsrisiko und können verhindert, entdeckt oder behandelt werden.</desc>
  <rect width="1500" height="980" fill="#f7f4ee"/>
  <rect x="50" y="44" width="1400" height="892" rx="24" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#102033">Manche Infektionen können Krebsrisiken werden</text>
  <text x="94" y="158" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#46515f">Krebs ist nicht wie eine Erkältung ansteckend, aber dauerhafte Infektionen können Gewebe</text>
  <text x="94" y="190" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#46515f">und Zellen verändern.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="215" width="400" height="390" rx="18" fill="#e8f1f2" stroke="#1b5d66" stroke-width="3"/>
    <circle cx="156" cy="285" r="42" fill="#1b5d66"/>
    <text x="156" y="301" font-size="39" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="220" y="278" font-size="31" font-weight="700" fill="#102033">HPV</text>
    <text x="220" y="313" font-size="21" fill="#46515f">Humane Papillomviren</text>
    <text x="122" y="372" font-size="25" font-weight="700" fill="#102033">Krebsbezug</text>
    <text x="122" y="408" font-size="21" fill="#46515f">Gebärmutterhalskrebs und</text>
    <text x="122" y="436" font-size="21" fill="#46515f">einige Anal-, Rachen-, Vulva-,</text>
    <text x="122" y="464" font-size="21" fill="#46515f">Vaginal- und Peniskrebsarten.</text>
    <text x="122" y="514" font-size="25" font-weight="700" fill="#102033">Präventionshebel</text>
    <text x="122" y="548" font-size="21" fill="#46515f">Früh impfen; Screening und</text>
    <text x="122" y="576" font-size="21" fill="#46515f">Nachsorge zugänglich halten.</text>
    <rect x="550" y="215" width="400" height="390" rx="18" fill="#fff1d9" stroke="#a26119" stroke-width="3"/>
    <circle cx="614" cy="285" r="42" fill="#a26119"/>
    <text x="614" y="301" font-size="39" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="678" y="278" font-size="31" font-weight="700" fill="#102033">HBV und HCV</text>
    <text x="678" y="313" font-size="21" fill="#46515f">Hepatitis B und C</text>
    <text x="580" y="372" font-size="25" font-weight="700" fill="#102033">Krebsbezug</text>
    <text x="580" y="408" font-size="21" fill="#46515f">Langfristige Leberinfektion</text>
    <text x="580" y="436" font-size="21" fill="#46515f">kann zu Zirrhose und</text>
    <text x="580" y="464" font-size="21" fill="#46515f">Leberkrebsrisiko führen.</text>
    <text x="580" y="514" font-size="25" font-weight="700" fill="#102033">Präventionshebel</text>
    <text x="580" y="548" font-size="21" fill="#46515f">HBV-Impfung, sichere Blut- und</text>
    <text x="580" y="576" font-size="21" fill="#46515f">Injektionswege, HCV-Test und Heilung.</text>
    <rect x="1008" y="215" width="400" height="390" rx="18" fill="#e9ecff" stroke="#3e4d9a" stroke-width="3"/>
    <circle cx="1072" cy="285" r="42" fill="#3e4d9a"/>
    <text x="1072" y="301" font-size="39" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="1136" y="278" font-size="31" font-weight="700" fill="#102033">H. pylori</text>
    <text x="1136" y="313" font-size="21" fill="#46515f">Magenbakterium</text>
    <text x="1038" y="372" font-size="25" font-weight="700" fill="#102033">Krebsbezug</text>
    <text x="1038" y="408" font-size="21" fill="#46515f">Dauerhafte Infektion kann</text>
    <text x="1038" y="436" font-size="21" fill="#46515f">die Magenschleimhaut reizen</text>
    <text x="1038" y="464" font-size="21" fill="#46515f">und Magenkrebsrisiko erhöhen.</text>
    <text x="1038" y="514" font-size="25" font-weight="700" fill="#102033">Präventionshebel</text>
    <text x="1038" y="548" font-size="21" fill="#46515f">Testen und behandeln, wenn</text>
    <text x="1038" y="576" font-size="21" fill="#46515f">Evidenz und Risiko passen.</text>
  </g>
  <rect x="92" y="640" width="625" height="172" rx="18" fill="#102033"/>
  <text x="130" y="690" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Öffentliche Bedeutung</text>
  <text x="130" y="734" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Prävention ist nicht nur Lebensstil. Impfungen, Tests,</text>
  <text x="130" y="766" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Behandlung, Hygiene und Nachsorge können manche</text>
  <text x="130" y="798" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Wege blockieren, bevor Krebs entsteht.</text>
  <rect x="775" y="640" width="633" height="172" rx="18" fill="#f4d35e" stroke="#8a6a00" stroke-width="3"/>
  <text x="813" y="690" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102033">Sicherheitsgrenze</text>
  <text x="813" y="734" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Lokale Impf-, Screening- und Behandlungsregeln nutzen.</text>
  <text x="813" y="766" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">Symptome, Testergebnisse, Leber- oder Magenkrankheit</text>
  <text x="813" y="798" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102033">gehören zu klinischer Beratung.</text>
  <text x="92" y="862" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#46515f">Quellen: de Martel/Lancet Glob Health 2020; Lei/NEJM 2020; HPV-Programm England;</text>
  <text x="92" y="890" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#46515f">HBV Taiwan; HCV-Kohorten; H.-pylori-Metaanalysen.</text>
  <text x="92" y="922" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b7280">Risikoreduktion ist keine Garantie. Zugang, Zeitpunkt, Stamm, Biologie, Nachsorge und Systemqualität ändern Ergebnisse.</text>
</svg>
