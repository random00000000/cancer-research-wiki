<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">运动、饮食模式和代谢健康会影响癌症风险</title>
  <desc id="desc">公共信息图，解释运动、饮食模式、体脂、代谢信号、环境可及性和无羞辱的风险降低。</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#26312b" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial" font-size="46" font-weight="800" fill="#102033">运动、饮食模式和代谢都重要</text>
  <text x="94" y="154" font-family="Arial" font-size="24" fill="#334155">降低风险是生物学加环境系统，不是身材羞辱或神奇饮食。</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">尽量多动</text><text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">活动可改善胰岛素、</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">炎症、免疫状态和</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">能量平衡。</text><text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">多运动，少久坐，</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">按能力和安全调整。</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">模式胜过潮流</text><text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">全谷物、高纤维食物、</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">蔬菜、水果和豆类</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">比神奇承诺更可靠。</text><text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">偏向高纤维饮食；</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">限制加工肉类。</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">代谢信号</text><text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">体脂可影响激素、</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">胰岛素/IGF、炎症</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">和脂肪因子。</text><text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">支持代谢健康，</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">不责备，不保证。</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">系统很重要</text><text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">食物可及、安全街道、时间、残障、压力、</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">睡眠、工作、收入和药物都会改变选择。</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">安全边界</text><text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">没有饮食、运动计划或体型能保证安全。</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">症状、糖尿病、怀孕、残障、进食障碍</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">或癌症治疗需要临床支持。</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">证据锚点：WCRF/AICR；Moore 2016；Matthews 2020；纤维/全谷物；肥胖-癌症机制综述。</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">最佳公共表述：让健康路径更容易；降低风险不是责备个人。</text>
</svg>
