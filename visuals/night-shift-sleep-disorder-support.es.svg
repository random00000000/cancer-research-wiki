<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">La somnolencia peligrosa necesita apoyo</title>
  <desc id="desc">Infografia publica que separa la fatiga normal del turno nocturno de senales de trastornos del sueno que necesitan apoyo clinico u ocupacional.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">La somnolencia peligrosa necesita apoyo</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">El turno nocturno cansa, pero los sintomas graves o inseguros necesitan ayuda.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Conoce la linea</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Insomnio o sueno excesivo</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">ligado al horario puede ser</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">un trastorno sueno-vigilia.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">No todo trabajador nocturno</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">lo tiene; las senales importan.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Busca otras causas</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Ronquidos, pausas al respirar,</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">dolor, depresion, medicinas</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">o embarazo cambian el riesgo.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">No llames turno nocturno</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">a todo problema de sueno.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Construye apoyo</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Se necesitan revisar horarios,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">descanso, derivacion medica</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">y reportar sin castigo.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">La fatiga es tema laboral</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">y de salud.</text>
  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">No adivines con medicinas</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Melatonina, cafeina, pastillas para dormir</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">o estimulantes necesitan tiempo, riesgos</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">y guia clinica.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Busca ayuda urgente</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Casi accidentes, pausas respiratorias,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">insomnio grave, dormirse sin querer,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">embarazo o ideas de autolesion requieren</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">apoyo clinico u ocupacional.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Anclas: revisiones de trastorno por turnos; estudios de sueno en trabajadores; resumenes clinicos.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">La atencion del sueno apoya seguridad y salud; no es tratamiento de cancer ni borra el riesgo.</text>
</svg>
