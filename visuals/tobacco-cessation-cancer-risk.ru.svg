<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Риск рака от табака снижается, когда воздействие прекращается</title>
  <desc id="desc">Публичная инфографика о табачном дыме, повреждении ДНК, отказе от курения, остаточном риске, скрининге и поддержке без обвинения.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#27312d" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#102033">Риск от табака падает после отказа</text>
  <text x="94" y="158" font-family="Arial" font-size="24" fill="#334155">Бросать полезно в любом возрасте. Раньше лучше. Поддержка лучше стыда.</text>
  <rect x="92" y="220" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="286" r="40" fill="#1f6f6b"/><text x="143" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Дым повреждает клетки</text><text x="122" y="398" font-family="Arial" font-size="22" fill="#334155">Табачный дым несет</text><text x="122" y="426" font-family="Arial" font-size="22" fill="#334155">канцерогены, повреждающие</text><text x="122" y="454" font-family="Arial" font-size="22" fill="#334155">ДНК и защиту тканей.</text><text x="122" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Публичный путь</text><text x="122" y="550" font-family="Arial" font-size="21" fill="#334155">Избегать дыма и защищать</text><text x="122" y="578" font-family="Arial" font-size="21" fill="#334155">пространства без дыма.</text>
  <rect x="555" y="220" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="286" r="40" fill="#b46b13"/><text x="606" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Отказ меняет путь</text><text x="585" y="398" font-family="Arial" font-size="22" fill="#334155">Остановка снижает новую</text><text x="585" y="426" font-family="Arial" font-size="22" fill="#334155">экспозицию. Риск обычно</text><text x="585" y="454" font-family="Arial" font-size="22" fill="#334155">падает со временем.</text><text x="585" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Публичный путь</text><text x="585" y="550" font-family="Arial" font-size="21" fill="#334155">Каждая попытка важна;</text><text x="585" y="578" font-family="Arial" font-size="21" fill="#334155">лекарства и поддержка помогают.</text>
  <rect x="1018" y="220" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="286" r="40" fill="#b93636"/><text x="1069" y="301" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="356" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Риск может остаться</text><text x="1048" y="398" font-family="Arial" font-size="22" fill="#334155">У бывших курящих риск</text><text x="1048" y="426" font-family="Arial" font-size="22" fill="#334155">рака легкого может быть</text><text x="1048" y="454" font-family="Arial" font-size="22" fill="#334155">повышен годами.</text><text x="1048" y="514" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Публичный путь</text><text x="1048" y="550" font-family="Arial" font-size="21" fill="#334155">Скрининг высокого риска и</text><text x="1048" y="578" font-family="Arial" font-size="21" fill="#334155">стойкие симптомы важны.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Без обвинения</text><text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Никотиновая зависимость имеет биологические,</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">коммерческие, социальные и средовые причины.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text><text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Отказ не стирает весь прошлый риск.</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Скрининг, симптомы, беременность, лечение рака</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">и лекарства требуют клинической поддержки.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Источники: IARC табачный дым; Hecht канцерогены; Jha/Pirie когорты; Park Корея; обзоры риска после отказа.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Снижайте пассивный дым, радон, рабочие экспозиции и алкоголь. Не откладывайте помощь при симптомах.</text>
</svg>
