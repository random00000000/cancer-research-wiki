<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Einige Impfungen verhindern spaetere Krebserkrankungen</title>
  <desc id="desc">Oeffentliche Infografik zu HPV-Impfung, Hepatitis-B-Impfung, Krebspravention, Zugang, Vorsorge und stigmafreier Sprache.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#fff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="800" fill="#102033">Einige Impfungen verhindern spaetere Krebserkrankungen</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">Krebsvorbeugung kann beginnen, indem krebsfoerdernde Infektionen blockiert werden.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">HPV-Impfung</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Verhindert Hochrisiko-HPV,</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">das Gebaermutterhalskrebs</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">und weitere Krebsarten</text><text x="122" y="480" font-family="Arial" font-size="22" fill="#334155">ausloesen kann.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Oeffentliche Richtung</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Moeglichst vor Exposition</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">impfen.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">HBV-Impfung</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Verhindert Hepatitis B,</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">die chronisch werden und</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">die Leber schaedigen kann.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Oeffentliche Richtung</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Geburtsdosis und komplette</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">Serie sind wichtig.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Systeme vervollstaendigen</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Impfungen brauchen Zugang,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">Vertrauen, Nachsorge,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">Screening und Behandlung.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Oeffentliche Richtung</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Versorgung offen halten;</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">empfohlenes Screening fortsetzen.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#fff">Kein Stigma</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">HPV und Hepatitis sind Infektionen, keine Moralurteile.</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">Praevention soll normal und erreichbar sein.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Sicherheitsgrenze</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Impfregeln variieren nach Alter, Land, Schwangerschaft,</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Immunsystem, frueheren Dosen und Vorgeschichte.</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">Lokale klinische Empfehlungen nutzen.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidenzanker: Lei NEJM 2020; HPV-Programm England; HBV-Impfprogramm Taiwan; infektionsbedingte Krebsbelastung.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Impfung senkt Risiko; sie garantiert nicht Risiko null und ersetzt kein empfohlenes Screening.</text>
</svg>
