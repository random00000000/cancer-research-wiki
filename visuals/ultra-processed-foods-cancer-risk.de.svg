<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Ultraverarbeitete Lebensmittel sind ein Risikomuster-Signal</title>
  <desc id="desc">Oeffentliche Infografik zu ultraverarbeiteten Lebensmittelmustern, vorsichtiger Krebs-Evidenz, Ersatz durch ballaststoffreiche Grundnahrung, Systemen und Sicherheitsgrenzen.</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" fill="#102033">Ultraverarbeitete Lebensmittel sind ein Risikomuster-Signal</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Ziel ist weniger Industrie-Routine, nicht Angst vor Essen oder Perfektion.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Muster-Signal</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Suessgetraenke, Wurstwaren,</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">Snacks und Fertiggerichte</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">verdraengen Grundnahrung.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Oeffentliche Richtung</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Seltener zur Routine machen;</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">keine Perfektion jagen.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Evidenz ist vorlaeufig</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Kohorten und Meta-Analysen</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">verbinden hohe Muster mit</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">einigen Krebsrisiken.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Oeffentliche Richtung</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Mit Risiko verbunden sagen;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">keine Gewissheit behaupten.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="27" font-weight="800" fill="#102033">Muster ersetzen</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Vollkorn, Bohnen,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">Gemuese, Obst, Nuesse</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">und einfache Basis zaehlen.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Oeffentliche Richtung</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Bessere Standards</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">verfuegbar und bezahlbar.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Systeme zaehlen</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Preis, Haltbarkeit, Werbung, Arbeit, Schule, Laeden,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">Kuechen, Behinderung und Zeit praegen Essmuster.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Sicherheitsgrenze</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Essen ersetzt keine Diagnose, Tests oder Behandlung.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Medizinische Hilfe, Impfungen, Screening</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">oder Nachsorge nicht wegen Diaet aufschieben.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidenz: BMJ NutriNet-Sante; BMJ Darmkrebs-Kohorten; UPF/Krebs-Metaanalysen; Hall-Ernaehrungsstudie.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Erste Uebersetzung: vor endgueltiger medizinischer Nutzung native Pruefung erforderlich.</text>
</svg>
