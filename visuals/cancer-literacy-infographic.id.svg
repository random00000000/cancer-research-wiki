<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Kanker: bagaimana sel melanggar aturan tubuh</title>
  <desc id="desc">Infografik Bahasa Indonesia tentang bagaimana kanker mulai dan tumbuh, serta cara menurunkan risiko tanpa menjanjikan risiko nol.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset=".52" stop-color="#fff8f2"/><stop offset="1" stop-color="#f5fff8"/></linearGradient><linearGradient id="cellGood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#75d7b3"/><stop offset="1" stop-color="#1f9d8a"/></linearGradient><linearGradient id="cellRisk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbc70"/><stop offset="1" stop-color="#e85d5d"/></linearGradient><linearGradient id="cellTumor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c678dd"/><stop offset="1" stop-color="#6a45b8"/></linearGradient><style>.title{font:800 43px Arial,sans-serif;fill:#102033}.subtitle{font:400 24px Arial,sans-serif;fill:#31445c}.section{font:800 29px Arial,sans-serif;fill:#102033}.label{font:700 21px Arial,sans-serif;fill:#102033}.body{font:400 20px Arial,sans-serif;fill:#24364b}.small{font:400 18px Arial,sans-serif;fill:#475569}.tiny{font:400 15px Arial,sans-serif;fill:#5b6b7f}.card{fill:#fff;stroke:#d8e2ef;stroke-width:2;rx:22}.line{stroke:#64748b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}</style></defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>
  <g transform="translate(60 55)"><text class="title" x="0" y="52">Kanker: sel melanggar aturan</text><text class="subtitle" x="2" y="92">Apa itu kanker, bagaimana tumbuh, dan cara menurunkan risiko tanpa janji palsu.</text><rect x="0" y="125" width="1080" height="4" fill="#cbd5e1"/></g>
  <g transform="translate(60 220)"><rect class="card" width="320" height="370"/><text class="section" x="24" y="48">1. Sel normal</text><circle cx="160" cy="145" r="78" fill="url(#cellGood)"/><circle cx="160" cy="145" r="38" fill="#e6fff6"/><path d="M128 146 C142 120,177 120,192 146 C176 171,142 171,128 146 Z" fill="none" stroke="#126c60" stroke-width="8"/><text class="body" x="24" y="260">Jaringan sehat memakai kontrol:</text><text class="small" x="24" y="295">tumbuh saat ada sinyal, memperbaiki kerusakan,</text><text class="small" x="24" y="322">dan membuang sel tidak aman.</text></g>
  <g transform="translate(440 220)"><rect class="card" width="320" height="370"/><text class="section" x="24" y="48">2. Perubahan menumpuk</text><circle cx="160" cy="145" r="78" fill="url(#cellRisk)"/><circle cx="160" cy="145" r="37" fill="#fff6db"/><path d="M125 138 L148 118 L170 168 L197 105" fill="none" stroke="#9a3412" stroke-width="9" stroke-linecap="round"/><text class="body" x="24" y="260">Paparan, infeksi, usia,</text><text class="small" x="24" y="295">risiko bawaan dan kesalahan salin</text><text class="small" x="24" y="322">dapat mengubah instruksi sel.</text></g>
  <g transform="translate(820 220)"><rect class="card" width="320" height="370"/><text class="section" x="24" y="48">3. Perilaku kanker</text><circle cx="136" cy="130" r="62" fill="url(#cellTumor)"/><circle cx="195" cy="168" r="47" fill="#8b5cf6" opacity=".9"/><circle cx="111" cy="195" r="38" fill="#a855f7" opacity=".9"/><text class="body" x="24" y="260">Dapat membelah berlebihan,</text><text class="small" x="24" y="295">menghindari pertahanan, memanggil pembuluh,</text><text class="small" x="24" y="322">menyerang dan kadang menyebar.</text></g>
  <path class="line" d="M380 405 H440"/><path d="M420 389 L448 405 L420 421 Z" fill="#64748b"/><path class="line" d="M760 405 H820"/><path d="M800 389 L828 405 L800 421 Z" fill="#64748b"/>
  <g transform="translate(60 660)"><rect class="card" width="1080" height="260"/><text class="section" x="30" y="50">Siklus dasar</text><text class="body" x="30" y="88">Sel yang berubah bertahan, berlipat, beradaptasi, dan mengubah jaringan sekitar.</text><text class="body" x="30" y="126">Akarnya bukan satu pemicu ajaib: gen, imun, metabolisme, lingkungan,</text><text class="body" x="30" y="164">usia, infeksi, dan akses pencegahan saling berinteraksi.</text><text class="small" x="30" y="213">Karena itu perlu pencegahan, deteksi dini, biologi, dan terapi lebih baik bersama.</text></g>
  <g transform="translate(60 1000)"><text class="section" x="0" y="0">Kurangi risiko: peluang turun, bukan nol</text><text class="body" x="0" y="36">Langkah ini didukung bukti, tetapi tidak menjamin hidup bebas kanker.</text><g transform="translate(0 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Tanpa tembakau</text><text class="small" x="22" y="78">Hindari asap; dukung berhenti.</text></g><g transform="translate(278 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Kurangi alkohol</text><text class="small" x="22" y="78">Lebih sedikit lebih aman; nol menghindari risiko ini.</text></g><g transform="translate(556 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Bergerak</text><text class="small" x="22" y="78">Aktivitas rutin menurunkan beberapa risiko.</text></g><g transform="translate(834 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Lindungi dari UV</text><text class="small" x="22" y="78">Matahari aman; hindari tanning bed.</text></g><g transform="translate(0 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Vaksin</text><text class="small" x="22" y="78">HPV dan hepatitis B bila sesuai.</text></g><g transform="translate(278 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Skrining</text><text class="small" x="22" y="78">Ikuti usia, risiko, dan panduan lokal.</text></g><g transform="translate(556 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Pola sehat</text><text class="small" x="22" y="78">Tumbuhan, biji utuh, keseimbangan energi.</text></g><g transform="translate(834 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Kurangi paparan</text><text class="small" x="22" y="78">Udara, kerja, radon, kebijakan penting.</text></g></g>
  <g transform="translate(60 1445)"><rect width="1080" height="150" rx="24" fill="#102033"/><text x="32" y="48" style="font:800 27px Arial,sans-serif;fill:#fff">Penting: pencegahan bukan menyalahkan</text><text x="32" y="86" style="font:400 20px Arial,sans-serif;fill:#e2e8f0">Sebagian kanker terjadi meski pilihan sangat baik. Usia, varian bawaan, infeksi,</text><text x="32" y="116" style="font:400 20px Arial,sans-serif;fill:#e2e8f0">kesalahan sel, lingkungan, pendapatan, geografi, dan akses perawatan juga penting.</text></g>
  <text class="tiny" x="60" y="1645">Dasar: NCI, ACS, IARC/WHO, Hanahan/Weinberg, GBD, WCRF/AICR dan halaman bukti wiki. Untuk gejala, skrining, atau risiko pribadi, bicara dengan tenaga medis.</text>
</svg>
