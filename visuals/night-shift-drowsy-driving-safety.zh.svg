<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">下夜班回家也是安全的一部分</title>
  <desc id="desc">公共安全信息图：夜班后的疲劳驾驶、不开车方案、受保护小睡和雇主支持。</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102033">下夜班回家也是安全的一部分</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">危险困倦需要在通勤开始前就有计划。</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">识别危险</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">车道漂移、点头、错过出口</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">或眼皮沉重，都意味着</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">应该停止驾驶。</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">微睡眠不能靠意志力</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">强撑过去。</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">准备不开车方案</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">安排接送、出租车、公交、</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">附近休息，或推迟出发。</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">在上班前就做好</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">备用计划。</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">靠系统，不靠硬撑</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">需要小睡空间、交通补助、</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">疲劳报告机制和足够</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">人手。</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">公共方向</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">安全不应依赖个人</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">英雄主义。</text>
  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">不要硬撑</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">开窗、大声音乐、打电话或掐自己</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">都不能可靠防止缺觉驾驶。</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">安全边界</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">严重困倦、反复险情、睡眠呼吸暂停、</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">严重失眠、镇静药物或怀孕</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">需要临床或职业健康支持。</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">证据锚点：夜班后真实驾驶研究；护士驾驶模拟；轮班伤害综述；安全培训。</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">这是夜班和昼夜节律健康证据图中的即时伤害预防。</text>
</svg>
