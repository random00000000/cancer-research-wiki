<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Anhaltende Koerperveraenderungen brauchen Abklaerung</title>
  <desc id="desc">Eine offentliche Infografik: Praeventionsbilder diagnostizieren keine Symptome; anhaltende unerklaerte Veraenderungen brauchen medizinische Abklaerung und Nachsorge.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="800" fill="#102033">Anhaltende Koerperveraenderungen brauchen Abklaerung</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Die meisten Symptome sind kein Krebs, aber eine Grafik kann nicht diagnostizieren.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Muster bemerken</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Neu, anhaltend, schlimmer,</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">blutend, knotig oder</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">unerklaert zaehlt.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Handeln</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Notieren, was sich aenderte</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">und wann es begann.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Abklaerung suchen</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Symptome sind kein Screening.</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">Fachleute koennen untersuchen,</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">testen und weiterleiten.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Handeln</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Keine Diaet, Detox oder</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">Beruhigung statt Abklaerung.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Nachfassen</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Wenn es bleibt, zurueckgehen.</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">Wenn die Erklaerung nicht passt,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">nach Alternativen fragen.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Handeln</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Befunde, Daten, Fotos und</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">Fragen zusammenhalten.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Zugang ist auch Praevention</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Kosten, Zeit, Stigma, Transport, Sprache, Behinderung</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">und Misstrauen koennen Versorgung verzoegern.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Dringende Grenze</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Starke Blutung, starker Schmerz, Atemnot,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">neue neurologische Symptome, Verwirrung oder</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">rascher Verfall brauchen dringend Hilfe.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidenzanker: Symptom-Reviews; Primaerversorgungs-PPV-Studien; Hilfesuche-Forschung; Verzogerungs-Metaanalysen.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Eine Symptomliste kann Krebs weder bestaetigen noch ausschliessen. Sie soll zu rechtzeitiger Abklaerung fuehren.</text>
</svg>
