<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">更清洁的空气也是肺癌预防</title>
  <desc id="desc">面向公众的信息图，说明 PM2.5、长期空气污染暴露、肺癌风险、个人防护、系统改变和医疗安全边界。</desc>
  <rect width="1500" height="980" fill="#f7faf8"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#fff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="48" font-weight="800" fill="#102033">更清洁的空气也是肺癌预防</text>
  <text x="94" y="154" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#334155">细颗粒物可到达肺深部。预防需要更清洁的系统。</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">1</text>
  <text x="122" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#102033">PM2.5 到达深处</text>
  <text x="122" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">来自交通、燃烧、</text><text x="122" y="424" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">工业和烟雾的细颗粒</text><text x="122" y="452" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">可进入肺部。</text>
  <text x="122" y="512" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="800" fill="#102033">公众方向</text><text x="122" y="548" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">查看当地空气质量；</text><text x="122" y="576" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">减少高暴露日。</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">2</text>
  <text x="585" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#102033">长期压力</text>
  <text x="585" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">反复暴露可推动</text><text x="585" y="424" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">氧化应激、炎症</text><text x="585" y="452" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">和组织损伤。</text>
  <text x="585" y="512" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="800" fill="#102033">公众方向</text><text x="585" y="548" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">更清洁空气可降低</text><text x="585" y="576" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">慢性组织压力。</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">3</text>
  <text x="1048" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#102033">不只是吸烟</text>
  <text x="1048" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">空气污染也可能影响</text><text x="1048" y="424" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">从不吸烟者；烟草仍是</text><text x="1048" y="452" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#334155">重要预防杠杆。</text>
  <text x="1048" y="512" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="800" fill="#102033">公众方向</text><text x="1048" y="548" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">保护肺部，不归咎，</text><text x="1048" y="576" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" fill="#334155">也不制造虚假确定性。</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="31" font-weight="800" fill="#fff">系统很重要</text>
  <text x="130" y="748" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#f8fafc">清洁交通、能源、工业、住房过滤、</text><text x="130" y="778" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#f8fafc">烟雾应对和劳动保护可降低风险。</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="31" font-weight="800" fill="#102033">安全边界</text>
  <text x="814" y="748" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#111827">空气质量建议不是诊断。</text><text x="814" y="778" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#111827">持续咳嗽、咳血、胸痛或原因不明</text><text x="814" y="808" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#111827">的气短需要医疗评估。</text>
  <text x="92" y="890" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#334155">证据锚点：PM2.5 肺癌荟萃分析；JTO 空气污染综述；氧化应激和炎症综述。</text>
  <text x="92" y="920" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748b">污染来源、空气质量指数、过滤/口罩建议和法律保护因国家和地区而异。</text>
</svg>
