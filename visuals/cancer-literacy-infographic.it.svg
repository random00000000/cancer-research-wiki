<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Cancro: come le cellule infrangono le regole del corpo</title>
  <desc id="desc">Infografica in italiano su come il cancro inizia e cresce, e su come ridurre il rischio senza promettere rischio zero.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="0.52" stop-color="#fff8f2"/><stop offset="1" stop-color="#f5fff8"/></linearGradient>
    <linearGradient id="cellGood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#75d7b3"/><stop offset="1" stop-color="#1f9d8a"/></linearGradient>
    <linearGradient id="cellRisk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbc70"/><stop offset="1" stop-color="#e85d5d"/></linearGradient>
    <linearGradient id="cellTumor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c678dd"/><stop offset="1" stop-color="#6a45b8"/></linearGradient>
    <style>.title{font:800 43px Arial,sans-serif;fill:#102033}.subtitle{font:400 24px Arial,sans-serif;fill:#31445c}.section{font:800 29px Arial,sans-serif;fill:#102033}.label{font:700 21px Arial,sans-serif;fill:#102033}.body{font:400 20px Arial,sans-serif;fill:#24364b}.small{font:400 18px Arial,sans-serif;fill:#475569}.tiny{font:400 15px Arial,sans-serif;fill:#5b6b7f}.card{fill:#fff;stroke:#d8e2ef;stroke-width:2;rx:22}.line{stroke:#64748b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}</style>
  </defs>
  <rect width="1200" height="1700" fill="url(#bg)"/>
  <g transform="translate(60 55)"><text class="title" x="0" y="52">Cancro: cellule fuori dalle regole</text><text class="subtitle" x="2" y="92">Che cos'è, come cresce e come ridurre il rischio senza false promesse.</text><rect x="0" y="125" width="1080" height="4" fill="#cbd5e1"/></g>
  <g transform="translate(60 220)"><rect class="card" x="0" y="0" width="320" height="370"/><text class="section" x="24" y="48">1. Cellula normale</text><circle cx="160" cy="145" r="78" fill="url(#cellGood)"/><circle cx="160" cy="145" r="38" fill="#e6fff6"/><path d="M128 146 C142 120,177 120,192 146 C176 171,142 171,128 146 Z" fill="none" stroke="#126c60" stroke-width="8"/><text class="body" x="24" y="260">I tessuti sani usano controlli:</text><text class="small" x="24" y="295">crescere con segnali, riparare danni</text><text class="small" x="24" y="322">e rimuovere cellule non sicure.</text></g>
  <g transform="translate(440 220)"><rect class="card" x="0" y="0" width="320" height="370"/><text class="section" x="24" y="48">2. Cambiamenti si accumulano</text><circle cx="160" cy="145" r="78" fill="url(#cellRisk)"/><circle cx="160" cy="145" r="37" fill="#fff6db"/><path d="M125 138 L148 118 L170 168 L197 105" fill="none" stroke="#9a3412" stroke-width="9" stroke-linecap="round"/><text class="body" x="24" y="260">Esposizioni, infezioni, età,</text><text class="small" x="24" y="295">rischio ereditato ed errori di copia</text><text class="small" x="24" y="322">possono cambiare le istruzioni.</text></g>
  <g transform="translate(820 220)"><rect class="card" x="0" y="0" width="320" height="370"/><text class="section" x="24" y="48">3. Comportamento canceroso</text><circle cx="136" cy="130" r="62" fill="url(#cellTumor)"/><circle cx="195" cy="168" r="47" fill="#8b5cf6" opacity=".9"/><circle cx="111" cy="195" r="38" fill="#a855f7" opacity=".9"/><text class="body" x="24" y="260">Può dividersi troppo,</text><text class="small" x="24" y="295">sfuggire alle difese, attirare vasi,</text><text class="small" x="24" y="322">invadere e talvolta diffondersi.</text></g>
  <path class="line" d="M380 405 H440"/><path d="M420 389 L448 405 L420 421 Z" fill="#64748b"/><path class="line" d="M760 405 H820"/><path d="M800 389 L828 405 L800 421 Z" fill="#64748b"/>
  <g transform="translate(60 660)"><rect class="card" x="0" y="0" width="1080" height="260"/><text class="section" x="30" y="50">Il ciclo di base</text><text class="body" x="30" y="88">Una cellula alterata sopravvive, si moltiplica, si adatta e cambia il tessuto intorno.</text><text class="body" x="30" y="126">La radice non è un solo grilletto: geni, immunità, metabolismo, ambiente,</text><text class="body" x="30" y="164">età, infezioni e accesso alla prevenzione interagiscono.</text><text class="small" x="30" y="213">Servono prevenzione, diagnosi precoce, biologia e terapie migliori insieme.</text></g>
  <g transform="translate(60 1000)"><text class="section" x="0" y="0">Ridurre il rischio: meno probabilità, non zero</text><text class="body" x="0" y="36">Azioni supportate da prove, ma non garanzie di una vita senza cancro.</text><g transform="translate(0 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Niente tabacco</text><text class="small" x="22" y="78">Evitare fumo e sostenere chi smette.</text></g><g transform="translate(278 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Meno alcol</text><text class="small" x="22" y="78">Meno è più sicuro; zero evita quel rischio.</text></g><g transform="translate(556 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Movimento</text><text class="small" x="22" y="78">Attività regolare riduce vari rischi.</text></g><g transform="translate(834 75)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Protezione UV</text><text class="small" x="22" y="78">Sole sicuro; niente lampade.</text></g><g transform="translate(0 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Vaccini</text><text class="small" x="22" y="78">HPV ed epatite B quando indicati.</text></g><g transform="translate(278 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Screening</text><text class="small" x="22" y="78">Per età, rischio e guida locale.</text></g><g transform="translate(556 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Schema sano</text><text class="small" x="22" y="78">Piante, cereali integrali, equilibrio.</text></g><g transform="translate(834 225)"><rect class="card" width="245" height="120"/><text class="label" x="22" y="42">Meno esposizioni</text><text class="small" x="22" y="78">Aria, lavoro, radon e politiche contano.</text></g></g>
  <g transform="translate(60 1445)"><rect x="0" y="0" width="1080" height="150" rx="24" fill="#102033"/><text x="32" y="48" style="font:800 27px Arial,sans-serif;fill:#fff">Importante: prevenzione non è colpa</text><text x="32" y="86" style="font:400 20px Arial,sans-serif;fill:#e2e8f0">Alcuni tumori accadono nonostante ottime scelte. Età, varianti ereditarie, infezioni,</text><text x="32" y="116" style="font:400 20px Arial,sans-serif;fill:#e2e8f0">errori cellulari, ambiente, reddito, geografia e accesso alle cure contano.</text></g>
  <text class="tiny" x="60" y="1645">Base: NCI, ACS, IARC/WHO, Hanahan/Weinberg, GBD, WCRF/AICR e pagine di evidenza del wiki. Per sintomi, screening o rischio personale, parlare con un professionista sanitario.</text>
</svg>
