<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Grasa corporal y metabolismo afectan riesgo de cancer</title>
  <desc id="desc">Infografia publica sobre grasa corporal, senales metabolicas, sitios de cancer, acceso de sistemas y limites sin culpa.</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#102033">Grasa corporal y metabolismo afectan riesgo de cancer</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">La salud metabolica es biologia mas ambiente, no una nota moral.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Senal por sitio</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Enlaces fuertes incluyen</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">endometrio, rinon, higado,</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">colon, pancreas y mama.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Usar mapas por sitio;</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">no mezclar todo cancer.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Mecanismos importan</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Insulina/IGF, hormonas,</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">inflamacion, adipocinas</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">e higado graso importan.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Apoyar metabolismo;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">evitar promesas milagro.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">IMC no es la persona</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">El IMC es limitado.</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">Composicion, enfermedad,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">edad y acceso cambian todo.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Direccion publica</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Medir riesgo con humildad;</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">nunca avergonzar cuerpos.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Los sistemas importan</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Comida, movimiento, sueno, medicinas, discapacidad,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">estres, pobreza, trabajo y atencion moldean riesgo.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Limite de seguridad</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">El peso no diagnostica ni reemplaza cuidado medico.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Sintomas, trastornos alimentarios, diabetes, embarazo</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">o tratamiento de cancer requieren apoyo clinico.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidencia: revision paraguas BMJ; evaluacion IARC; WCRF/AICR; estudios de aleatorizacion mendeliana.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Traduccion inicial: requiere revision nativa antes de uso medico final.</text>
</svg>
