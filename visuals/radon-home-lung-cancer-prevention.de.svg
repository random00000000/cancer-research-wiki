<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Radonsichere Wohnungen sind Lungenkrebsvorbeugung</title>
  <desc id="desc">Oeffentliche Infografik zu unsichtbarem Radon, Messung, Minderung, Rauchen, Gebaeudesystemen und medizinischen Sicherheitsgrenzen.</desc>
  <rect width="1500" height="980" fill="#f7faf8"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#fff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#102033">Radonsichere Wohnungen sind Lungenkrebsvorbeugung</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Radon ist unsichtbar. Messen und mindern macht versteckte Belastung handhabbar.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Unsichtbares Gas</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Radon kann aus Boden</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">und Gestein in Gebaeude</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">eindringen und sich sammeln.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Oeffentliche Richtung</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Man sieht und riecht es nicht;</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">Wohnung messen.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="28" font-weight="800" fill="#102033">Messen, dann mindern</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Messung findet hohe Werte.</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">Minderung senkt die</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">langfristige Belastung.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Oeffentliche Richtung</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Lokale Schwellen und</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">Fachhilfe nutzen.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#fff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Rauchen vervielfacht Risiko</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Radon betrifft alle, aber</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">das absolute Risiko ist mit</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">Tabak deutlich hoeher.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Oeffentliche Richtung</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Wohnungen testen und</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">Rauchstopp ohne Schuld helfen.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#fff">Systeme zaehlen</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Bauvorschriften, Mietwohnungen, Schulen, Arbeit</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">und Finanzierung bestimmen Schutz.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Sicherheitsgrenze</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Diese Grafik bewertet keine Lungensymptome.</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Anhaltender Husten, Blut, Brustschmerz oder</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">ungeklaerte Atemnot brauchen medizinische Hilfe.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidenz: Wohnradon-Metaanalyse; europaeische und nordamerikanische gepoolte Analysen; Nichtraucher-Evidenz.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Aktionswerte, Einheiten, Mietrechte und Minderungsregeln variieren nach Land und Region.</text>
</svg>
