<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Alkoholrisiko hängt von Biologie und Koexpositionen ab</title>
  <desc id="desc">Öffentliche Infografik zu Acetaldehyd, Alkohol-Flush, ALDH2-Biologie und Tabak plus Alkohol als Krebsrisiken ohne Schuldzuweisung oder genetischen Determinismus.</desc>
  <rect width="1500" height="980" fill="#f7f4ee"/>
  <rect x="50" y="44" width="1400" height="892" rx="24" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#102033">Alkoholrisiko hängt von Dosis, Biologie und Tabak ab</text>
  <text x="94" y="158" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#46515f">Weniger Alkohol bedeutet meist niedrigeres Krebsrisiko. Kein Alkohol vermeidet alkohol-attributierbares Risiko.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="220" width="390" height="390" rx="18" fill="#e8f1f2" stroke="#1b5d66" stroke-width="3"/>
    <circle cx="152" cy="285" r="40" fill="#1b5d66"/><text x="152" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="122" y="356" font-size="28" font-weight="700" fill="#102033">Acetaldehyd</text>
    <text x="122" y="398" font-size="21" fill="#46515f">Alkohol wird zu Acetaldehyd,</text><text x="122" y="426" font-size="21" fill="#46515f">das DNA und Reparatursysteme</text><text x="122" y="454" font-size="21" fill="#46515f">schädigen kann.</text>
    <text x="122" y="512" font-size="23" font-weight="700" fill="#102033">Öffentliche Richtung</text><text x="122" y="546" font-size="21" fill="#46515f">Weniger oder gar nicht trinken.</text>
    <rect x="555" y="220" width="390" height="390" rx="18" fill="#fff1d9" stroke="#a26119" stroke-width="3"/>
    <circle cx="615" cy="285" r="40" fill="#a26119"/><text x="615" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="585" y="356" font-size="28" font-weight="700" fill="#102033">Flush und ALDH2</text>
    <text x="585" y="398" font-size="21" fill="#46515f">Gesichtsrötung nach Alkohol</text><text x="585" y="426" font-size="21" fill="#46515f">kann langsamere Acetaldehyd-</text><text x="585" y="454" font-size="21" fill="#46515f">Clearance anzeigen.</text>
    <text x="585" y="512" font-size="23" font-weight="700" fill="#102033">Öffentliche Richtung</text><text x="585" y="546" font-size="21" fill="#46515f">Als Warnzeichen behandeln,</text><text x="585" y="574" font-size="21" fill="#46515f">nicht als sichere Toleranz.</text>
    <rect x="1018" y="220" width="390" height="390" rx="18" fill="#fde8e6" stroke="#ad3434" stroke-width="3"/>
    <circle cx="1078" cy="285" r="40" fill="#ad3434"/><text x="1078" y="300" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="1048" y="356" font-size="28" font-weight="700" fill="#102033">Tabak plus Alkohol</text>
    <text x="1048" y="398" font-size="21" fill="#46515f">Zusammen besonders wichtig</text><text x="1048" y="426" font-size="21" fill="#46515f">für Mund, Rachen, Kehlkopf</text><text x="1048" y="454" font-size="21" fill="#46515f">und Speiseröhre.</text>
    <text x="1048" y="512" font-size="23" font-weight="700" fill="#102033">Öffentliche Richtung</text><text x="1048" y="546" font-size="21" fill="#46515f">Tabak vermeiden zählt noch</text><text x="1048" y="574" font-size="21" fill="#46515f">mehr, wenn Alkohol da ist.</text>
  </g>
  <rect x="92" y="655" width="625" height="160" rx="18" fill="#102033"/>
  <text x="130" y="704" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Ohne Schuld</text>
  <text x="130" y="748" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">Gleiches Getränk, andere Biologie. Gleiche Exposition,</text><text x="130" y="780" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d9e4ef">anderer Kontext. Risiko ist kein Schicksal.</text>
  <rect x="775" y="655" width="633" height="200" rx="18" fill="#f4d35e" stroke="#8a6a00" stroke-width="3"/>
  <text x="813" y="704" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102033">Sicherheitsgrenze</text>
  <text x="813" y="748" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102033">Flush ist keine Diagnose und kein Gentest.</text>
  <text x="813" y="778" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102033">Abhängigkeit, Symptome, Leberkrankheit, Medikamente,</text>
  <text x="813" y="808" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102033">Schwangerschaft oder frühere Krebsdiagnose</text>
  <text x="813" y="838" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102033">brauchen klinische Unterstützung.</text>
  <text x="92" y="880" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#46515f">Quellen: Rumgay 2021; Bagnardi; Acetaldehyd; Andrici Flush/ESCC; Chang ALDH2; Hashibe INHANCE.</text>
  <text x="92" y="918" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7280">Stereotype vermeiden. ALDH2 verändert Risiko; es ist nicht Identität oder Schicksal. Tabakvermeidung zählt überall.</text>
</svg>
