<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Защита от UV снижает риск рака кожи</title>
  <desc id="desc">Публичная инфографика о повреждении ДНК ультрафиолетом, соляриях, многоуровневой защите и клинической оценке подозрительных изменений кожи.</desc>
  <rect width="1500" height="980" fill="#fbfaf5"/><rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#29312b" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial" font-size="45" font-weight="800" fill="#102033">Защищайте кожу от повторного UV-повреждения</text>
  <text x="94" y="154" font-family="Arial" font-size="24" fill="#334155">Солнце — часть жизни. Ожоги и солярии — предотвратимые риски.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/><circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">UV повреждает ДНК</text><text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">UVA и UVB могут повреждать</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">клетки кожи прямым</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">и непрямым путем.</text><text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Публичный путь</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Избегать повторных ожогов;</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">защищаться при высоком UV.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/><circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Без соляриев</text><text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Солярий не является</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">безопасной альтернативой;</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">загар означает UV-травму.</text><text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Публичный путь</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Избегать искусственного загара;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">защищать подростков.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/><circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Защита слоями</text><text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Тень, одежда, шляпа,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">очки, крем и расписание</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">работают вместе.</text><text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Публичный путь</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Крем — только один слой,</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">не разрешение обгорать.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/><text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Системы важны</text><text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Тень в школах и на работе, безопасное расписание,</text><text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">защитная одежда и политика соляриев снижают риск.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/><text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text><text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Визуальный список не является диагнозом.</text><text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Изменяющиеся, кровящие, болезненные,</text><text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">незаживающие или необычные пятна — к врачу.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Источники: IARC солнце/UV и солярии; мета-анализы; Nambour испытания крема; обзоры UV-повреждения ДНК.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Риск зависит от тона кожи, иммунитета, географии, работы, возраста, прошлой экспозиции и доступа к тени.</text>
</svg>
