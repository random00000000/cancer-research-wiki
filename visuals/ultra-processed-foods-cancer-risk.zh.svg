<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">超加工食品是风险模式信号</title>
  <desc id="desc">面向公众的信息图，说明超加工食品模式、提示性的癌症证据、用高纤维主食替代、食品系统和安全边界。</desc>
  <rect width="1500" height="980" fill="#f8fbf7"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="48" font-weight="800" fill="#102033">超加工食品是癌症风险模式信号</text>
  <text x="94" y="154" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#334155">目标是减少日常工业化食品，不是制造食物恐惧或完美规则。</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e7f5f2" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial, 'Microsoft YaHei'" font-size="30" font-weight="800" fill="#102033">模式信号</text>
  <text x="122" y="396" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">含糖饮料、加工肉、</text><text x="122" y="424" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">零食和速食会挤掉</text><text x="122" y="452" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">基础食物。</text>
  <text x="122" y="512" font-family="Arial, 'Microsoft YaHei'" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="122" y="548" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">减少日常依赖，</text><text x="122" y="576" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">不要追求完美。</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial, 'Microsoft YaHei'" font-size="30" font-weight="800" fill="#102033">证据仍是提示性</text>
  <text x="585" y="396" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">队列研究和荟萃分析</text><text x="585" y="424" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">把高摄入模式与某些</text><text x="585" y="452" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">癌症风险联系起来。</text>
  <text x="585" y="512" font-family="Arial, 'Microsoft YaHei'" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="585" y="548" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">说与风险有关；</text><text x="585" y="576" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">不要说已经确定。</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial, 'Microsoft YaHei'" font-size="30" font-weight="800" fill="#102033">替换整体模式</text>
  <text x="1048" y="396" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">全谷物、豆类、蔬菜、</text><text x="1048" y="424" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">水果、坚果和简单</text><text x="1048" y="452" font-family="Arial, 'Microsoft YaHei'" font-size="22" fill="#334155">主食很重要。</text>
  <text x="1048" y="512" font-family="Arial, 'Microsoft YaHei'" font-size="25" font-weight="800" fill="#102033">公共方向</text><text x="1048" y="548" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">让更好的默认选择</text><text x="1048" y="576" font-family="Arial, 'Microsoft YaHei'" font-size="21" fill="#334155">可得且可负担。</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial, 'Microsoft YaHei'" font-size="31" font-weight="800" fill="#ffffff">系统也重要</text>
  <text x="130" y="748" font-family="Arial, 'Microsoft YaHei'" font-size="23" fill="#f8fafc">价格、保质期、广告、工作、学校餐、商店、</text>
  <text x="130" y="778" font-family="Arial, 'Microsoft YaHei'" font-size="23" fill="#f8fafc">厨房、残障和时间都会塑造饮食模式。</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial, 'Microsoft YaHei'" font-size="31" font-weight="800" fill="#102033">安全边界</text>
  <text x="814" y="748" font-family="Arial, 'Microsoft YaHei'" font-size="23" fill="#111827">饮食建议不是诊断、筛查或治疗。</text>
  <text x="814" y="778" font-family="Arial, 'Microsoft YaHei'" font-size="23" fill="#111827">不要因改变饮食而延误就医、疫苗、</text>
  <text x="814" y="808" font-family="Arial, 'Microsoft YaHei'" font-size="23" fill="#111827">筛查或随访。</text>
  <text x="92" y="890" font-family="Arial, 'Microsoft YaHei'" font-size="19" fill="#334155">证据锚点：BMJ NutriNet-Sante队列；BMJ结直肠队列；UPF/癌症荟萃分析；Hall喂养试验。</text>
  <text x="92" y="920" font-family="Arial, 'Microsoft YaHei'" font-size="16" fill="#64748b">初版翻译：最终医学使用前需要母语审阅。</text>
</svg>
