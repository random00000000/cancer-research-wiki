<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Cancer screening needs a balance sheet</title>
  <desc id="desc">A public infographic explaining that cancer screening can reduce deaths or prevent some cancers, but also has false positives, missed cancers, overdiagnosis, procedure harms, and follow-up needs.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">Cancer screening needs a balance sheet</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">The right test can save lives, but more testing is not always better.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Possible benefits</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Some screening lowers</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">cancer deaths or finds</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">precancer before cancer.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Ask</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Which cancer, which test,</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">which age and risk?</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Possible harms</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">False alarms, missed</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">cancers, overdiagnosis,</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">procedures, cost, stress.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Ask</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">What happens after an</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">abnormal result?</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Symptoms differ</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Screening is for people</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">without symptoms.</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">Symptoms need care.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Ask</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Is this prevention, early</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">detection, or diagnosis?</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Use absolute numbers</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">A relative percent can sound huge. Ask how many</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">people benefit or are harmed per 1,000 screened.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">New, persistent, or concerning symptoms are not</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">a screening question. They deserve medical</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">evaluation and follow-up.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: randomized trials, screening meta-analyses, overdiagnosis reviews, guideline benefit-harm reporting studies.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Screening depends on cancer type, age, anatomy, risk, prior results, local guidance, and access to follow-up care.</text>
</svg>
