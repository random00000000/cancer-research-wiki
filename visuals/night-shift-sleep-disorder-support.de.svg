<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Gefahrliche Mudigkeit braucht Hilfe</title>
  <desc id="desc">Offentliche Infografik: normale Nachtschichtmudigkeit versus Warnzeichen fur Schlafstorungen, die klinische oder arbeitsmedizinische Hilfe brauchen.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102033">Gefahrliche Mudigkeit braucht Hilfe</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Nachtarbeit ermudet; schwere oder unsichere Symptome brauchen Unterstutzung.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Die Grenze kennen</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Insomnie oder Schlafrigkeit</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">durch Arbeitszeiten kann eine</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">Schlaf-Wach-Storung sein.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Nicht alle Nachtarbeiter haben</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">sie; Warnsignale zahlen.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Andere Ursachen</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Schnarchen, Atempausen,</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">Schmerz, Depression, Mittel</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">oder Schwangerschaft zahlen.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Nicht jedes Schlafproblem</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">ist nur Schichtarbeit.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Hilfe aufbauen</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Notig sind Dienstplanprufung,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">Ruheoptionen, Uberweisung</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">und Melden ohne Strafe.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Offentliche Richtung</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Fatigue ist Arbeits- und</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">Gesundheitsschutz.</text>
  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Nicht mit Mitteln raten</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Melatonin, Koffein-Timing, Schlafmittel</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">und Wachmacher brauchen Timing,</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">Risikoprufung und arztliche Hilfe.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Dringend Hilfe holen</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Beinahe-Unfalle, Atempausen, schwere</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Insomnie, ungewolltes Einschlafen,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">Schwangerschaft oder Selbstverletzungs-</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">gedanken brauchen klinische Hilfe.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidenzanker: Reviews zu Shift Work Disorder; Schlafstudien bei Schichtarbeit; klinische Zusammenfassungen.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Schlafversorgung unterstutzt Sicherheit und Gesundheit; sie ist keine Krebsbehandlung.</text>
</svg>
