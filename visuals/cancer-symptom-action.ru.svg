<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Стойкие изменения тела требуют помощи</title>
  <desc id="desc">Публичная инфографика: профилактическая картинка не диагностирует симптомы; стойкие необъяснимые изменения требуют медицинской оценки и наблюдения.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" fill="#102033">Стойкие изменения тела требуют помощи</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Большинство симптомов не рак, но инфографика не может поставить диагноз.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Замечайте паттерн</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Новое, стойкое, худшее,</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">кровотечение, уплотнение</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">или неясное изменение важны.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Действие</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Запишите, что изменилось</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">и когда началось.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Идите на оценку</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Симптомы не скрининг.</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">Врач может осмотреть,</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">проверить и решить шаги.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Действие</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Не заменяйте помощь</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">диетой, детоксом или покоем.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Наблюдайте дальше</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Если продолжается, вернитесь.</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">Если объяснение не подходит,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">спросите о других причинах.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Действие</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Храните результаты, даты,</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">фото и вопросы вместе.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Доступ тоже профилактика</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Цена, время, стигма, транспорт, язык, инвалидность</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">и недоверие могут задерживать помощь.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Срочная граница</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Сильное кровотечение, сильная боль, одышка,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">новые неврологические симптомы, спутанность</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">или быстрое ухудшение требуют срочной помощи.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Опоры: обзоры симптомов; исследования прогностической ценности; помощь-обращение; метаанализы задержек.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Список симптомов не подтверждает и не исключает рак. Он направляет к своевременной оценке.</text>
</svg>
