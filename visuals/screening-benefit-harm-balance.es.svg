<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">El tamizaje de cancer necesita balance</title>
  <desc id="desc">Infografia publica que explica beneficios y danos posibles del tamizaje de cancer, falsos positivos, canceres no detectados, sobrediagnostico y seguimiento.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" fill="#102033">El tamizaje de cancer necesita balance</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">La prueba correcta puede salvar vidas, pero mas pruebas no siempre es mejor.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Beneficios posibles</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Algunas pruebas reducen</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">muertes o encuentran</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">precancer antes del cancer.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Pregunte</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Que cancer, que prueba,</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">que edad y riesgo?</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Danos posibles</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Falsas alarmas, canceres</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">no detectados, sobre-</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">diagnostico, costos, estres.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Pregunte</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Que pasa despues de un</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">resultado anormal?</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Sintomas no son igual</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">El tamizaje es para</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">personas sin sintomas.</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">Sintomas necesitan atencion.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Pregunte</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Es prevencion, deteccion</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">temprana o diagnostico?</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Use numeros absolutos</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Un porcentaje relativo puede sonar enorme. Pregunte</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">cuantas personas se benefician o danan por 1,000.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Limite de seguridad</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Sintomas nuevos, persistentes o preocupantes</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">no son tamizaje. Merecen evaluacion medica</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">y seguimiento.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Anclajes: ensayos, metaanalisis de tamizaje, revisiones de sobrediagnostico y estudios de beneficios/danos.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">El tamizaje depende de tipo de cancer, edad, anatomia, riesgo, resultados previos, guia local y seguimiento.</text>
</svg>
