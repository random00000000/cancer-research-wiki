<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Entscheidungshilfe zu Krebs-Screening und Impfungen</title>
  <desc id="desc">Deutsche Infografik zu Symptomen, Risiko, Nutzen, Schäden, Nachsorge, Screening und Impfungen.</desc>
  <rect width="1200" height="850" fill="#f8fbff"/>
  <rect x="48" y="42" width="1104" height="766" rx="24" fill="#ffffff" stroke="#d8e2ef" stroke-width="3"/>
  <text x="84" y="104" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="800" fill="#102033">Screening und Impfungen können Krebs vorbeugen</text>
  <text x="86" y="142" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">Die nützliche Frage ist, welches Werkzeug zu Person, Risiko und Nachsorge passt.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="84" y="190" width="310" height="190" rx="18" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="112" y="240" font-size="26" font-weight="800" fill="#102033">Symptome?</text>
    <text x="112" y="288" font-size="20" fill="#334155">Neue oder anhaltende</text>
    <text x="112" y="316" font-size="20" fill="#334155">Symptome sind kein Screening.</text>
    <text x="112" y="354" font-size="21" font-weight="800" fill="#102033">Medizinisch abklären.</text>
    <rect x="445" y="190" width="310" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="473" y="240" font-size="26" font-weight="800" fill="#102033">Keine Symptome?</text>
    <text x="473" y="288" font-size="20" fill="#334155">Alter, Anatomie, Befunde,</text>
    <text x="473" y="316" font-size="20" fill="#334155">Familie, Infektionen, Risiko</text>
    <text x="473" y="344" font-size="20" fill="#334155">und lokale Leitlinien prüfen.</text>
    <rect x="806" y="190" width="310" height="190" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="834" y="240" font-size="26" font-weight="800" fill="#102033">Werkzeuge wählen</text>
    <text x="834" y="288" font-size="20" fill="#334155">Manche verhindern Krebs.</text>
    <text x="834" y="316" font-size="20" fill="#334155">Manche finden ihn früher.</text>
    <text x="834" y="354" font-size="21" font-weight="800" fill="#102033">Zum Risiko passend.</text>
    <rect x="84" y="440" width="310" height="170" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="112" y="488" font-size="26" font-weight="800" fill="#102033">Impfungen</text>
    <text x="112" y="532" font-size="20" fill="#334155">HPV: verhindert Infektionen,</text>
    <text x="112" y="560" font-size="20" fill="#334155">die mehrere Krebsarten auslösen.</text>
    <text x="112" y="588" font-size="20" fill="#334155">Hepatitis B schützt die Leber.</text>
    <rect x="445" y="440" width="310" height="170" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="473" y="488" font-size="26" font-weight="800" fill="#102033">Screening</text>
    <text x="473" y="532" font-size="20" fill="#334155">Kann Krebs früher finden</text>
    <text x="473" y="560" font-size="20" fill="#334155">oder Vorstufen entdecken.</text>
    <rect x="806" y="440" width="310" height="170" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="834" y="488" font-size="26" font-weight="800" fill="#102033">Abwägen</text>
    <text x="834" y="532" font-size="20" fill="#334155">Fehlalarme, Schäden, Kosten,</text>
    <text x="834" y="560" font-size="20" fill="#334155">Stress und Zugang zählen.</text>
    <text x="834" y="588" font-size="20" font-weight="800" fill="#102033">Nachsorge gehört dazu.</text>
  </g>
  <rect x="84" y="675" width="1032" height="68" rx="22" fill="#102033"/>
  <text x="118" y="718" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Sicherer Kern: frage, welche Prävention zu Alter, Körper, Vorgeschichte, Risiko und Nachsorge passt.</text>
  <text x="84" y="790" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">Bildung, keine persönliche Medizinberatung. Basis: Screening, Screening-Schäden, Infektionsprävention und HPV/HBV-Impfung.</text>
</svg>
