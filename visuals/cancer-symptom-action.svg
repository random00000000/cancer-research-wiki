<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Persistent body changes deserve care</title>
  <desc id="desc">A public infographic explaining that cancer prevention images cannot diagnose symptoms, persistent unexplained changes need medical evaluation, and follow-up matters.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">Persistent body changes deserve care</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Most symptoms are not cancer, but a prevention graphic cannot diagnose you.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Notice patterns</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">New, persistent, worsening,</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">bleeding, lump-like, or</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">unexplained changes matter.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Action</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Write down what changed</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">and when it started.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Seek evaluation</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Symptoms are not screening.</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">A clinician can examine, test,</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">and decide next steps.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Action</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Do not replace care with</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">diet, detox, or reassurance.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Follow up</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">If symptoms continue, return.</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">If an explanation does not fit,</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">ask what else is possible.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Action</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Keep results, dates, photos,</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">and questions together.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Access is prevention too</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Cost, time, stigma, transport, language, disability,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">and mistrust can delay care. Reduce barriers.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Urgent boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Major bleeding, severe pain, trouble breathing,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">new neurologic symptoms, confusion, or rapid</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">decline need urgent medical help.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: symptom-signature reviews; primary-care predictive-value studies; help-seeking research; delay meta-analyses.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">A symptom list cannot rule cancer in or out. It can only point toward timely evaluation and follow-up.</text>
</svg>
