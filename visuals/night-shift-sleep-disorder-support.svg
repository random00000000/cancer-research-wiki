<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Dangerous sleepiness needs support</title>
  <desc id="desc">A public infographic separating ordinary night-shift fatigue from sleep disorder warning signs that need clinical or occupational support.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102033">Dangerous sleepiness needs support</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Night work can cause fatigue, but severe or unsafe symptoms deserve help.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Know the line</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Insomnia or sleepiness tied</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">to work hours can be a</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">sleep-wake disorder.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Not every night worker has it;</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">danger signals matter.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Check other causes</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Snoring, breathing pauses,</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">pain, depression, medicines,</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">or pregnancy can change risk.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Do not self-label every</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">sleep problem as shift work.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Build support</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Workers need schedule review,</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">rest options, referral paths,</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">and no-punishment reporting.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Public direction</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Fatigue safety is an employer</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">and health-system issue.</text>
  <rect x="92" y="655" width="625" height="170" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Do not guess with medicines</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Melatonin, caffeine timing, sleep pills,</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">and wake-promoting drugs need timing,</text>
  <text x="130" y="808" font-family="Arial" font-size="23" fill="#f8fafc">risk review, and clinician guidance.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Get help urgently</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Drowsy-driving near misses, breathing pauses,</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">severe insomnia, falling asleep unintentionally,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">pregnancy concerns, or self-harm thoughts</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">need clinical or occupational support.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: Shift Work Disorder reviews; sleep-disorder studies in shift workers; clinical sleep-medicine summaries.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Sleep-disorder care supports safety and health; it is not cancer treatment or proof that risk disappears.</text>
</svg>
