<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Rosie playbook for human cancer access</title>
  <desc id="desc">A public education workflow translating the Rosie dog cancer story into a human-safe advanced cancer access map: facts, tumor data, AI research assistant, expert team, legitimate advanced options, supervised treatment, and resistance tracking.</desc>
  <rect width="1500" height="980" fill="#f8fafc"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#0f172a">The Rosie playbook, translated safely for humans</text>
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="22" fill="#334155">Not DIY treatment. Build the facts, data, expert network, and legitimate advanced-options review.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="170" width="250" height="132" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="102" cy="204" r="18" fill="#2563eb"/><text x="96" y="211" font-size="19" font-weight="700" fill="#fff">1</text>
    <text x="132" y="204" font-size="20" font-weight="700" fill="#1e3a8a">Freeze the facts</text>
    <text x="96" y="238" font-size="16" fill="#1e40af">Diagnosis, stage, scans,</text>
    <text x="96" y="262" font-size="16" fill="#1e40af">prior therapy, current risk.</text>

    <rect x="360" y="170" width="250" height="132" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <circle cx="392" cy="204" r="18" fill="#0891b2"/><text x="386" y="211" font-size="19" font-weight="700" fill="#fff">2</text>
    <text x="422" y="204" font-size="20" font-weight="700" fill="#155e75">Get tumor data</text>
    <text x="386" y="238" font-size="16" fill="#0e7490">Pathology, biomarkers,</text>
    <text x="386" y="262" font-size="16" fill="#0e7490">NGS, HLA if relevant.</text>

    <rect x="650" y="170" width="250" height="132" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="682" cy="204" r="18" fill="#d97706"/><text x="676" y="211" font-size="19" font-weight="700" fill="#fff">3</text>
    <text x="712" y="204" font-size="20" font-weight="700" fill="#92400e">Use AI as assistant</text>
    <text x="676" y="238" font-size="16" fill="#a16207">Summaries, questions,</text>
    <text x="676" y="262" font-size="16" fill="#a16207">trial search, citations.</text>

    <rect x="940" y="170" width="250" height="132" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <circle cx="972" cy="204" r="18" fill="#db2777"/><text x="966" y="211" font-size="19" font-weight="700" fill="#fff">4</text>
    <text x="1002" y="204" font-size="20" font-weight="700" fill="#9d174d">Recruit experts</text>
    <text x="966" y="238" font-size="16" fill="#be185d">Oncologist, tumor board,</text>
    <text x="966" y="262" font-size="16" fill="#be185d">trial team, researchers.</text>

    <path d="M322 236 H356M612 236 H646M902 236 H936" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="210" y="400" width="310" height="155" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="242" y="440" font-size="22" font-weight="700" fill="#0f172a">Advanced options review</text>
    <text x="242" y="476" font-size="17" fill="#334155">Standard options still open</text>
    <text x="242" y="504" font-size="17" fill="#334155">Molecularly matched therapy</text>
    <text x="242" y="532" font-size="17" fill="#334155">Trials and expanded access</text>

    <rect x="595" y="400" width="310" height="155" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="627" y="440" font-size="22" font-weight="700" fill="#0f172a">Personalized trial paths</text>
    <text x="627" y="476" font-size="17" fill="#334155">mRNA / neoantigen trials</text>
    <text x="627" y="504" font-size="17" fill="#334155">Cell therapy / TCR / TIL</text>
    <text x="627" y="532" font-size="17" fill="#334155">Fresh tissue and monitoring</text>

    <rect x="980" y="400" width="310" height="155" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1012" y="440" font-size="22" font-weight="700" fill="#0f172a">Track response</text>
    <text x="1012" y="476" font-size="17" fill="#334155">Scans, labs, symptoms</text>
    <text x="1012" y="504" font-size="17" fill="#334155">Adverse events</text>
    <text x="1012" y="532" font-size="17" fill="#334155">Resistance and repeat review</text>

    <path d="M1065 304 C1065 365 1135 355 1135 396" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M980 478 H910" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M595 478 H525" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="70" y="650" width="655" height="138" rx="8" fill="#0f172a"/>
    <text x="105" y="692" font-size="24" font-weight="700" fill="#fff">The key move</text>
    <text x="105" y="730" font-size="18" fill="#e2e8f0">Do not ask AI for a cure. Use AI to build a precise case packet,</text>
    <text x="105" y="758" font-size="18" fill="#e2e8f0">then put that packet in front of qualified teams with real infrastructure.</text>

    <rect x="775" y="650" width="655" height="138" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="810" y="692" font-size="24" font-weight="700" fill="#9a3412">Hard safety boundary</text>
    <text x="810" y="730" font-size="18" fill="#7c2d12">No DIY vaccine design, manufacturing, dosing, procurement,</text>
    <text x="810" y="758" font-size="18" fill="#7c2d12">self-injection, or treatment substitution.</text>

    <text x="70" y="875" font-size="15" fill="#475569">Evidence anchors: UNSW Rosie profile; The Scientist; The Verge caution; NCI biomarker/trial resources; ClinicalTrials.gov; FDA expanded access.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
