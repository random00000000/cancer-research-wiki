<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">mRNA cancer therapy needs a clinical chain</title>
  <desc id="desc">A public infographic explaining the safe pathway from tumor sample to mRNA cancer vaccine, immune response, monitoring, and why this is not a do-it-yourself cure.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#102033">mRNA cancer therapy needs a clinical chain</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">mRNA is a temporary instruction. The therapy is the whole regulated pathway around it.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e3f3ee" stroke="#14745d" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#14745d"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Find targets</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Tumor and normal samples</text>
  <text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">are sequenced to look for</text>
  <text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">visible cancer targets.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Key idea</text>
  <text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Not every mutation makes</text>
  <text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">a useful immune target.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff0d6" stroke="#b56512" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b56512"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Make and deliver</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Selected targets are encoded</text>
  <text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">as mRNA and packaged for</text>
  <text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">clinical delivery.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Key idea</text>
  <text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Delivery, quality testing,</text>
  <text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">and timing can decide success.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#e9ecff" stroke="#4b57b8" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#4b57b8"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="352" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Teach T cells</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Cells show target fragments</text>
  <text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">so T cells may recognize</text>
  <text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">matching cancer cells.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Key idea</text>
  <text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Immune response is not</text>
  <text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">the same as cure.</text>
  <rect x="92" y="655" width="625" height="200" rx="16" fill="#102033"/>
  <text x="130" y="700" font-family="Arial" font-size="29" font-weight="800" fill="#ffffff">Clinical infrastructure</text>
  <text x="130" y="734" font-family="Arial" font-size="29" font-weight="800" fill="#ffffff">is part of therapy</text>
  <text x="130" y="772" font-family="Arial" font-size="21" fill="#f8fafc">Biopsy, sequencing, antigen ranking, sterile</text>
  <text x="130" y="800" font-family="Arial" font-size="21" fill="#f8fafc">manufacturing, release testing, monitoring,</text>
  <text x="130" y="828" font-family="Arial" font-size="21" fill="#f8fafc">and adverse-event care are not extras.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#fbeeb8" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Safety boundary</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">This wiki can explain trials and mechanisms.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">It must not provide DIY vaccine design, dosing,</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">manufacturing, procurement, or self-treatment</text>
  <text x="814" y="838" font-family="Arial" font-size="23" fill="#111827">instructions.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Evidence anchors: mRNA-4157/V940 melanoma trial; autogene cevumeran pancreatic studies; LNP and neoantigen vaccine reviews.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Purpose: understand the landscape, ask sharper questions, and work with qualified clinical and research teams.</text>
</svg>
