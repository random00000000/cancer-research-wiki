<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Защищайте биологические часы, когда возможно</title>
  <desc id="desc">Публичная инфографика о циркадном нарушении, ночной работе, свете ночью, сне, системной поддержке и неопределенности риска рака.</desc>
  <rect width="1500" height="980" fill="#f8fbfb"/>
  <rect x="48" y="45" width="1404" height="890" rx="26" fill="#ffffff" stroke="#24313d" stroke-width="3"/>
  <text x="92" y="108" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#102033">Защищайте биологические часы, когда возможно</text>
  <text x="94" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Циркадный сбой - это биология плюс работа, свет, стресс, уход, болезнь и доступ.</text>
  <rect x="92" y="218" width="392" height="392" rx="18" fill="#e6f4f3" stroke="#1f6f6b" stroke-width="3"/>
  <circle cx="152" cy="284" r="40" fill="#1f6f6b"/><text x="143" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">1</text>
  <text x="122" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Держите ритм</text>
  <text x="122" y="396" font-family="Arial" font-size="22" fill="#334155">Регулярный темный сон</text><text x="122" y="424" font-family="Arial" font-size="22" fill="#334155">координирует гормоны,</text><text x="122" y="452" font-family="Arial" font-size="22" fill="#334155">ремонт, иммунитет и обмен.</text>
  <text x="122" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий ориентир</text><text x="122" y="548" font-family="Arial" font-size="21" fill="#334155">Защищайте регулярный сон,</text><text x="122" y="576" font-family="Arial" font-size="21" fill="#334155">когда жизнь позволяет.</text>
  <rect x="555" y="218" width="392" height="392" rx="18" fill="#fff2d9" stroke="#b46b13" stroke-width="3"/>
  <circle cx="615" cy="284" r="40" fill="#b46b13"/><text x="606" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">2</text>
  <text x="585" y="354" font-family="Arial" font-size="30" font-weight="800" fill="#102033">Меньше света ночью</text>
  <text x="585" y="396" font-family="Arial" font-size="22" fill="#334155">Яркий свет ночью может</text><text x="585" y="424" font-family="Arial" font-size="22" fill="#334155">сдвигать часы и подавлять</text><text x="585" y="452" font-family="Arial" font-size="22" fill="#334155">сигналы мелатонина.</text>
  <text x="585" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий ориентир</text><text x="585" y="548" font-family="Arial" font-size="21" fill="#334155">Приглушайте поздний свет;</text><text x="585" y="576" font-family="Arial" font-size="21" fill="#334155">получайте дневной свет.</text>
  <rect x="1018" y="218" width="392" height="392" rx="18" fill="#fde8e8" stroke="#b93636" stroke-width="3"/>
  <circle cx="1078" cy="284" r="40" fill="#b93636"/><text x="1069" y="299" font-family="Arial" font-size="38" font-weight="800" fill="#ffffff">3</text>
  <text x="1048" y="354" font-family="Arial" font-size="29" font-weight="800" fill="#102033">Безопаснее смены</text>
  <text x="1048" y="396" font-family="Arial" font-size="22" fill="#334155">Ночная работа - воздействие,</text><text x="1048" y="424" font-family="Arial" font-size="22" fill="#334155">а не личная вина.</text><text x="1048" y="452" font-family="Arial" font-size="22" fill="#334155">График и отдых важны.</text>
  <text x="1048" y="512" font-family="Arial" font-size="25" font-weight="800" fill="#102033">Общий ориентир</text><text x="1048" y="548" font-family="Arial" font-size="21" fill="#334155">Защищайте работников</text><text x="1048" y="576" font-family="Arial" font-size="21" fill="#334155">ротацией и временем отдыха.</text>
  <rect x="92" y="655" width="625" height="160" rx="16" fill="#102033"/>
  <text x="130" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#ffffff">Системы важны</text>
  <text x="130" y="748" font-family="Arial" font-size="23" fill="#f8fafc">Уход, болезнь, жилье, бедность, опасная работа</text>
  <text x="130" y="778" font-family="Arial" font-size="23" fill="#f8fafc">и стресс нарушают сон. Не обвиняйте тело.</text>
  <rect x="775" y="655" width="635" height="200" rx="18" fill="#ffdf61" stroke="#8a6b05" stroke-width="3"/>
  <text x="814" y="705" font-family="Arial" font-size="31" font-weight="800" fill="#102033">Граница безопасности</text>
  <text x="814" y="748" font-family="Arial" font-size="23" fill="#111827">Совет о сне не диагноз и не лечение рака.</text>
  <text x="814" y="778" font-family="Arial" font-size="23" fill="#111827">Тяжелая бессонница, признаки апноэ, депрессия</text>
  <text x="814" y="808" font-family="Arial" font-size="23" fill="#111827">или опасная усталость требуют помощи.</text>
  <text x="92" y="890" font-family="Arial" font-size="19" fill="#334155">Опоры: IARC о ночной работе; метаанализы рака груди; обзоры света ночью; обзоры сна.</text>
  <text x="92" y="920" font-family="Arial" font-size="16" fill="#64748b">Лучший ритм поддерживает здоровье; он не гарантирует профилактику рака и не стирает рабочие риски.</text>
</svg>
